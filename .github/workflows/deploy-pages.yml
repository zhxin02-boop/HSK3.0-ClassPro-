name: Deploy ClassPro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy uploaded artifact to Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Pages upload did not return an artifact ID.');
            }
            const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
            const oidc = await core.getIDToken();
            core.setSecret(oidc);
            let deployment;
            for (let retry = 0; retry < 6; retry++) {
              try {
                const response = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                  ...context.repo, artifact_id: artifactId,
                  pages_build_version: context.sha, oidc_token: oidc
                });
                deployment = response.data;
                break;
              } catch (error) {
                if (retry === 5 || ![404, 422, 502, 503, 504].includes(error.status)) throw error;
                await pause(5000);
              }
            }
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            core.setOutput('page_url', deployment.page_url);
            const terminal = new Set(['deployment_failed','deployment_perms_error',
              'deployment_content_failed','deployment_cancelled','deployment_lost']);
            for (let poll = 0; poll < 90; poll++) {
              const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                ...context.repo, deploymentId
              }).catch(error => {
                if (error.status === 404 || error.status >= 500) return null;
                throw error;
              });
              const status = response?.data.status;
              if (status === 'succeed') return;
              if (terminal.has(status)) throw new Error('Pages deployment failed: ' + status);
              await pause(5000);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
              ...context.repo, deploymentId
            });
            throw new Error('Pages deployment did not finish in time.');
