<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.0/mqtt.min.js"></script>
<script src="../shared/students.js?v=20260916-1"></script>
<script src="../shared/context.js"></script>
<script src="../data-model/course-data-adapter.js"></script>
<script src="./lesson-data-loader.js?v=20260723-l04-images-5"></script>

<link rel="stylesheet" href="../shared/classpro-theme.css">
<style>
:root{--teach:#4A8FE7;--practice:#E8563A;--battle:#E8563A;--blue:#4A8FE7;--green:#5CC98C;--bg:#FAFAF7;--text:#1A1A2E;--sidebar-bg:#F5F4F0;--line:#E8E6E1;--primary:#E8563A}
*{box-sizing:border-box}
body{font-family:Nunito,Helvetica Neue,sans-serif;background:var(--bg);margin:0;color:var(--text)}
:root{--hanzi-font:KaiTi,STKaiti,"Kaiti SC","楷体","Microsoft YaHei",serif}
.wc-word,.vocab-hanzi,.text-hanzi,.option-hanzi,.chunk-btn,.chunk,.hanzi-font{font-family:var(--hanzi-font)}
#app{min-height:100vh}
.cp-sidebar{position:fixed;left:0;top:0;bottom:0;width:56px;background:var(--sidebar-bg);border-right:0.5px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;z-index:80}
.cp-sidebar .cp-logo{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;cursor:pointer}
.cp-sidebar .sb-btn{width:38px;height:38px;border-radius:10px;border:none;background:transparent;font-size:15px;color:#bbb;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cp-sidebar .sb-btn.active{background:#fff;border:1.5px solid var(--primary);color:var(--primary);font-weight:700}
.cp-sidebar .sb-spacer{flex:1}
.cp-sidebar .sb-bottom{font-size:13px;color:#ccc;cursor:pointer;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}
.cp-sidebar .sb-dot{position:absolute;top:-1px;right:-1px;width:6px;height:6px;border-radius:50%;background:var(--green);border:1.5px solid var(--sidebar-bg)}
.cp-body{margin-left:56px;min-height:100vh;display:flex;flex-direction:column}
.home-screen{min-height:calc(100vh - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.home-title{font-size:36px;font-weight:900;color:var(--primary);margin-bottom:8px}
.home-lesson{font-size:20px;color:#888;margin-bottom:40px}
.home-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:600px;width:100%}
.home-card{padding:35px 20px;border-radius:20px;cursor:pointer;text-align:center;transition:.3s;box-shadow:0 4px 18px rgba(0,0,0,.04);border:1px solid var(--line)}
.home-card:hover{transform:translateY(-4px)}
.home-card .emoji{font-size:48px;margin-bottom:10px}
.home-card .label{font-size:18px;font-weight:800}
.home-card .desc{font-size:13px;margin-top:6px;opacity:.7}
.home-card.teach{background:#EDF3FF;color:#2D5DB8}
.home-card.practice{background:#FFF0EE;color:#C74B3F}
.home-card.battle{background:#E8F8EE;color:#1E6B3A}
.home-card.mock{background:#F3F0FF;color:#4B35A6}
.header{background:#fff;padding:8px 20px;border-bottom:0.5px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.header h1{margin:0;font-size:16px;color:var(--text);cursor:pointer;font-weight:700}
.header-right{display:flex;gap:6px;align-items:center}
.sub-nav{background:#fff;padding:8px 12px;border-bottom:0.5px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sub-group{display:inline-flex;align-items:center;padding:5px 8px;border-radius:10px;background:#E6F1FB}
.sub-group-label{font-size:10px;font-weight:800;color:#0C447C;margin-right:4px}
.sub-btn{padding:4px 10px;font-size:12px;border:none;background:transparent;border-radius:16px;cursor:pointer;font-weight:600;color:#888}
.sub-btn.active{background:#fff;color:var(--text);box-shadow:0 0 0 0.5px rgba(0,0,0,.15)}
.grammar-tab{padding:5px 12px;font-size:12px;font-weight:600;border-radius:20px;cursor:pointer;border:1.5px solid var(--blue);background:#fff;color:var(--blue)}
.grammar-tab.active{background:var(--blue);color:#fff}
.timer-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(145deg,#fff,#f0f0f0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;border:3px solid #e5e7eb}
.timer-ring{position:absolute;top:0;left:0;width:80px;height:80px}
.timer-ring circle{fill:none;stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.timer-ring .bg{stroke:#e5e7eb}
.timer-ring .fg{stroke:var(--green);transition:stroke-dashoffset .3s}
.timer-ring .fg.warn{stroke:#fbbf24}
.timer-ring .fg.danger{stroke:var(--red);animation:pulse .5s infinite}
@keyframes pulse{50%{opacity:.4}}
.timer-num{font-size:26px;font-weight:900;color:var(--text);font-family:Courier New,monospace}
.timer-num.danger{color:var(--red);animation:pulse .5s infinite}
.timer-label{font-size:9px;color:#9ca3af}
.timer-preset{padding:4px 10px;border-radius:15px;border:2px solid #d1d5db;background:#fff;font-size:12px;font-weight:bold;cursor:pointer;color:#555}
.timer-preset.active{border-color:var(--green);background:#E8F6EE;color:var(--green)}
.timer-ctrl{padding:8px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;font-size:13px;color:#fff}
.timer-ctrl.start{background:var(--green)}
.timer-ctrl.reset{background:#9ca3af}
.qw-bar{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:14px;padding:14px 18px;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qw-btn{padding:8px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;border:none;color:#fff}
.qw-btn.start{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.qw-btn.reset{background:#94a3b8}
.qw-btn.lock{background:linear-gradient(135deg,#f59e0b,#d97706)}
.main-content{flex:1;padding:16px 24px;display:flex;gap:15px;justify-content:center;max-width:1200px;margin:0 auto;width:100%}
.panel-area{flex:1;display:flex;flex-direction:column;align-items:center}
.panel{background:#fff;width:100%;padding:28px;border-radius:16px;border:0.5px solid var(--line)}
.word-card{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:15px;text-align:center;cursor:pointer}
.word-card:hover{border-color:var(--blue)}
.word-card .wc-word{font-size:28px;font-weight:900;color:var(--text)}
.word-card .wc-pinyin{font-size:13px;color:#888}
.chunk-btn{padding:10px 18px;font-size:20px;font-weight:bold;background:#fff;border:2px solid #e0e0e0;border-radius:10px;cursor:pointer}
.chunk-btn.in-answer{background:#EDF3FF;border-color:var(--blue);color:#2D5DB8}
.next-btn{display:inline-block;padding:10px 22px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;margin:5px}
.score-sidebar{position:fixed;right:0;top:0;bottom:0;width:230px;background:linear-gradient(180deg,#fff,#f8fafc);z-index:90;display:flex;flex-direction:column;transition:transform .3s}
.score-sidebar.closed{transform:translateX(100%)}
.score-sidebar-header{background:linear-gradient(135deg,#10b981,#059669);padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.score-sidebar-body{flex:1;overflow-y:auto;padding:10px 12px}
.score-row{display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:10px;font-size:12px}
.score-row:nth-child(1){background:linear-gradient(135deg,#fef3c7,#fde68a);font-weight:bold}
.score-row:nth-child(2){background:#f0f0f0;font-weight:bold}
.score-name{flex:1;overflow:hidden}
.score-pts{font-weight:900;color:var(--practice);min-width:22px;text-align:center}
.star-btn{width:100%;padding:12px;background:linear-gradient(135deg,#f59e0b,#eab308);color:#fff;font-weight:900;font-size:14px;cursor:pointer;border:none;margin-top:10px;border-radius:12px}
.star-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
.teach-nav{display:flex;gap:10px;justify-content:center;margin-top:20px;padding-top:15px;border-top:1px solid #eee}
.teach-nav button{padding:8px 16px;font-size:14px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;color:#fff}
.teach-nav .prev{background:#9ca3af}
.teach-nav .next{background:var(--blue)}
.live-panel{width:350px;min-width:350px;background:#fff;display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.live-header{background:linear-gradient(135deg,#1A2980,#26D0CE);color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.answers-area{flex:1;padding:10px;overflow-y:auto}
.formula-box{background:#EDF3FF;border-radius:12px;padding:15px 20px;font-size:20px;font-weight:bold;color:#2D5DB8;text-align:center;margin:10px 0}
.example-row{padding:10px;margin:6px 0;background:#f9fafb;border-radius:8px;border-left:3px solid var(--teach)}
.example-row .cn{font-size:18px;font-weight:600;color:var(--text)}
.example-row .en{font-size:14px;color:#888;font-style:italic}
.pk-question-card{background:#fff;border:4px solid #ffd54f;border-radius:16px;padding:25px;width:100%;text-align:center;margin:15px 0}
.score-block{font-size:48px;font-weight:900;width:80px;text-align:center}
.chunk-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;margin-top:15px}

/* ClassPro+ lite classroom skin: visual-only first pass. */
:root{
--cp-primary:#E8563A;
--cp-primary-soft:#FFF0EC;
--cp-blue:#2F6FD6;
--cp-blue-soft:#EEF5FF;
--cp-green:#26A269;
--cp-green-soft:#EAF8EF;
--cp-ink:#151725;
--cp-muted:#6B7280;
--cp-soft:#F7F7F3;
--cp-card:#FFFFFF;
--cp-line:#E7E3DA;
--cp-shadow:0 18px 50px rgba(26,26,46,.08);
--bg:#F7F7F3;
--text:var(--cp-ink);
--primary:var(--cp-primary);
--blue:var(--cp-blue);
--green:var(--cp-green);
--line:var(--cp-line);
--sidebar-bg:#FFFFFF;
}
body{background:radial-gradient(circle at 18% 0,#fff7f2 0,#f7f7f3 32%,#f4f7fb 100%);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif}
.cp-sidebar{width:72px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-right:1px solid rgba(231,227,218,.9);padding:16px 0;box-shadow:8px 0 28px rgba(21,23,37,.04)}
.cp-sidebar .cp-logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#e8563a,#ff8a66);font-size:15px;font-weight:900;box-shadow:0 12px 26px rgba(232,86,58,.22)}
.cp-sidebar .sb-btn{width:46px;height:46px;border-radius:14px;margin:3px 0;color:#8b8f9b;font-weight:800;background:#fff;border:1px solid transparent}
.cp-sidebar .sb-btn:hover,.cp-sidebar .sb-bottom:hover{background:#FFF7F4;color:var(--cp-primary)}
.cp-sidebar .sb-btn.active{background:var(--cp-primary-soft);border:1px solid rgba(232,86,58,.35);color:var(--cp-primary);box-shadow:0 8px 20px rgba(232,86,58,.10)}
.cp-sidebar .sb-bottom{width:44px;height:38px;border-radius:13px;color:#9CA3AF;font-weight:800}
.cp-body{margin-left:72px}
.header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);padding:14px 28px;border-bottom:1px solid rgba(231,227,218,.85)}
.header h1{font-size:18px;font-weight:900;color:var(--cp-ink)}
.header h1 span{display:inline-flex;margin-left:10px;padding:4px 10px;border-radius:999px;background:var(--cp-blue-soft);color:var(--cp-blue);font-size:12px;font-weight:800;vertical-align:middle}
.header-right>button{border-radius:12px!important;border:1px solid var(--cp-line)!important;background:#fff!important;box-shadow:0 6px 14px rgba(21,23,37,.05)}
.sub-nav{position:sticky;top:61px;z-index:45;justify-content:center;background:rgba(247,247,243,.88);backdrop-filter:blur(18px);padding:12px 20px;border-bottom:0}
.sub-btn{padding:9px 17px;border-radius:999px;background:#fff;border:1px solid var(--cp-line);color:#6b7280;font-size:14px}
.sub-btn.active{background:var(--cp-ink);color:#fff;box-shadow:0 10px 24px rgba(21,23,37,.16)}
.sub-group{background:#fff;border:1px solid var(--cp-line);border-radius:999px;padding:4px}
.sub-group-label{padding:0 8px;color:#748095}
.main-content{max-width:1280px;padding:28px 32px 36px;gap:20px;align-items:flex-start}
.panel-area{min-width:0}
.panel{background:rgba(255,255,255,.94);border:1px solid rgba(231,227,218,.95);border-radius:8px;box-shadow:var(--cp-shadow);padding:32px}
.home-screen{min-height:100vh;padding:52px 28px;background:linear-gradient(135deg,#fff7f2 0,#f7f7f3 48%,#eef5ff 100%)}
.home-title{font-size:42px;color:var(--cp-ink);letter-spacing:0}
.home-title::after{content:"+";color:var(--cp-primary);margin-left:2px}
.home-lesson{color:#616978}
.home-card{border-radius:8px;background:#fff!important;border:1px solid rgba(231,227,218,.95);box-shadow:var(--cp-shadow);color:var(--cp-ink)!important}
.home-card:hover{transform:translateY(-3px);box-shadow:0 22px 58px rgba(26,26,46,.12)}
.grammar-tab{border:1px solid var(--cp-line);background:#fff;color:#667085;border-radius:999px;padding:8px 14px;font-size:13px}
.grammar-tab.active{background:var(--cp-blue);border-color:var(--cp-blue);color:#fff}
.teach-nav{border-top:1px solid var(--cp-line);padding-top:18px}
.teach-nav button,.next-btn{border-radius:999px;padding:10px 20px;box-shadow:none}
.teach-nav .next,.next-btn{background:var(--cp-blue)}
.teach-nav .prev{background:#8B95A5}
.qw-bar{margin:16px 32px 0;border:1px solid #bfd4f8;background:linear-gradient(135deg,#f5f9ff,#eaf2ff);border-radius:8px;box-shadow:0 10px 28px rgba(47,111,214,.08)}
.live-panel{border-radius:8px;border:1px solid var(--cp-line);box-shadow:var(--cp-shadow)}
.live-header{background:linear-gradient(135deg,#2f6fd6,#66b8d9)}
.score-sidebar{box-shadow:-12px 0 34px rgba(21,23,37,.12);border-left:1px solid var(--cp-line)}
.chunk-btn{border-radius:8px;border:1px solid var(--cp-line);box-shadow:0 6px 14px rgba(21,23,37,.05)}
.chunk-btn.in-answer{background:var(--cp-blue-soft);border-color:#a9c5f5;color:var(--cp-blue)}
.pk-question-card{border-radius:8px}
@media(max-width:820px){
.cp-sidebar{width:56px}
.cp-body{margin-left:56px}
.main-content{padding:18px 12px;flex-direction:column}
.home-cards{grid-template-columns:1fr}
.panel{padding:20px}
.live-panel{width:100%;min-width:0}
.sub-nav{top:57px;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
}

/* ClassPro+ stage skin: bolder projection-first pass. */
:root{
--stage-red:#F05A3F;
--stage-red-2:#FF8B66;
--stage-blue:#2563D8;
--stage-cyan:#46B9D8;
--stage-yellow:#FFD166;
--stage-ink:#101321;
--stage-paper:#FFFDF8;
--stage-shadow:0 28px 80px rgba(16,19,33,.16);
}
body{
background:
radial-gradient(circle at 8% 10%,rgba(255,139,102,.28) 0,rgba(255,139,102,0) 30%),
radial-gradient(circle at 88% 16%,rgba(70,185,216,.25) 0,rgba(70,185,216,0) 32%),
linear-gradient(135deg,#fffaf4 0,#f4f7ff 54%,#fff7f1 100%);
}
.cp-sidebar{
background:linear-gradient(180deg,#161927,#22263a);
border-right:0;
box-shadow:14px 0 34px rgba(16,19,33,.18);
}
.cp-sidebar .cp-logo{
background:linear-gradient(135deg,var(--stage-red),var(--stage-yellow));
color:#171827;
font-weight:1000;
}
.cp-sidebar .sb-btn,.cp-sidebar .sb-bottom{background:rgba(255,255,255,.06);color:rgba(255,255,255,.62)}
.cp-sidebar .sb-btn.active{
background:#fff;
color:var(--stage-red);
border-color:#fff;
box-shadow:0 12px 30px rgba(255,255,255,.18);
}
.cp-sidebar .sb-btn:hover,.cp-sidebar .sb-bottom:hover{background:rgba(255,255,255,.14);color:#fff}
.header{
background:linear-gradient(135deg,rgba(16,19,33,.96),rgba(35,39,60,.94));
border-bottom:0;
box-shadow:0 18px 42px rgba(16,19,33,.18);
}
.header h1{color:#fff;font-size:20px;letter-spacing:.2px}
.header h1 span{
background:rgba(255,255,255,.12);
color:#fff;
border:1px solid rgba(255,255,255,.18);
}
.header-right{color:rgba(255,255,255,.72)}
.header-right>button{
background:rgba(255,255,255,.12)!important;
border:1px solid rgba(255,255,255,.18)!important;
color:#fff!important;
}
.sub-nav{
top:69px;
background:rgba(255,253,248,.78);
border-bottom:1px solid rgba(255,255,255,.6);
box-shadow:0 12px 32px rgba(16,19,33,.06);
}
.sub-btn{font-size:15px;padding:10px 20px;border:0;background:#fff;box-shadow:0 8px 18px rgba(16,19,33,.07)}
.sub-btn.active{background:linear-gradient(135deg,var(--stage-red),var(--stage-red-2));box-shadow:0 14px 28px rgba(240,90,63,.26)}
.main-content{max-width:1380px;padding:34px 42px 42px}
.panel{
position:relative;
overflow:hidden;
border:0;
border-radius:22px;
box-shadow:var(--stage-shadow);
background:rgba(255,253,248,.94);
}
.panel::before{
content:"";
position:absolute;
inset:0 0 auto 0;
height:7px;
background:linear-gradient(90deg,var(--stage-red),var(--stage-yellow),var(--stage-cyan),var(--stage-blue));
}
.panel h2,.panel h3{font-size:28px!important;color:var(--stage-ink)!important;letter-spacing:.2px}
.home-screen{
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 20% 20%,rgba(255,209,102,.42) 0,rgba(255,209,102,0) 28%),
radial-gradient(circle at 82% 18%,rgba(37,99,216,.22) 0,rgba(37,99,216,0) 34%),
linear-gradient(135deg,#151827 0,#20243a 52%,#f05a3f 160%);
color:#fff;
}
.home-screen::before{
content:"Chinese ClassPro+";
position:absolute;
right:-40px;
bottom:18px;
font-size:110px;
font-weight:1000;
letter-spacing:-1px;
color:rgba(255,255,255,.055);
white-space:nowrap;
}
.home-title{
position:relative;
font-size:68px;
line-height:1;
color:#fff;
text-shadow:0 16px 42px rgba(0,0,0,.25);
}
.home-title::after{color:var(--stage-yellow)}
.home-lesson{position:relative;color:rgba(255,255,255,.78);font-size:24px;margin-bottom:48px}
.home-cards{position:relative;max-width:920px;gap:24px}
.home-card{
padding:34px 26px 30px;
border-radius:24px;
border:1px solid rgba(255,255,255,.28);
background:rgba(255,255,255,.95)!important;
box-shadow:0 26px 70px rgba(0,0,0,.24);
}
.home-card .emoji{font-size:62px;margin-bottom:16px}
.home-card .label{font-size:24px}
.home-card .desc{font-size:15px}
.home-card.teach{box-shadow:0 26px 70px rgba(37,99,216,.30)}
.home-card.practice{box-shadow:0 26px 70px rgba(240,90,63,.30)}
.home-card.battle{box-shadow:0 26px 70px rgba(38,162,105,.26)}
.home-card.mock{box-shadow:0 26px 70px rgba(96,65,190,.22)}
.home-card:hover{transform:translateY(-8px) scale(1.015)}
.grammar-tab{font-size:14px;padding:9px 16px}
.grammar-tab.active{background:linear-gradient(135deg,var(--stage-blue),var(--stage-cyan));border-color:transparent}
.teach-nav{margin-top:26px;padding-top:22px}
.teach-nav button,.next-btn{font-size:16px;padding:12px 24px}
.live-panel{border:0;border-radius:22px;box-shadow:var(--stage-shadow)}
.live-header{background:linear-gradient(135deg,#151827,#2563d8)}
.qw-bar{border:0;border-radius:20px;background:linear-gradient(135deg,#fff,#eaf4ff);box-shadow:0 18px 42px rgba(37,99,216,.14)}
.chunk-btn{font-size:22px;border-radius:16px;padding:14px 22px}
.score-sidebar{background:#fffdf8}

/* Turn vocabulary into a real classroom stage without touching JS. */
.panel[style*="max-width:960px"]{
max-width:1120px!important;
padding:42px!important;
background:
linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,250,244,.96));
}
.panel[style*="max-width:960px"]>div:first-child{
display:grid!important;
grid-template-columns:minmax(300px,380px) 1fr!important;
gap:44px!important;
align-items:center!important;
}

<script>

<script>

    });

<script>
/* Global pinyin visibility: teacher toggle synced to student clients. */
(function(){
  if(typeof ap==='undefined')return;
  ap.globalPinyinVisible=true;
  var pinyinToneRe=/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙǕǗǙǛÜ]/;
  function markPinyinNodes(){
    var root=document.querySelector('.panel-area');
    if(!root)return;
    root.querySelectorAll('div,span,small').forEach(function(el){
      if(el.children.length||el.getAttribute('data-pinyin')==='1')return;
      var text=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(!text||/[\u4e00-\u9fff]/.test(text)||!pinyinToneRe.test(text))return;
      if(text.length>120||/[.!?]{2,}/.test(text))return;
      el.setAttribute('data-pinyin','1');
    });
  }
  function applyPinyinClass(){markPinyinNodes();document.body.classList.toggle('classpro-hide-pinyin',!ap.globalPinyinVisible)}
  function publishPinyin(){
    if(ap.lastQuestionPayload)ap.lastQuestionPayload.pinyinVisible=ap.globalPinyinVisible;
    if(ap.mq&&ap.cs==='connected'){
      try{ap.mq.publish('classpro/room/'+RM+'/display',JSON.stringify({room:RM,lesson:MT.lessonKey||'',type:'pinyinVisibility',show:ap.globalPinyinVisible,updatedAt:new Date().toISOString()}))}catch(e){}
    }
  }
  window.toggleGlobalPinyin=function(){ap.globalPinyinVisible=!ap.globalPinyinVisible;applyPinyinClass();publishPinyin();ap._r()};
  var oldPubq=ap._pubq;
  ap._pubq=function(){oldPubq.call(this);if(this.lastQuestionPayload)this.lastQuestionPayload.pinyinVisible=this.globalPinyinVisible;publishPinyin()};
  var oldQwe=ap.qwe;
  ap.qwe=function(){oldQwe.call(this);if(this.lastQuestionPayload)this.lastQuestionPayload.pinyinVisible=this.globalPinyinVisible;publishPinyin()};
  var oldR=ap._r;
  ap._r=function(){
    oldR.call(this);applyPinyinClass();
    var host=document.querySelector('.header-right')||document.querySelector('.topbar')||document.body;
    if(!document.getElementById('globalPinyinToggle')){
      var b=document.createElement('button');b.id='globalPinyinToggle';b.type='button';b.className='pinyin-toggle-btn';b.onclick=window.toggleGlobalPinyin;host.insertBefore(b,host.firstChild);
    }
    var btn=document.getElementById('globalPinyinToggle');
    if(btn){btn.classList.toggle('off',!this.globalPinyinVisible);btn.textContent=this.globalPinyinVisible?'隐藏拼音':'显示拼音'}
  };
})();
</script>

<script>
/* Cloud wall: show current-question open responses in the center panel. */
(function(){
  if(typeof ap==='undefined')return;
  var openModes=['subjective','open','open_response','text_output','output','oral','cloud','writing'];
  function normMode(v){return String(v||'').toLowerCase().replace(/-/g,'_')}
  function isOpenMode(v){return openModes.indexOf(normMode(v))>=0}
  function currentQuestion(state){
    return state&&((state.lastQuestionPayload&&state.lastQuestionPayload.question)||(state._cq2&&state._cq2())||null);
  }
  function currentQuestionId(state){
    var q=currentQuestion(state);
    return String(state.currentQuestionId||(state.lastQuestionPayload&&state.lastQuestionPayload.question&&state.lastQuestionPayload.question.id)||(q&&q.id)||'');
  }
  function isOpenQuestion(q,state){
    if(!q)return isOpenMode(state&&state.st);
    return isOpenMode(q.mode||q.type||q.kind||state.st)||q.openEnded===true||q.needsTeacherReview===true||q.cloudWall===true;
  }
  function pictureTalkPrompt(q){
    var d=(q&&q.data)||{},parts=[d.question,d.question_cn,d.taskQuestion,d.displayQuestion,d.sampleAnswer,d.instructions,q&&q.prompt_cn].filter(Boolean);
    for(var i=0;i<parts.length;i++){
      var m=String(parts[i]).match(/[^。；;：:]*[？?]/);
      if(m&&m[0])return m[0].replace(/^\s*\d+[\.、]\s*/,'').trim();
    }
    var p=String(q&&q.prompt_cn||'').replace(/^教学扩展：/,'');
    if(p.indexOf('见面')>=0||p.indexOf('见')>=0)return'我们几点见？';
    return p||'请看图回答问题。';
  }
  function pictureTalkMini(q){
    var question=pictureTalkPrompt(q);
    return '<div class="picture-talk-mini"><b style="color:#3f7f32;white-space:nowrap">看图回答 / Picture Talk</b><div class="picture-talk-mini-question">'+es(question)+'</div></div>';
  }
  function latestOpenRows(state,id){
    var latest={};
    (state.records||[]).forEach(function(r){
      if(!r||String(r.questionId||'')!==id)return;
      if(r.sessionId&&state.sessionId&&r.sessionId!==state.sessionId)return;
      var result=String(r.result||r.autoResult||'').toLowerCase();
      var answer=String(r.answer||r.text||'').trim();
      if(!answer)return;
      if(!isOpenMode(r.mode)&&result!=='review'&&!r.needsReview)return;
      var name=state._rn?state._rn(r.studentName||r.name||'unknown'):String(r.studentName||r.name||'unknown');
      latest[name]=r;
    });
    return Object.keys(latest).map(function(k){return latest[k]}).sort(function(a,b){
      return String(a.studentName||a.name||'').localeCompare(String(b.studentName||b.name||''));
    });
  }
  function renderCloudWall(state,q,rows){
    var title=(q&&q.prompt_cn)||'主观回答';
    var h='<div class="cloud-wall-panel"><div class="cloud-wall-head"><div><h3>云墙 / Cloud Wall</h3><small>当前题：'+es(title)+'</small></div><div class="cloud-wall-count">'+rows.length+' 份回答</div></div>';
    if(state&&state.mt==='practice'&&state.st==='opn')h+=pictureTalkMini(q);
    if(!rows.length)return h+'<div class="cloud-wall-empty">等待学生提交当前题回答...</div></div>';
    h+='<div class="cloud-wall-grid">';
    rows.forEach(function(r,idx){
      var nm=String(r.studentName||r.name||'Student');
      var rot=[-2,1.5,-1,2,.5,-1.5,1,-.5][idx%8],dy=[0,12,-6,8,-10,4,14,-4][idx%8];
      h+='<div class="cloud-wall-card" style="transform:translateY('+dy+'px) rotate('+rot+'deg)" onclick="ap.openCloudReview(\''+es(nm).replace(/'/g,"\\'")+'\',\''+es(r.questionId||'').replace(/'/g,"\\'")+'\')"><div class="cloud-wall-name"><span class="cloud-wall-avatar">'+es(nm.slice(0,1).toUpperCase())+'</span><span>'+es(nm)+'</span>'+(r.cloudScore?'<span style="margin-left:auto;color:#3f7f32">'+es(r.cloudScore)+'分</span>':'')+'</div><div class="cloud-wall-answer">'+es(r.teacherRevision||r.answer||r.text||'')+'</div></div>';
    });
    return h+'</div></div>';
  }
  ap.openCloudReview=function(name,qid){
    var rec=null,n=this._rn?this._rn(name):name;
    for(var i=0;i<(this.records||[]).length;i++){var r=this.records[i];if((this._rn?this._rn(r.studentName||r.name||''):String(r.studentName||r.name||''))===n&&String(r.questionId||'')===String(qid||'')){rec=r;break}}
    if(!rec)return;
    this.cloudReview={name:n,questionId:qid,answer:rec.teacherRevision||rec.answer||rec.text||'',score:rec.cloudScore||0,liked:!!rec.cloudLiked};
    this._r();
  };
  ap.closeCloudReview=function(){var m=document.querySelector('.cloud-review-modal');if(m)m.remove();this.cloudReview=null;this._r()};
  ap.saveCloudReview=function(){
    var cr=this.cloudReview;if(!cr)return;
    var txt=document.getElementById('cloudReviewText'),scoreEl=document.querySelector('input[name="cloudScore"]:checked'),liked=document.getElementById('cloudLiked');
    var nextScore=scoreEl?parseInt(scoreEl.value,10):0,n=cr.name,delta=0;
    for(var i=0;i<(this.records||[]).length;i++){
      var r=this.records[i],rn=this._rn?this._rn(r.studentName||r.name||''):String(r.studentName||r.name||'');
      if(rn===n&&String(r.questionId||'')===String(cr.questionId||'')){delta=nextScore-(r.cloudScore||0);r.teacherRevision=txt?txt.value:r.answer;r.cloudScore=nextScore;r.cloudLiked=liked?liked.checked:false;r.reviewStatus='reviewed';r.result='review';break}
    }
    if(delta&&this._as)this._as(n,delta);
    this._saveClassData&&this._saveClassData();
    this._pubBoard&&this._pubBoard();
    var m=document.querySelector('.cloud-review-modal');if(m)m.remove();
    this.cloudReview=null;this._r();
  };
  function renderCloudReview(state){
    var cr=state.cloudReview;if(!cr)return'';
    var h='<div class="cloud-review-modal"><div class="cloud-review-box"><h3 style="margin:0 0 10px;color:#3f7f32">处理回答 / Review Answer</h3><div style="font-weight:900;margin-bottom:8px">'+es(cr.name)+'</div><textarea id="cloudReviewText">'+es(cr.answer||'')+'</textarea><div class="cloud-score-buttons">';
    for(var i=1;i<=5;i++)h+='<label><input type="radio" name="cloudScore" value="'+i+'" '+(cr.score===i?'checked':'')+'> '+i+'分</label> ';
    h+='</div><label style="display:inline-flex;gap:6px;align-items:center;font-weight:900;color:#3f7f32"><input id="cloudLiked" type="checkbox" '+(cr.liked?'checked':'')+'> 点赞</label><div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px"><button class="next-btn" style="background:#9ca3af" onclick="ap.closeCloudReview()">取消</button><button class="next-btn" onclick="ap.saveCloudReview()">保存</button></div></div></div>';
    return h;
  }
  var oldRender=ap._r;
  ap._r=function(){
    oldRender.call(this);
    var old=document.querySelector('.cloud-wall-panel');if(old)old.remove();
    document.querySelectorAll('.cloud-review-modal').forEach(function(x){x.remove()});
    document.body.classList.remove('cloud-wall-active');
    if(this.mt!=='practice'||['opn','v2g','v3b','g2p','t3c','t2k'].indexOf(this.st)<0||(this.qp!=='answering'&&this.qp!=='published'))return;
    var q=currentQuestion(this),id=currentQuestionId(this);
    if(!id)return;
    var rows=latestOpenRows(this,id),shouldShow=(this.qp==='answering'||this.qp==='published'||rows.length>0)&&(isOpenQuestion(q,this)||rows.length>0);
    if(!shouldShow)return;
    var panel=document.querySelector('.panel-area>.panel')||document.querySelector('.panel-area');
    if(!panel)return;
    var box=document.createElement('div');box.innerHTML=renderCloudWall(this,q,rows);
    panel.parentNode.insertBefore(box.firstChild,panel.nextSibling);
    document.body.classList.add('cloud-wall-active');
    if(this.cloudReview){var m=document.createElement('div');m.innerHTML=renderCloudReview(this);document.body.appendChild(m.firstChild)}
  };
})();
</script>
<script>
/* Picture talk: data-driven open response practice for time and schedule prompts. */
(function(){
  if(typeof ap==='undefined')return;
  function pictureTalkQuestions(){
    return Q.r4_picture_talk||Q.picture_talk||Q.pictureTalk||Q.output_picture_talk||[];
  }
  function question(index){
    var q=pictureTalkQuestions()[index||0]||null;
    if(!q)return null;
    var data=Object.assign({},q.data||{});
    data.image=data.image||(q.media&&q.media.image)||'';
    return Object.assign({},q,{type:q.type||'oral',openEnded:true,needsTeacherReview:true,cloudWall:true,data:data});
  }
  function simpleQuestion(q){
    var d=(q&&q.data)||{},parts=[d.question,d.question_cn,d.taskQuestion,d.displayQuestion,d.sampleAnswer,d.instructions,q&&q.prompt_cn].filter(Boolean);
    for(var i=0;i<parts.length;i++){
      var m=String(parts[i]).match(/[^。；;：:]*[？?]/);
      if(m&&m[0])return m[0].replace(/^\s*\d+[\.、]\s*/,'').trim();
    }
    var p=String(q&&q.prompt_cn||'').replace(/^教学扩展：/,'');
    if(p.indexOf('见面')>=0||p.indexOf('见')>=0)return'我们几点见？';
    return p||'请看图回答问题。';
  }
  function studentQuestion(index){
    var q=question(index);
    if(!q)return null;
    var data=Object.assign({},q.data||{});
    delete data.context;
    delete data.sampleAnswer;
    data.instructions=data.instructions||'请用中文回答这个问题。';
    return Object.assign({},q,{mode:'open_response',type:'open_response',prompt_cn:simpleQuestion(q),prompt_en:'Look at the picture and answer the question.',data:data});
  }
  function scaffoldHtml(d){
    var s=d.scaffold||{},words=s.words||[],phrases=s.phrases||[],frames=s.frames||[];
    if(!words.length&&!phrases.length&&!frames.length)return'';
    function chips(arr,cls){return arr.map(function(x){return'<span class="'+cls+'">'+es(x)+'</span>'}).join('')}
    var h='<div class="picture-talk-scaffold">';
    if(words.length)h+='<div><b>1. 先选词</b><div>'+chips(words,'picture-talk-chip')+'</div></div>';
    if(phrases.length)h+='<div><b>2. 再用短语</b><div>'+chips(phrases,'picture-talk-chip phrase')+'</div></div>';
    if(frames.length)h+='<div><b>3. 可以套句框</b><div>'+chips(frames,'picture-talk-frame')+'</div></div>';
    return h+'</div>';
  }
  function renderPictureTalk(state){
    var qs=pictureTalkQuestions(),i=state.opni||0,c=question(i);
    if(!c)return'<div class="panel"><p>暂无图说题。</p></div>';
    var d=c.data||{},img=d.image?'<img src="'+es(d.image)+'" alt="" style="width:100%;max-height:280px;object-fit:contain;border-radius:16px;background:#fff">':'<div style="font-size:24px;font-weight:900;color:#74806d">Picture prompt</div>';
    var compact=state.qp==='answering'||state.qp==='published';
    var typeLabel=es(d.patternType||d.typeLabel||'图说输出');

<script>
/* Final HSK3 text teaching override: keep every text in the new teaching shell. */
(function(){
  if(typeof ap==='undefined'||!window.LESSON_DATA||!LESSON_DATA.meta||LESSON_DATA.meta.level!=='HSK3')return;
  function linkMap(links){
    var out=[];
    (links||[]).forEach(function(x){
      var terms=Array.isArray(x.terms)?x.terms:[x.label||''];
      terms.forEach(function(t){if(t)out.push({term:t,use:x.use||''})});
    });
    return out.sort(function(a,b){return b.term.length-a.term.length});
  }
  function markText(text,links){
    var s=es(text||''),items=linkMap(links);
    items.forEach(function(x){
      var term=es(x.term),tip=es(x.use);
      if(!term)return;
      s=s.split(term).join('<span class="hsk3-lang-mark" title="'+tip+'">'+term+'<span>'+tip+'</span></span>');
    });
    return s;
  }
  function lineRows(cur,mode,links){
    if(!cur||!Array.isArray(cur.lines))return '';
    return cur.lines.map(function(l){
      var body=mode===3
        ? '<div class="hsk3-text-en-only">'+es(l.english||'')+'</div>'
        : '<div class="text-hanzi hsk3-text-hanzi">'+markText(l.hanzi||'',links)+'</div>';
      return '<div class="hsk3-original-line"><div class="hsk3-text-speaker">'+es(l.speaker||'')+'</div>'+body+'</div>';
    }).join('');
  }
  function passageBlock(cur,mode,links){
    if(cur&&cur.passage){
      if(mode===3)return '<div class="hsk3-text-line"><div class="hsk3-text-en-only">'+es(cur.passage.english||'')+'</div></div>';
      return '<div class="hsk3-text-line"><div class="text-hanzi hsk3-text-hanzi">'+markText(cur.passage.hanzi||'',links)+'</div></div>';
    }
    return lineRows(cur,mode,links);
  }
  function modeTabs(mode){
    return '<div class="hsk3-text-mode-tabs"><button class="grammar-tab'+(mode!==3?' active':'')+'" onclick="ap.st=\'tt\';ap.tmode=1;ap._r()">汉字</button><button class="grammar-tab'+(mode===3?' active':'')+'" onclick="ap.st=\'tt\';ap.tmode=3;ap._r()">English</button><button class="grammar-tab" onclick="ap.st=\'ttq\';ap.ttqi=0;ap.ttqa=false;ap.ttqp=-1;ap.qp=\'idle\';ap._r()">问答 Q&amp;A</button></div>';
  }
  function textTabs(tx,idx){
    var h='<div class="hsk3-text-tabs">';
    tx.forEach(function(t,i){h+='<button class="grammar-tab'+(idx===i?' active':'')+'" onclick="ap.st=\'tt\';ap.ti='+i+';ap.tmode=1;ap.tl=0;ap._r()">'+es(t.title||('课文 '+(i+1)))+'</button>'});
    return h+'</div>';
  }
  function section(title,body){

  }
  function peopleGrid(people){
    return '<div class="hsk3-people-grid portrait">'+people.map(function(p){
      return '<div class="hsk3-person portrait">'+(p.avatar?'<img src="'+es(p.avatar)+'" alt="'+es(p.name||'')+'">':'')+'<div><b>'+es(p.name||'')+'</b><small>'+es(p.nameEn||'')+'</small><span>'+es(p.roleEn||p.role||'')+'</span><em>'+es(p.goalEn||p.goal||'')+'</em></div></div>';
    }).join('')+'</div>';
  }
  function languageLegend(links){
    if(!links||!links.length)return '';
    return '<div class="hsk3-inline-legend">'+links.map(function(x){return'<div><b>'+es(x.label||'')+'</b><span>'+es(x.use||'')+'</span></div>'}).join('')+'</div>';
  }
  function retell(note){
    var r=note.retellScaffold||{},nodes=r.nodes||[];
    if(!nodes.length)return '';
    var map='<div class="hsk3-retell-map">'+nodes.map(function(n,i){return'<div class="hsk3-retell-node"><b>'+es(n.label||'')+'</b><span>'+es(n.hint||'')+'</span></div>'+(i<nodes.length-1?'<div class="hsk3-retell-arrow">→</div>':'')}).join('')+'</div>';
    return section('5. Retell / 复述', '<p class="hsk3-section-hint">'+es(r.promptEn||'Use the map to retell the text in Chinese.')+'</p>'+map+'<div class="hsk3-retell-frame text-hanzi">'+es(r.frame||'')+'</div>');
  }
  ap._tt=function(){

    return h;
  };

<script>
/* HSK3 battle games: game-first competition layer, isolated from legacy HSK1 PK. */
(function(){
  if(typeof ap==='undefined'||!window.LESSON_DATA||!LESSON_DATA.meta||LESSON_DATA.meta.level!=='HSK3')return;
  var BG=(Q&&Q.battleGames)||{};
  var oldSnav=ap._snav,oldCnt=ap._cnt;
  function list(kind){return BG&&BG[kind]||[]}
  function gameTab(st,cn,en){return'<button class="hsk3-battle-tab '+(ap.st===st?'active':'')+'" onclick="ap.st=\''+st+'\';ap._r()"><span>'+cn+'</span><small>'+en+'</small></button>'}
  function teams(){
    var out=[];
    if(ap.pkt&&ap.pkt.length){for(var i=0;i<ap.pkt.length;i++)out.push({label:'Team '+(i+1),names:ap.pkt[i]||[],color:['#ef4444','#3b82f6','#22c55e','#f59e0b'][i%4]})}
    else out=[{label:'Team 1',names:[],color:'#ef4444'},{label:'Team 2',names:[],color:'#3b82f6'}];
    return out;
  }
  function scoreControls(){
    var ts=teams(),h='<div class="hsk3-battle-score">';
    ts.forEach(function(t,i){h+='<div style="--team:'+t.color+'"><b>'+es(t.label)+'</b><span>'+es((t.names||[]).join(' / ')||'Add students in PK setup later')+'</span><button onclick="hsk3BattleAdd('+i+',1)">+1</button><button onclick="hsk3BattleAdd('+i+',2)">+2</button><button onclick="hsk3BattleAdd('+i+',3)">+3</button></div>'});
    return h+'</div>';
  }
  window.hsk3BattleAdd=function(team,pts){
    var t=teams()[team],names=t&&t.names||[];
    if(!names.length){ap.pks=ap.pks||[];ap.pks[team]=(ap.pks[team]||0)+pts;ap._r();return}
    names.forEach(function(n){ap._as(n,pts)});
    ap._r();
  };
  function nav(idx,total,kind){
    return'<div class="hsk3-battle-controls"><button onclick="ap.'+kind+'i=Math.max(0,(ap.'+kind+'i||0)-1);ap._r()">Previous</button><strong>'+(idx+1)+' / '+total+'</strong><button onclick="ap.'+kind+'i=Math.min('+(total-1)+',(ap.'+kind+'i||0)+1);ap._r()">Next</button></div>';
  }
  ap._hsk3BattleUndercover=function(){
    var qs=list('undercover'),i=Math.max(0,Math.min(this.bwgi||0,qs.length-1)),d=qs[i]||{},show=!!this.bwgReveal;
    if(!qs.length)return'<div class="hsk3-battle-stage"><p>No undercover games yet.</p></div>';
    var h='<div class="hsk3-battle-stage undercover"><div class="hsk3-battle-hero"><div><div class="hsk3-battle-kicker">HIDDEN ROLE GAME</div><h2>谁是卧底</h2><p>Students describe the word in Chinese. Find the different card.</p></div><div class="hsk3-battle-badge">+3 detective bonus</div></div>';
    h+='<div class="hsk3-undercover-grid">'+(d.cards||[]).map(function(w,k){return'<button class="hsk3-undercover-card '+(show?'open':'')+'"><small>Player '+(k+1)+'</small><b>'+(show?es(w):'?')+'</b><span>'+(show&&w===d.undercover?'Undercover':'Describe only')+'</span></button>'}).join('')+'</div>';
    h+='<div class="hsk3-battle-panel"><h3>'+es(d.title||'')+'</h3><p>'+es(d.rule||'')+'</p><div class="hsk3-battle-chips">'+(d.usefulLanguage||[]).map(function(x){return'<span>'+es(x)+'</span>'}).join('')+'</div><div class="hsk3-battle-tip">'+es(d.teacherHint||'')+'</div></div>';
    h+='<div class="hsk3-battle-actions"><button onclick="ap.bwgReveal=!ap.bwgReveal;ap._r()">'+(show?'Hide Cards':'Reveal Cards')+'</button><button onclick="ap.bwgReveal=false;ap.bwgi=Math.floor(Math.random()*'+qs.length+');ap._r()">Random Round</button></div>'+scoreControls()+nav(i,qs.length,'bwg')+'</div>';
    return h;
  };
  ap._hsk3BattleRoulette=function(){
    var qs=list('roulette'),i=Math.max(0,Math.min(this.brgi||0,qs.length-1)),d=qs[i]||{};
    if(!qs.length)return'<div class="hsk3-battle-stage"><p>No roulette games yet.</p></div>';
    var spinning=!!this.brgSpin;
    var h='<div class="hsk3-battle-stage roulette"><div class="hsk3-battle-hero"><div><div class="hsk3-battle-kicker">RANDOM SPEAKING CHALLENGE</div><h2>机场任务轮盘</h2><p>Spin, speak fast, win points. Best natural Chinese gets bonus points.</p></div><div class="hsk3-roulette-disc '+(spinning?'spin':'')+'">GO</div></div>';
    h+='<div class="hsk3-battle-panel large"><h3>'+es(d.challenge||'')+'</h3><p>'+es(d.scene||'')+'</p><div class="hsk3-battle-chips">'+(d.keywords||[]).map(function(x){return'<span>'+es(x)+'</span>'}).join('')+'</div><details><summary>Sample answer</summary><div>'+es(d.sample||'')+'</div></details></div>';
    h+='<div class="hsk3-battle-actions"><button onclick="hsk3SpinRoulette()">Spin Challenge</button><button onclick="ap.timerOn=true;ap._stt(20);ap._stt2();ap._r()">20s Timer</button></div>'+scoreControls()+nav(i,qs.length,'brg')+'</div>';
    return h;
  };
  window.hsk3SpinRoulette=function(){
    var qs=list('roulette');ap.brgSpin=true;ap._r();
    setTimeout(function(){ap.brgi=Math.floor(Math.random()*Math.max(1,qs.length));ap.brgSpin=false;ap._r()},850);
  };
  ap._hsk3BattleRelay=function(){
    var qs=list('relay'),i=Math.max(0,Math.min(this.bdgi||0,qs.length-1)),d=qs[i]||{},step=this.bdStep||0,chain=d.sampleChain||[];
    if(!qs.length)return'<div class="hsk3-battle-stage"><p>No relay games yet.</p></div>';
    var h='<div class="hsk3-battle-stage relay"><div class="hsk3-battle-hero"><div><div class="hsk3-battle-kicker">PASS AND BUILD</div><h2>击鼓传花：句子接力</h2><p>When the drum stops, the student continues the sentence.</p></div><button class="hsk3-drum" onclick="hsk3DrumPick()">DRUM</button></div>';
    h+='<div class="hsk3-relay-line"><small>Starter</small><b>'+es(d.starter||'')+'</b><span>'+es(d.goal||'')+'</span></div>';
    h+='<div class="hsk3-battle-chips strong">'+(d.mustUse||[]).map(function(x){return'<span>'+es(x)+'</span>'}).join('')+'</div>';
    h+='<div class="hsk3-chain-board">'+chain.map(function(x,k){return'<div class="'+(k<=step?'on':'')+'"><small>S'+(k+1)+'</small><span>'+es(k<=step?x:'...')+'</span></div>'}).join('')+'</div>';
    h+='<div class="hsk3-battle-actions"><button onclick="ap.bdStep=Math.min('+Math.max(0,chain.length-1)+',(ap.bdStep||0)+1);ap._r()">Show Next Link</button><button onclick="ap.bdStep=0;ap._r()">Reset Chain</button><button onclick="ap.timerOn=true;ap._stt(15);ap._stt2();ap._r()">15s Timer</button></div>'+scoreControls()+nav(i,qs.length,'bdg')+'</div>';
    return h;
  };
  window.hsk3DrumPick=function(){ap.psm=true;ap._sp();ap._r()};
  ap._snav=function(){
    if(this.mt==='battle')return'<div class="hsk3-battle-nav">'+gameTab('bwg','谁是卧底','Undercover')+gameTab('brg','任务轮盘','Roulette')+gameTab('bdg','击鼓传花','Relay')+'</div>';
    return oldSnav.call(this);
  };
  ap._cnt=function(){
    if(this.mt==='battle'){
      if(['bwg','brg','bdg'].indexOf(this.st)<0)this.st='bwg';
      if(this.st==='bwg')return this._hsk3BattleUndercover();
      if(this.st==='brg')return this._hsk3BattleRoulette();
      if(this.st==='bdg')return this._hsk3BattleRelay();
    }
    return oldCnt.call(this);
  };
})();
</script>

<script>
/* HSK3 practice layer 1: Scene Sentence Choice. */
(function(){
  if(typeof ap==='undefined'||!window.LESSON_DATA||!LESSON_DATA.meta||LESSON_DATA.meta.level!=='HSK3')return;
  function qs(){return Q.scene_sentence_choice||[]}
  function prepFill(q){
    var d=q&&q.data;
    if(!d||!Array.isArray(d.wordBank)||d._wordBankShuffled)return q;
    var pys=Array.isArray(d.wordBank_pinyin)?d.wordBank_pinyin.slice():[];
    var rows=d.wordBank.map(function(w,i){return{w:w,p:pys[i]||py(w)}});
    sh(rows);
    d.wordBank=rows.map(function(x){return x.w});
    d.wordBank_pinyin=rows.map(function(x){return x.p});
    d._wordBankShuffled=true;
    return q;
  }
  function infoQs(){return Q.info_match||Q.infoMatch||Q.information_match||[]}
  function prepInfo(q){
    var d=q&&q.data,pairs=d&&d.pairs||[];
    if(!d||!pairs.length)return q;
    if(!d._orderShuffled){
      d.order=Array.isArray(d.order)&&d.order.length?d.order.slice():sh(pairs.map(function(_,i){return i}));
      d._orderShuffled=true;
    }
    return q;
  }
  function infoKey(q){
    var pairs=(q&&q.data&&q.data.pairs)||[];
    return pairs.map(function(p){return p.left+'：'+p.right}).join('；');
  }
  function listFor(state){
    if(state==='v6d')return Q.v6_description_guess||[];
    if(state==='v2g')return Q.v2_say_guess||[];
    if(state==='v3b')return Q.v3_blind_box||[];
    if(state==='g2p')return Q.g2_picture_complete||[];
    if(state==='r3r')return Q.r3_independent_reading||[];
    if(state==='r4p')return Q.r4_paragraph_fill||[];
    if(state==='t3c')return Q.t3_chain_sentence||[];
    if(state==='t2k')return Q.t2_task_card||[];
    return [];
  }
  function propFor(state){
    return state==='v6d'?'v6di':state==='v2g'?'v2gi':state==='v3b'?'v3bi':state==='g2p'?'g2pi':state==='r3r'?'r3ri':state==='r4p'?'r4pi':state==='t3c'?'t3ci':'t2ki';
  }
  function resetPracticeState(){
    ap.qp='idle';
    ap.qsub={};
    ap.lastQuestionPayload=null;
    ap.currentQuestionId=null;
  }
  window.resetHsk3PracticeState=resetPracticeState;
  function prepChoice(q){
    var d=q&&q.data;
    if(!d||!Array.isArray(d.options)||d._optionsShuffled)return q;
    var correct=typeof d.correct_index==='number'?d.options[d.correct_index]:(q.correct_answer||d.correct_answer);
    var pys=Array.isArray(d.options_pinyin)?d.options_pinyin.slice():[];
    var rows=d.options.map(function(w,i){return{w:w,p:pys[i]||py(w)}});
    sh(rows);
    d.options=rows.map(function(x){return x.w});
    d.options_pinyin=rows.map(function(x){return x.p});
    d.correct_index=d.options.indexOf(correct);
    d._optionsShuffled=true;
    return q;
  }
  function resetScene(){
    ap.scnp=-1;
    ap.scna=false;
    ap.qp='idle';
    ap.qsub={};
    ap.lastQuestionPayload=null;
    ap.currentQuestionId=null;
  }
  function button(state,label,en){
    var extra=state==='scn'?"ap.scni=ap.scni||0;resetSceneChoice();":"resetHsk3PracticeState();";
    return '<button class="sub-btn hsk3-practice-tab'+(ap.st===state?' active':'')+'" onclick="ap.st=\''+state+'\';'+extra+'ap._r()">'+label+'<small>'+en+'</small></button>';
  }
  function controlBar(state,total,idx){

      return '<details class="hsk3-reading-qa"><summary><span>Q'+(j+1)+'</span>'+rubyLine(q.question||q.question_cn||'',q.question_pinyin||'',20)+'</summary><div class="text-hanzi">'+rubyLine(q.answer||'',q.answer_pinyin||'',22)+'</div></details>';
    }).join('')+'</div>';
    h+='<div class="hsk3-reading-teacher"><b>Teacher move</b><span>Ask students to answer in Chinese first. Then open the answer and compare wording.</span></div>';
    h+='<div class="teach-nav"><button class="prev" onclick="ap.ttqi=Math.max(0,ap.ttqi-1);ap.ttqa=false;ap.ttqp=-1;ap.qp=\'idle\';ap._r()"'+(i===0?' disabled':'')+'>&larr; 上一篇</button><span class="step-counter">'+(i+1)+' / '+qs.length+'</span><button class="next" onclick="ap.ttqi=Math.min('+(qs.length-1)+',ap.ttqi+1);ap.ttqa=false;ap.ttqp=-1;ap.qp=\'idle\';ap._r()"'+(i>=qs.length-1?' disabled':'')+'>下一篇 &rarr;</button></div></div>';
    return h;
  };
})();
</script>

<script>
/* Final HSK3 battle routing. Keep this after all other HSK3 wrappers. */
(function(){
  if(typeof ap==='undefined'||!window.LESSON_DATA||!LESSON_DATA.meta||LESSON_DATA.meta.level!=='HSK3')return;
  var previousSnav=ap._snav,previousCnt=ap._cnt,BG=(Q&&Q.battleGames)||{};
  function tab(st,cn,en){
    return '<button class="hsk3-battle-tab '+(ap.st===st?'active':'')+'" onclick="ap.st=\''+st+'\';ap._r()"><span>'+cn+'</span><small>'+en+'</small></button>';
  }
  function items(kind){return BG[kind]||[]}
  function roster(){return (ap.as&&ap.as.length?ap.as:(ap.roster||[])).filter(Boolean)}
  function escText(v){return es(String(v||''))}
  function records(){return ap.hsk3BattleRecords=ap.hsk3BattleRecords||[]}
  function question(){var qs=items('roulette');return qs[Math.max(0,Math.min(ap.brgi||0,qs.length-1))]||{challenge:'请用本课词语说一句话。',scene:'教师可口头补充情境。',keywords:[]}}
  function relay(){var qs=items('relay');return qs[Math.max(0,Math.min(ap.bdgi||0,qs.length-1))]||{starter:'今天',goal:'接一个短语或短句。',mustUse:[]}}
  function monopolyTasks(){
    if(BG.monopoly&&Array.isArray(BG.monopoly.tasks)&&BG.monopoly.tasks.length)return BG.monopoly.tasks;
    var words=(typeof V!=='undefined'&&Array.isArray(V)?V:[]).filter(function(x){return x&&(x.hanzi||x.word)}),tasks=[];
    words.slice(0,6).forEach(function(w,i){var word=w.hanzi||w.word,py=w.pinyin||word,en=w.english||w.meaning||'';tasks.push({kind:'yellow',title:'拼音写汉字 / Pinyin → Hanzi',prompt:'请根据拼音写出并读出汉字：'+py,answer:word});tasks.push({kind:'green',title:'组词 / Make a phrase',prompt:'请用“'+word+'”说一个短语。',answer:(w.phrases&&w.phrases[0])||('答案合理即可；参考词：'+word)});if(i<4)tasks.push({kind:'blue',title:'选择 / Multiple Choice',prompt:'“'+word+'”最接近哪一个意思？',options:[en||'本课词义','与本课无关','人物姓名'],answer:en||'请教师根据本课词义判断'});});
    var grammars=typeof G!=='undefined'&&Array.isArray(G)?G:[];grammars.slice(0,4).forEach(function(g){tasks.push({kind:'red',title:'造句 / Make a sentence',prompt:'请用“'+(g.title||g.structure||'本课语法')+'”说一句话。',answer:(g.examples&&g.examples[0]&&(g.examples[0].hanzi||g.examples[0]))||'答案合理即可'});});
    if(!tasks.length)tasks=[{kind:'red',title:'造句 / Make a sentence',prompt:'请用本课词语说一句完整的话。',answer:'答案合理即可'}];
    return tasks;
  }
  function monopolyTiles(){return['start','yellow','green','plus','blue','red','green','minus','yellow','star','blue','red','plus','green','yellow','skull','minus','blue','red','finish']}
  function monopolyPos(i){var row,col;if(i<6){row=1;col=i+1}else if(i<11){row=i-4;col=6}else if(i<16){row=6;col=16-i}else{row=21-i;col=1}return'grid-row:'+row+';grid-column:'+col}
  function monopolyState(){if(!ap.monopoly)ap.monopoly={started:false,players:[],turn:0,dice:0,pending:null,message:'请选择两名学生或两队开始游戏。',winner:''};return ap.monopoly}
  function monopolyPlayerOptions(selected){var names=roster(),fallback=['第一队','第二队'];if(!names.length)names=fallback;return names.map(function(n){return'<option '+(n===selected?'selected':'')+'>'+escText(n)+'</option>'}).join('')}
  function monopolyTileLabel(type){return({start:'开始',finish:'终点',yellow:'写字',green:'组词',blue:'选择',red:'造句',plus:'+2',minus:'−2',star:'+20',skull:'−3'})[type]||type}
  function monopolySwitch(s){s.turn=(s.turn+1)%s.players.length}
  function monopolyAward(s,teamIndex,delta,message,done){
    var p=s.players[teamIndex],start=p.coins,steps=Math.max(1,Math.abs(delta)),step=0;
    s.scoring=true;s.scoreTeam=teamIndex;s.scoreDelta=delta;s.message=message;
    setTimeout(function tick(){
      if(ap.monopoly!==s)return;
      step++;p.coins=Math.round(start+delta*step/steps);
      var number=document.getElementById('hsk3-monopoly-score-'+teamIndex);if(number)number.textContent=p.coins;
      if(step<steps){setTimeout(tick,35);return}
      setTimeout(function(){if(ap.monopoly!==s)return;s.scoring=false;s.scoreTeam=-1;s.scoreDelta=0;if(done)done();ap._r()},500)
    },120)
  }
  function monopolyResolve(s,depth){
    var p=s.players[s.turn],tiles=monopolyTiles(),type=tiles[p.pos];
    if(p.pos>=tiles.length-1){s.winner=p.name;s.message=p.name+' 到达终点，赢得本局！';return}
    if(type==='plus'||type==='minus'||type==='skull'){
      var move=type==='plus'?2:type==='minus'?-2:-3;p.pos=Math.max(0,Math.min(tiles.length-1,p.pos+move));s.message=p.name+(move>0?' 前进 ':' 后退 ')+Math.abs(move)+' 格。';if((depth||0)<2){monopolyResolve(s,(depth||0)+1);return}monopolySwitch(s);return;
    }
    if(type==='star'){monopolyAward(s,s.turn,20,p.name+' 获得奖励 20 金币！',function(){monopolySwitch(s)});return}
    if(['yellow','green','blue','red'].indexOf(type)>=0){var pool=monopolyTasks().filter(function(x){return x.kind===type}),all=monopolyTasks();s.pending={type:type,task:(pool.length?pool:all)[Math.floor(Math.random()*(pool.length?pool.length:all.length))]};s.message='请完成当前任务，等待教师判定。';return}
    monopolySwitch(s);
  }
  function recordList(mode){return records().filter(function(x){return x.mode===mode}).slice(-8).reverse()}
  function recordHtml(mode){var rows=recordList(mode);if(!rows.length)return'<div class="hsk3-battle-records empty">本轮还没有记录。</div>';return'<div class="hsk3-battle-records">'+rows.map(function(x){return'<div><b>'+escText(x.student)+'</b><span>'+escText(x.answer)+'</span><em class="'+(x.ok?'ok':'help')+'">'+(x.ok?'完成':'需帮助')+'</em></div>'}).join('')+'</div>'}
  window.hsk3RouletteSpin=function(){var names=roster(),qs=items('roulette');if(!names.length)return;ap.brgSpin=true;ap._r();setTimeout(function(){ap.brgStudent=names[Math.floor(Math.random()*names.length)];if(qs.length)ap.brgi=Math.floor(Math.random()*qs.length);ap.brgSpin=false;ap.brgAnswer='';ap._r()},1000)};
  window.hsk3DrumPick=function(){var names=roster();if(!names.length)return;ap.bdgBeat=true;ap._r();setTimeout(function(){ap.bdgStudent=names[Math.floor(Math.random()*names.length)];ap.bdgBeat=false;ap.bdgAnswer='';ap._r()},850)};
  window.hsk3BattleRecord=function(mode,ok){var input=document.getElementById(mode==='roulette'?'battleRouletteAnswer':'battleDrumAnswer'),answer=(input&&input.value||'').trim(),student=mode==='roulette'?ap.brgStudent:ap.bdgStudent;if(!student||!answer){alert('请先点名并记录学生答案。');return}records().push({mode:mode,student:student,answer:answer,ok:!!ok,at:new Date().toLocaleTimeString()});if(mode==='roulette'){ap.brgAnswer='';ap._r()}else{ap.bdgAnswer='';hsk3DrumPick()}};
  window.hsk3MonopolyStart=function(){var a=document.getElementById('monopolyPlayerA'),b=document.getElementById('monopolyPlayerB'),n1=(a&&a.value)||'第一队',n2=(b&&b.value)||'第二队';ap.monopoly={started:true,players:[{name:n1,pos:0,coins:100,skip:0,color:'green'},{name:n2,pos:0,coins:100,skip:0,color:'orange'}],turn:0,dice:0,pending:null,message:n1+' 先掷骰子。',winner:''};ap._r()};
  window.hsk3MonopolyReset=function(){ap.monopoly=null;ap._r()};
  window.hsk3MonopolyRoll=function(){
    var s=monopolyState();if(!s.started||s.pending||s.winner||s.rolling||s.scoring)return;var teamIndex=s.turn,p=s.players[teamIndex];
    if(p.skip>0){p.skip--;s.message=p.name+' 本轮暂停一次，轮到下一队。';monopolySwitch(s);ap._r();return}
    s.rolling=true;s.rollingTeam=teamIndex;s.dice=0;s.message=p.name+' 正在掷骰子……';ap._r();
    setTimeout(function(){if(ap.monopoly!==s||!s.rolling)return;var result=1+Math.floor(Math.random()*6);s.dice=result;p.lastDice=result;p.pos=Math.min(monopolyTiles().length-1,p.pos+result);s.rolling=false;s.rollingTeam=-1;s.lastMoved=teamIndex;s.message=p.name+' 掷出 '+result+' 点，棋子落在第 '+(p.pos+1)+' 格。';monopolyResolve(s,0);ap._r();setTimeout(function(){if(ap.monopoly===s&&s.lastMoved===teamIndex){s.lastMoved=-1;ap._r()}},700)},900)
  };
  window.hsk3MonopolyJudge=function(ok){var s=monopolyState();if(!s.pending||s.scoring)return;var teamIndex=s.turn,p=s.players[teamIndex];s.pending=null;if(ok){monopolyAward(s,teamIndex,10,p.name+' 回答正确，获得 10 金币！',function(){monopolySwitch(s)});ap._r();return}p.skip+=1;s.message=p.name+' 需要再想一想，下轮暂停一次。';monopolySwitch(s);ap._r()};
  ap._hsk3BattleRoulette=function(){var q=question(),names=roster(),spinning=!!this.brgSpin,selected=this.brgStudent||'点击轮盘随机点名';var h='<div class="hsk3-battle-stage task-roulette"><div class="hsk3-battle-hero"><div><div class="hsk3-battle-kicker">RANDOM NAME · SPEAKING TASK</div><h2>任务轮盘</h2><p>转到学生姓名；右侧题卡立即开始口语任务。</p></div></div><div class="hsk3-roulette-layout"><div class="hsk3-wheel-zone"><button class="hsk3-task-wheel '+(spinning?'spin':'')+'" onclick="hsk3RouletteSpin()"><span>开始<br>点名</span></button><div class="hsk3-wheel-names">'+names.slice(0,10).map(function(n){return'<span>'+escText(n.split(' ')[0])+'</span>'}).join('')+'</div><div class="hsk3-picked-name">'+escText(selected)+'</div><button class="hsk3-battle-primary" onclick="hsk3RouletteSpin()">'+(spinning?'轮盘转动中…':'转动任务轮盘')+'</button></div><div class="hsk3-task-card"><div class="hsk3-task-label">当前问题 / Current task</div><h3>'+escText(q.challenge)+'</h3><p>'+escText(q.scene)+'</p><div class="hsk3-battle-chips">'+(q.keywords||[]).map(function(x){return'<span>'+escText(x)+'</span>'}).join('')+'</div><details><summary>教师参考答案</summary><div>'+escText(q.sample||'')+'</div></details><textarea id="battleRouletteAnswer" placeholder="记录学生的口头答案…">'+escText(this.brgAnswer||'')+'</textarea><div class="hsk3-answer-actions"><button class="hsk3-battle-primary" onclick="hsk3BattleRecord(\'roulette\',true)">完成并记录</button><button class="hsk3-battle-secondary" onclick="hsk3BattleRecord(\'roulette\',false)">需帮助并记录</button></div></div></div><div class="hsk3-history-title">本轮答题记录</div>'+recordHtml('roulette')+'</div>';return h};
  ap._hsk3BattleRelay=function(){var d=relay(),beating=!!this.bdgBeat,selected=this.bdgStudent||'敲鼓后随机点名';var h='<div class="hsk3-battle-stage drum-chain"><div class="hsk3-battle-hero"><div><div class="hsk3-battle-kicker">DRUM · WORD CHAIN</div><h2>击鼓接词</h2><p>教师给词，鼓停后学生接词；记录后自动点下一位。</p></div></div><div class="hsk3-drum-layout"><div class="hsk3-drum-zone"><button class="hsk3-drum '+(beating?'beat':'')+'" onclick="hsk3DrumPick()">击鼓<br>点名</button><div class="hsk3-picked-name">'+escText(selected)+'</div><button class="hsk3-battle-primary" onclick="hsk3DrumPick()">'+(beating?'鼓声进行中…':'开始击鼓')+'</button></div><div class="hsk3-task-card"><div class="hsk3-task-label">关键词 / Keyword</div><h3>'+escText(d.starter)+'</h3><textarea id="battleDrumAnswer" placeholder="教师填写学生接续的短语或短句…">'+escText(this.bdgAnswer||'')+'</textarea><div class="hsk3-answer-actions"><button class="hsk3-battle-primary" onclick="hsk3BattleRecord(\'drum\',true)">记录并继续</button><button class="hsk3-battle-secondary" onclick="hsk3BattleRecord(\'drum\',false)">记录需调整并继续</button></div></div></div><div class="hsk3-battle-actions"><button onclick="ap.bdgi=Math.max(0,(ap.bdgi||0)-1);ap._r()">上一个词</button><button onclick="ap.bdgi=Math.min('+(Math.max(0,items('relay').length-1))+',(ap.bdgi||0)+1);ap._r()">下一个词</button></div><div class="hsk3-history-title">接词记录</div>'+recordHtml('drum')+'</div>';return h};
  ap._hsk3BattleMonopoly=function(){var s=monopolyState(),tiles=monopolyTiles(),task=s.pending&&s.pending.task,turn=s.players[s.turn];if(!s.started)return'<div class="hsk3-battle-stage monopoly-game"><div class="hsk3-battle-hero"><div><div class="hsk3-battle-kicker">CHINESE MONOPOLY · CLASS CHALLENGE</div><h2>中文大富翁</h2><p>两名学生或两队沿棋盘完成词汇与句子挑战。</p></div></div><div class="hsk3-monopoly-setup"><label>玩家一 / Player 1<select id="monopolyPlayerA">'+monopolyPlayerOptions(roster()[0]||'第一队')+'</select></label><b>VS</b><label>玩家二 / Player 2<select id="monopolyPlayerB">'+monopolyPlayerOptions(roster()[1]||roster()[0]||'第二队')+'</select></label><button class="hsk3-battle-primary" onclick="hsk3MonopolyStart()">开始游戏</button></div><div class="hsk3-monopoly-rules"><span>初始 100 金币</span><span>答对 +10</span><span>答错停一轮</span><span>先到终点获胜</span></div></div>';var board='<div class="hsk3-monopoly-board">'+tiles.map(function(type,i){var tokens=s.players.filter(function(p){return p.pos===i}).map(function(p){return'<i class="'+p.color+'" title="'+escText(p.name)+'"></i>'}).join('');return'<div class="hsk3-monopoly-tile '+type+'" style="'+monopolyPos(i)+'"><small>'+(i+1)+'</small><b>'+monopolyTileLabel(type)+'</b><span>'+tokens+'</span></div>'}).join('')+'<div class="hsk3-monopoly-center"><div class="hsk3-monopoly-score">'+s.players.map(function(p,i){return'<div class="'+(i===s.turn&&!s.winner?'active':'')+'"><i class="'+p.color+'"></i><b>'+escText(p.name)+'</b><span>'+p.coins+' 金币 · 第 '+(p.pos+1)+' 格'+(p.skip?' · 停 '+p.skip+' 轮':'')+'</span></div>'}).join('')+'</div><div class="hsk3-monopoly-dice">'+(s.dice||'?')+'</div><p>'+escText(s.message)+'</p>'+(s.winner?'<div class="hsk3-monopoly-winner">🏆 '+escText(s.winner)+' 获胜！</div><button class="hsk3-battle-primary" onclick="hsk3MonopolyReset()">再玩一局</button>':'<button class="hsk3-battle-primary" onclick="hsk3MonopolyRoll()" '+(task?'disabled':'')+'>'+(turn?escText(turn.name)+' 掷骰子':'掷骰子')+'</button>')+'</div></div>';var card=task?'<div class="hs   ap._tt=function(){

<script>
/* Normalize HSK3 practice payloads and guarantee delivery for interactive modes. */
(function(){
  if(typeof ap==='undefined')return;
  var cloudModes=['v2g','v3b','g2p','t3c','t2k'],interactiveModes=cloudModes.concat(['r4p']);
  var previousQuestion=ap._cq2,previousStart=ap.qws,previousEnd=ap.qwe;
  ap._cq2=function(){
    var source=previousQuestion.call(this);if(!source)return source;
    var out=JSON.parse(JSON.stringify(source));
    if(cloudModes.indexOf(this.st)>=0){out.type='open_response';out.openEnded=true;out.needsTeacherReview=true;out.cloudWall=true;out.data=out.data||{}}
    if(this.st==='v2g'){
      out.prompt_cn='你说我猜。';out.prompt_en='Listen to the teacher. Describe without saying the target word.';
      delete out.data.target;delete out.data.target_pinyin;delete out.data.clues;delete out.data.scaffold;
      out.data.instructions='听老师说明目标词后，用中文描述，不要直接说出目标词。';
    }
    if(this.st==='r4p'){out.type='paragraph_choice';out.openEnded=false;out.needsTeacherReview=false;out.cloudWall=false}
    return out;
  };
  ap.qws=function(){
    if(this.mt==='practice'&&interactiveModes.indexOf(this.st)>=0){clearInterval(this.qtint);this.qp='answering';this.qt=0;this.qsub={};this._pubq();this._r();return}
    previousStart.call(this);
  };
  ap.qwe=function(){
    if(this.mt==='practice'&&interactiveModes.indexOf(this.st)>=0){
      clearInterval(this.qtint);this.qp='published';
      if(this.lastQuestionPayload){
        var payload=this.lastQuestionPayload,d=payload.question&&payload.question.data||{};payload.phase='published';payload.publishedAt=new Date().toISOString();
        payload.answerKey=this.st==='r4p'?(d.answers||[]).map(function(index,i){return(i+1)+'-'+((d.options||[])[index]||'')}):'';
        if(this.mq&&this.cs==='connected')this.mq.publish('classpro/room/'+RM+'/question',JSON.stringify(payload));
      }
      this._r();return;
    }
    previousEnd.call(this);
  };
})();
</script>

.hsk3-team-preview{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;margin:22px 0}.hsk3-team-preview>b{color:#7b68a7;font-size:24px}.hsk3-team-card{min-height:150px;padding:18px;border:2px solid transparent;border-radius:18px;background:#fff;box-shadow:0 12px 26px rgba(80,74,112,.08)}.hsk3-team-card.green{border-color:#8bc8a0}.hsk3-team-card.orange{border-color:#efb17f}.hsk3-team-card b{display:block;margin-bottom:12px;color:#24372f;font-size:24px}.hsk3-team-card span{display:block;color:#5d6f66;font-size:14px;font-weight:800;line-height:1.75}.hsk3-monopoly-team-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.hsk3-team-task-note{margin:12px 0;padding:10px 12px;border-radius:10px;background:#edf6ef;color:#176b50;font-weight:900}.hsk3-team-dice-row{display:flex;gap:10px;align-items:center}.hsk3-team-die{display:grid;place-items:center;gap:1px;width:96px;min-height:106px;padding:8px;border:0;border-radius:18px;color:#fff;box-shadow:0 9px 18px rgba(42,63,53,.18);cursor:pointer;transition:opacity .2s,filter .2s,transform .2s}.hsk3-team-die.green{background:linear-gradient(145deg,#55b77b,#16704f)}.hsk3-team-die.orange{background:linear-gradient(145deg,#f4ad69,#c96639)}.hsk3-team-die small,.hsk3-team-die em{font-size:11px;font-style:normal;font-weight:900}.hsk3-team-die b{font-family:"Segoe UI Symbol",sans-serif;font-size:44px;line-height:1}.hsk3-team-die:not(.active){filter:saturate(.4);opacity:.52;cursor:default}.hsk3-team-die.active{outline:4px solid rgba(255,255,255,.92);box-shadow:0 0 0 7px rgba(92,173,122,.22),0 12px 24px rgba(42,63,53,.22)}.hsk3-team-die.orange.active{box-shadow:0 0 0 7px rgba(228,132,73,.22),0 12px 24px rgba(42,63,53,.22)}.hsk3-team-die.rolling{animation:hsk3TeamDiceThrow .45s cubic-bezier(.35,.02,.58,1) infinite}.hsk3-monopoly-tile i.landed{animation:hsk3TokenLand .65s ease-out both}@keyframes hsk3TeamDiceThrow{0%{transform:translateY(0) rotate(0deg) scale(1)}45%{transform:translateY(-24px) rotate(155deg) scale(1.12)}100%{transform:translateY(0) rotate(360deg) scale(1)}}@keyframes hsk3TokenLand{0%{transform:translateY(-30px) scale(.65)}55%{transform:translateY(4px) scale(1.28)}75%{transform:translateY(-5px) scale(.92)}100%{transform:translateY(0) scale(1)}}.old-picture-task .old-sentence-frame{display:flex;align-items:center;justify-content:center;min-height:122px;margin-top:18px}.old-picture-task .old-sentence-frame b{font-size:36px}.old-picture-task>p{display:none}@media(max-width:700px){.hsk3-team-preview{grid-template-columns:1fr}.hsk3-team-preview>b{text-align:center}.hsk3-team-card{min-height:0}.hsk3-team-dice-row{width:100%;justify-content:center}.hsk3-team-die{width:84px;min-height:94px}.hsk3-team-die b{font-size:38px}}
</style>
<style>
/* High-visibility team tokens and animated score feedback. */
.hsk3-monopoly-tile span{align-items:center;justify-content:center;min-height:36px!important;gap:5px!important}.hsk3-monopoly-tile i.hsk3-monopoly-token{position:relative;display:grid!important;place-items:center;width:34px!important;height:34px!important;border:4px solid #fff!important;border-radius:50%!important;box-shadow:0 3px 0 rgba(24,42,34,.24),0 5px 14px rgba(24,42,34,.35)!important;color:#fff;z-index:2}.hsk3-monopoly-tile i.hsk3-monopoly-token.green{background:linear-gradient(145deg,#42d181,#08734a)!important}.hsk3-monopoly-tile i.hsk3-monopoly-token.orange{background:linear-gradient(145deg,#ffb361,#d65524)!important}.hsk3-monopoly-token b{font:1000 14px/1 system-ui,sans-serif!important;color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.28)}.hsk3-monopoly-tile i.hsk3-monopoly-token.landed{animation:hsk3TokenLandStrong .7s ease-out both}.hsk3-monopoly-token.landed:after{content:"";position:absolute;inset:-9px;border:4px solid currentColor;border-radius:50%;animation:hsk3TokenRing .7s ease-out both}.hsk3-monopoly-token.green{color:#08734a!important}.hsk3-monopoly-token.orange{color:#d65524!important}@keyframes hsk3TokenLandStrong{0%{transform:translateY(-38px) scale(.55)}52%{transform:translateY(4px) scale(1.4)}74%{transform:translateY(-7px) scale(.94)}100%{transform:translateY(0) scale(1)}}@keyframes hsk3TokenRing{0%{opacity:0;transform:scale(.55)}35%{opacity:.85}100%{opacity:0;transform:scale(1.55)}}
.hsk3-monopoly-score>div.hsk3-score-card{position:relative;align-items:center;min-height:76px;padding:12px 14px;overflow:visible;background:linear-gradient(145deg,#fff,#f7fbf8)}.hsk3-score-card>i{width:25px!important;height:25px!important;border-width:4px!important}.hsk3-score-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;min-width:0}.hsk3-score-main>b{font-size:17px}.hsk3-score-main>span{grid-column:1!important;display:block;color:#66756d!important;font-size:12px!important}.hsk3-score-number{grid-column:2;grid-row:1/3;display:flex;align-items:baseline;gap:4px;padding:3px 10px;border-radius:12px;background:#edf7ef;color:#176b50}.hsk3-score-card:nth-child(2) .hsk3-score-number{background:#fff1e5;color:#b85328}.hsk3-score-number strong{min-width:54px;font:1000 34px/1 system-ui,sans-serif;text-align:right;font-variant-numeric:tabular-nums}.hsk3-score-number em{font-size:11px;font-style:normal;font-weight:900}.hsk3-score-card.score-changing{animation:hsk3ScoreCardPulse 1.25s ease}.hsk3-score-card.score-changing .hsk3-score-number{animation:hsk3ScoreNumberRoll .22s ease-in-out infinite alternate}.hsk3-score-float{position:absolute;right:12px;top:-12px;padding:5px 10px;border-radius:999px;background:#f2bd3e;color:#5e3b00;font:1000 20px/1 system-ui,sans-serif;box-shadow:0 6px 14px rgba(157,100,0,.24);animation:hsk3ScoreFloat 1.2s ease-out both;z-index:4}@keyframes hsk3ScoreCardPulse{0%,100%{transform:scale(1)}35%{transform:scale(1.035);box-shadow:0 0 0 7px rgba(242,189,62,.25)}}@keyframes hsk3ScoreNumberRoll{from{transform:translateY(-2px)}to{transform:translateY(2px)}}@keyframes hsk3ScoreFloat{0%{opacity:0;transform:translateY(15px) scale(.7)}25%{opacity:1;transform:translateY(0) scale(1.12)}75%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1)}}@media(max-width:700px){.hsk3-monopoly-tile i.hsk3-monopoly-token{width:27px!important;height:27px!important;border-width:3px!important}.hsk3-monopoly-token b{font-size:11px!important}.hsk3-score-number strong{min-width:44px;font-size:28px}}
</style>
<script>
/* Compact, light Monopoly board with random cooperative teams. */
(function(){
  if(typeof ap==='undefined')return;
  function e(s){return String(s||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
  function names(){return window.ClassProStudentsForLesson?ClassProStudentsForLesson((window.LESSON_DATA.meta||{}).lessonKey):((window.CLASS_STUDENTS||[]).slice())}
  function teamGroups(force){
    if(!force&&ap.monopolyTeams&&ap.monopolyTeams.length===2)return ap.monopolyTeams;
    var roster=names().slice();for(var i=roster.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=roster[i];roster[i]=roster[j];roster[j]=t}
    ap.monopolyTeams=[[],[]];roster.forEach(function(n,i){ap.monopolyTeams[i%2].push(n)});return ap.monopolyTeams;
  }
  function teamCard(name,members,color){return'<div class="hsk3-team-card '+color+'"><b>'+e(name)+'</b><span>'+members.map(e).join(' · ')+'</span></div>'}
  function dieFace(n){return(['?','⚀','⚁','⚂','⚃','⚄','⚅'])[Number(n)||0]||'?'}
  function scoreCard(p,i,s){var changing=s.scoreTeam===i&&s.scoreDelta,delta=changing?(s.scoreDelta>0?'+':'')+s.scoreDelta:'';return'<div class="hsk3-score-card '+(i===s.turn&&!s.winner?'active ':'')+(changing?'score-changing':'')+'"><i class="'+p.color+'"></i><div class="hsk3-score-main"><b>'+e(p.name)+'</b><span>第 '+(p.pos+1)+' 格'+(p.skip?' · 停 '+p.skip+' 轮':'')+'</span><div class="hsk3-score-number"><strong id="hsk3-monopoly-score-'+i+'">'+p.coins+'</strong><em>金币</em></div></div>'+(changing?'<mark class="hsk3-score-float">'+delta+'</mark>':'')+'</div>'}
  window.hsk3MonopolyShuffleTeams=function(){teamGroups(true);ap._r()};
  window.hsk3MonopolyStart=function(){var groups=teamGroups(false);ap.monopoly={started:true,players:[{name:'蒲公英队',members:groups[0].slice(),pos:0,coins:100,skip:0,color:'green',lastDice:0},{name:'新芽队',members:groups[1].slice(),pos:0,coins:100,skip:0,color:'orange',lastDice:0}],turn:0,dice:0,pending:null,message:'蒲公英队先掷骰子，全组讨论后由一名代表作答。',winner:'',rolling:false,rollingTeam:-1,lastMoved:-1,scoring:false,scoreTeam:-1,scoreDelta:0};ap._r()};
  window.hsk3MonopolyReset=function(){ap.monopoly=null;ap.monopolyTeams=null;ap._r()};
  function types(){return['start','yellow','green','plus','blue','red','green','minus','yellow','star','blue','red','plus','green','yellow','skull','minus','blue','red','finish']}
  function pos(i){var x,y;if(i<7){x=90-i*13;y=80}else if(i<14){x=12+(i-7)*13;y=50}else{x=90-(i-14)*13;y=20}var tilt=[-3,2,-1,3,-2,1,0][i%7];return'left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%) rotate('+tilt+'deg)'}
  function label(t){return({start:'开始',finish:'终点',yellow:'写字',green:'组词',blue:'选择',red:'造句',plus:'+2',minus:'−2',star:'+20',skull:'−3'})[t]||t}
  ap._hsk3BattleMonopoly=function(){
    var s=this.monopoly||{started:false,players:[],turn:0,dice:0,pending:null,message:'请随机分成两组开始游戏。',winner:'',rolling:false,rollingTeam:-1,lastMoved:-1,scoring:false,scoreTeam:-1,scoreDelta:0},tiles=types(),task=s.pending&&s.pending.task,turn=s.players[s.turn],groups=teamGroups(false);
    if(!s.started)return'<div class="hsk3-battle-stage monopoly-game"><div class="hsk3-battle-hero"><div><div class="hsk3-battle-kicker">CHINESE MONOPOLY · TEAM CHALLENGE</div><h2>中文大富翁 · 小组PK</h2><p>系统把全班随机分成两队。每道题由全组讨论，再请一名代表作答。</p></div></div><div class="hsk3-team-preview">'+teamCard('蒲公英队',groups[0],'green')+'<b>VS</b>'+teamCard('新芽队',groups[1],'orange')+'</div><div class="hsk3-monopoly-team-actions"><button class="hsk3-battle-secondary" onclick="hsk3MonopolyShuffleTeams()">重新随机分组</button><button class="hsk3-battle-primary" onclick="hsk3MonopolyStart()">开始小组PK</button></div><div class="hsk3-monopoly-rules"><span>全组合作作答</span><span>答对 +10</span><span>答错停一轮</span><span>先到终点获胜</span></div></div>';
    var road='<svg class="hsk3-monopoly-road" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="road-edge" d="M92 80 H12 C3 80 3 50 12 50 H89 C98 50 98 20 89 20 H24"/><path class="road-line" d="M92 80 H12 C3 80 3 50 12 50 H89 C98 50 98 20 89 20 H24"/></svg><div class="hsk3-monopoly-scenery"><span class="cloud">☁</span><span class="seed">❋</span><span class="hill">♒</span><span class="trophy">🏆</span></div>';
    var tokensFor=function(i){return s.players.map(function(p,pi){return p.pos===i?'<i class="hsk3-monopoly-token '+p.color+(s.lastMoved===pi?' landed':'')+'" title="'+e(p.name)+'"><b>'+(pi===0?'蒲':'芽')+'</b></i>':''}).join('')};
    var diceButtons='<div class="hsk3-team-dice-row">'+s.players.map(function(p,i){var active=i===s.turn&&!s.winner,rolling=s.rolling&&s.rollingTeam===i,disabled=!active||!!task||!!s.winner||!!s.rolling||!!s.scoring,label=s.scoring&&active?'奖励结算中…':rolling?'掷骰中…':active?'点击掷骰':'等待回合';return'<button type="button" class="hsk3-team-die '+p.color+(active?' active':'')+(rolling?' rolling':'')+'" onclick="hsk3MonopolyRoll()" '+(disabled?'disabled':'')+'><small>'+e(p.name)+'</small><b>'+dieFace(rolling?s.dice:p.lastDice)+'</b><em>'+label+'</em></button>'}).join('')+'</div>';
    var board='<div class="hsk3-monopoly-shell"><div class="hsk3-monopoly-board">'+road+tiles.map(function(type,i){return'<div class="hsk3-monopoly-tile '+type+'" style="'+pos(i)+'"><small>'+(i+1)+'</small><b>'+label(type)+'</b><span>'+tokensFor(i)+'</span></div>'}).join('')+'</div><div class="hsk3-monopoly-control"><div class="hsk3-monopoly-score">'+s.players.map(function(p,i){return scoreCard(p,i,s)}).join('')+'</div><div class="hsk3-monopoly-action">'+diceButtons+'<p>'+e(s.message)+'</p>'+(s.winner?'<div><div class="hsk3-monopoly-winner">🏆 '+e(s.winner)+' 获胜！</div><button class="hsk3-battle-primary" onclick="hsk3MonopolyReset()">重新随机分组</button></div>':'')+'</div></div></div>';
    var card=task?'<div class="hsk3-task-card hsk3-monopoly-task"><div class="hsk3-task-label">'+e(task.title||'课堂任务')+'</div><h3>'+e(task.prompt||'')+'</h3><div class="hsk3-team-task-note">'+e(turn&&turn.name||'当前队伍')+'：全组合作讨论，由一名代表回答。</div>'+((task.options||[]).length?'<div class="hsk3-monopoly-options">'+task.options.map(function(x){return'<span>'+e(x)+'</span>'}).join('')+'</div>':'')+'<details><summary>教师查看参考答案</summary><div>'+e(task.answer||'答案合理即可')+'</div></details><div class="hsk3-answer-actions"><button class="hsk3-battle-primary" onclick="hsk3MonopolyJudge(true)">回答正确 +10</button><button class="hsk3-battle-secondary" onclick="hsk3MonopolyJudge(false)">回答错误 · 停一轮</button></div></div>':'<div class="hsk3-task-card hsk3-monopoly-task idle"><div class="hsk3-task-label">CURRENT TEAM TASK</div><h3>等待掷骰</h3><p>落在彩色任务格后，全组合作完成当前挑战。</p><div class="hsk3-monopoly-legend"><span>黄色 · 写汉字</span><span>绿色 · 组词语</span><span>蓝色 · 选择题</span><span>红色 · 造句</span></div></div>';
    return'<div class="hsk3-battle-stage monopoly-game"><div class="hsk3-battle-hero compact"><div><div class="hsk3-battle-kicker">CHINESE MONOPOLY · CLASS CHALLENGE</div><h2>中文大富翁</h2></div><button class="hsk3-battle-secondary" onclick="hsk3MonopolyReset()">重新开始</button></div><div class="hsk3-monopoly-layout">'+board+card+'</div></div>';
  };
})();
</script>
