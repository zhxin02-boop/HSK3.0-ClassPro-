<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClassPro+ 教师课程控制台</title>
  <link rel="stylesheet" href="../shared/classpro-theme.css">
  <link rel="stylesheet" href="./home.css">
  <script src="../data-model/hsk1-curriculum.js"></script>
  <script src="../data-model/hsk3-curriculum.js"></script>
  <script src="../shared/course-catalog.js"></script>
  <script src="../shared/context.js"></script>
</head>
<body>
  <main class="teacher-page">
    <header class="teacher-topbar cp-panel">
      <div class="cp-brand">
        <svg class="cp-brand-mark" viewBox="0 0 96 96" role="img" aria-label="ClassPro 蒲公英"><g fill="none" stroke="#0d5b43" stroke-linecap="round"><path d="M47 45c-2 18-4 31-13 43" stroke-width="3"/><path d="M45 69c10-3 16-8 20-15" stroke-width="2"/><path d="M45 48 24 29M47 46 47 18M50 47 71 27M43 46 18 48M51 50 77 49M45 43 34 21M50 44 62 18" stroke-width="2"/></g><g fill="#0d5b43"><circle cx="47" cy="46" r="5"/><circle cx="19" cy="48" r="3"/><circle cx="24" cy="29" r="3"/><circle cx="34" cy="20" r="3"/><circle cx="47" cy="17" r="3"/><circle cx="62" cy="17" r="3"/><circle cx="72" cy="26" r="3"/><circle cx="78" cy="49" r="3"/></g><g fill="#ef8d45"><circle cx="81" cy="19" r="2.5"/><circle cx="88" cy="27" r="2"/><circle cx="84" cy="38" r="1.8"/></g></svg>
        <div><div class="cp-brand-name">CHINESE CLASSPRO+</div><div class="cp-brand-note">教师课程控制台 / Teacher Workspace</div></div>
      </div>
      <div class="topbar-status"><span class="cp-pill"><span class="room-dot"></span><span id="roomBadge">房间 8888</span></span></div>
    </header>

    <div class="teacher-layout">
      <aside class="level-rail cp-panel" aria-label="课程级别">
        <div class="cp-eyebrow">First choose</div>
        <h1>课程级别</h1>
        <div class="level-list" id="levelList"></div>
      </aside>

      <section class="course-panel cp-panel" aria-labelledby="courseHeading">
        <header class="course-head">
          <div><div class="cp-eyebrow">Course library</div><h2 id="courseHeading">选择课程</h2><p id="courseCaption">点击课程后，在右侧进入教学工作区。</p></div>
          <span class="cp-pill" id="courseCount"></span>
        </header>
        <div class="course-grid" id="courseGrid"></div>
      </section>

      <aside class="lesson-inspector cp-panel" aria-label="当前课程与工作区">
        <div><div class="cp-eyebrow" id="selectedId">请选择课程</div><h2 id="selectedTitle">尚未选择</h2><div class="lesson-english" id="selectedEnglish"></div></div>
        <div>
          <div class="lesson-status preparing" id="selectedStatus">○ 等待选择</div>
          <label class="room-field"><span>课堂房间 / Room</span><input class="room-input" id="roomInput" value="8888" inputmode="numeric" autocomplete="off"></label>
        </div>
        <nav class="workspace-actions" aria-label="教师工作区">
          <a class="cp-action primary" id="classroomLink" data-workspace href="#">🎯 进入课堂</a>
          <a class="cp-action" id="studentLink" data-workspace href="#">◉ 打开学生入口</a>
          <a class="cp-action" id="dashboardLink" data-workspace href="#">▦ 查看数据</a>
          <a class="cp-action" id="reviewLink" data-workspace href="#">✎ 进入批改</a>
        </nav>
        <p class="inspector-note">课程、房间及课次参数会统一传递到各工作区。内容准备中的课程暂不能进入。</p>
      </aside>
    </div>
  </main>

  <script>
    var selectedLevel = '';
    var selectedLesson = null;
    var legacyLevelKey = 'ClassProTeacherLevel';

    function byId(id) { return document.getElementById(id); }
    function visibleLessons(levelId) { return window.ClassProCourseCatalog.lessons(levelId).filter(function (lesson) { return lesson.teacherVisible !== false; }); }
    function allLevels() { return window.ClassProCourseCatalog.levels(); }
    function rememberLevel(levelId) { try { localStorage.setItem(legacyLevelKey, levelId); } catch (error) {} }
    function readLegacy(key) { try { return localStorage.getItem(key) || ''; } catch (error) { return ''; } }

    function renderLevels() {
      var host = byId('levelList');
      host.innerHTML = '';
      allLevels().forEach(function (level) {
        var lessons = visibleLessons(level.id);
        var available = lessons.filter(function (lesson) { return lesson.openForUse; }).length;
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'level-button' + (level.id === selectedLevel ? ' active' : '');
        button.setAttribute('aria-pressed', level.id === selectedLevel ? 'true' : 'false');
        button.innerHTML = '<strong>' + level.name + '</strong><small>' + lessons.length + ' 课 · ' + available + ' 课可用</small>';
        button.onclick = function () { chooseLevel(level.id); };
        host.appendChild(button);
      });
    }

    function chooseLevel(levelId) {
      selectedLevel = levelId;
      rememberLevel(levelId);
      var lessons = visibleLessons(levelId);
      selectedLesson = lessons.filter(function (lesson) { return lesson.openForUse; })[0] || lessons[0] || null;
      renderLevels();
      renderCourses();
      renderInspector();
      commitContext();
    }

    function renderCourses() {
      var lessons = visibleLessons(selectedLevel);
      var available = lessons.filter(function (lesson) { return lesson.openForUse; }).length;
      var host = byId('courseGrid');
      byId('courseCount').textContent = lessons.length + ' 课 · ' + available + ' 课可用';
      byId('courseCaption').textContent = lessons.length ? '单级别课程总览，点击课程查看教学入口。' : '该级别的课程正在准备中。';
      host.innerHTML = '';
      if (!lessons.length) {
        host.innerHTML = '<div class="course-empty">课程内容准备中<br><small>Preparing lessons</small></div>';
        return;
      }
      lessons.forEach(function (lesson) {
        var button = document.createElement('button');
        var selected = selectedLesson && selectedLesson.id === lesson.id;
        button.type = 'button';
        button.className = 'course-card' + (lesson.openForUse ? '' : ' preparing') + (selected ? ' selected' : '');
        button.setAttribute('aria-label', lesson.id + ' ' + lesson.title + (lesson.openForUse ? ' 可用' : ' 准备中'));
        if (selected) button.setAttribute('aria-current', 'true');
        button.innerHTML = '<span class="course-number">' + String(lesson.no).padStart(2, '0') + '</span><span class="course-title">' + lesson.title + '</span><span class="course-state">' + (lesson.openForUse ? '可用' : '准备中') + '</span>';
        button.onclick = function () { selectedLesson = lesson; renderCourses(); renderInspector(); commitContext(); };
        host.appendChild(button);
      });
    }

    function renderInspector() {
      var lesson = selectedLesson;
      var status = byId('selectedStatus');
      if (!lesson) {
        byId('selectedId').textContent = '请选择课程';
        byId('selectedTitle').textContent = '尚未选择';
        byId('selectedEnglish').textContent = '';
        status.textContent = '○ 等待选择';
        status.classList.add('preparing');
        updateWorkspaceLinks(null);
        return;
      }
      byId('selectedId').textContent = lesson.id;
      byId('selectedTitle').textContent = lesson.title;
      byId('selectedEnglish').textContent = lesson.en || '';
      status.textContent = lesson.openForUse ? '● 当前可用课程' : '○ 内容准备中';
      status.classList.toggle('preparing', !lesson.openForUse);
    }

    function currentRoom() { return String(byId('roomInput').value || '8888').trim() || '8888'; }

    function updateWorkspaceLinks(ctx) {
      var ready = !!(selectedLesson && selectedLesson.openForUse && ctx);
      var links = {
        classroomLink: '../in-class/teacher.html',
        studentLink: '../student/index.html',
        dashboardLink: '../teacher-dashboard/unified.html',
        reviewLink: '../teacher-dashboard/post-review.html'
      };
      Object.keys(links).forEach(function (id) {
        var anchor = byId(id);
        anchor.href = ready ? links[id] + '?' + window.ClassProContext.buildQuery(ctx) : '#';
        anchor.setAttribute('aria-disabled', ready ? 'false' : 'true');
      });
    }

    function commitContext() {
      byId('roomBadge').textContent = '房间 ' + currentRoom();
      if (!selectedLesson) { updateWorkspaceLinks(null); return; }
      var ctx = window.ClassProContext.save({ lesson: selectedLesson.id, room: currentRoom(), session: '', student: '' });
      updateWorkspaceLinks(ctx);
      window.history.replaceState({}, '', '?' + window.ClassProContext.buildQuery(ctx));
    }

    function init() {
      var ctx = window.ClassProContext.read();
      var url = new URLSearchParams(window.location.search || '');
      var hasSharedContext = !!readLegacy('ClassProContext');
      var lessonId = url.get('lesson') || (hasSharedContext ? ctx.lesson : readLegacy('ClassProTeacherLesson')) || ctx.lesson;
      var lesson = window.ClassProCourseCatalog.get(lessonId);
      selectedLevel = lesson ? window.ClassProCourseCatalog.levelOf(lesson.id) : readLegacy(legacyLevelKey) || 'HSK1';
      if (!allLevels().some(function (level) { return level.id === selectedLevel; })) selectedLevel = 'HSK1';
      var lessons = visibleLessons(selectedLevel);
      selectedLesson = lesson && lesson.teacherVisible !== false ? lesson : lessons.filter(function (item) { return item.openForUse; })[0] || lessons[0] || null;
      byId('roomInput').value = url.get('room') || (hasSharedContext ? ctx.room : readLegacy('ClassProTeacherRoom')) || ctx.room || '8888';
      byId('roomInput').addEventListener('change', commitContext);
      byId('roomInput').addEventListener('keydown', function (event) { if (event.key === 'Enter') { event.preventDefault(); commitContext(); } });
      renderLevels();
      renderCourses();
      renderInspector();
      commitContext();
    }

    init();
  </script>
</body>
</html>
