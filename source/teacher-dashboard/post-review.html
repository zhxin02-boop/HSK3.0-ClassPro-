<style>
*{box-sizing:border-box}
:root{--green:#4f8f2f;--line:#dfe9c8;--dark:#24351f;--red:#c0392b}
body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f7f9ef,#fffaf3);color:var(--dark);padding:20px}
.wrap{max-width:1200px;margin:0 auto}.hero,.student{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 28px rgba(86,115,55,.1);margin-bottom:14px}
h1{margin:0 0 8px;color:#3f7f32;font-size:26px}.muted,.small{color:#74806d;font-size:13px;line-height:1.5}.small{font-size:12px}
button{border:0;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:900;background:var(--green);color:#fff;cursor:pointer}.secondary{background:#edf6d9;color:#3f7f32}
.tools,.tags{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.tag{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900;background:#edf6d9;color:#3f7f32}.waittag{background:#fff7ed;color:#b45309}.badtag{background:#fef2f2;color:#b42318}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#fbfdf6;border:1px solid var(--line);border-radius:16px;padding:14px}.num{font-size:28px;font-weight:900;color:#3f7f32}.label{font-size:12px;color:#74806d}

<body>
<div class="wrap">
  <div class="hero">

    <div class="muted">统一查看课前主观题、课后输出题和汉字书写。按学生分组，汉字书写直接显示在对应待批改记录中。</div>

        <option value="HSK1-L01-L03">第1-3课 / L01-L03</option>
      </select>
      <button class="secondary" onclick="location.href='../teacher/index.html'">教师主页 / Teacher Home</button>

    </div>

<script>
var GAS="https://script.google.com/macros/s/AKfycbxrCd6f6cQ3wocXYQZyLKY0JutolEmOWWzTGOABnnHHJOm697OfyBlkLw-SQ-u-9ZAO/exec";
var params=new URLSearchParams(location.search||""),ctx=window.ClassProContext.read(),LESSON=ctx.lesson,LESSON_SCOPE=(params.get("scope")||"all"),records=[],reviewQueue={},reviewRowsById={},hiddenReviewRows=0;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function val(o,keys){for(var i=0;i<keys.length;i++){if(o&&o[keys[i]]!=null&&o[keys[i]]!=="")return o[keys[i]]}return""}
function fuzzy(o,keys,contains){var v=val(o,keys);if(v!=="")return v;var ks=Object.keys(o||{});for(var i=0;i<ks.length;i++){for(var j=0;j<contains.length;j++){if(ks[i].indexOf(contains[j])>=0&&o[ks[i]]!=null&&o[ks[i]]!=="")return o[ks[i]]}}return""}
function lessonOf(x){return fuzzy(x,["课程","lesson","璇剧▼"],["课程","lesson"])}
function stageOf(x){return fuzzy(x,["环节","stage","鐜妭"],["环节","stage"])}
function stageKey(x){var s=String(stageOf(x)||"").trim().toLowerCase().replace(/[\s-]/g,"");if(s==="预习"||s==="课前"||s==="pre"||s==="preclass"||s==="pre_class")return"pre";if(s==="课后"||s==="post"||s==="postclass"||s==="post_class")return"post";return s}
function moduleRaw(x){return fuzzy(x,["模块","module","妯″潡"],["模块","module"])}
function studentOf(x){return fuzzy(x,["姓名","studentName","name","濮撳悕"],["姓名","student","name"])}
function timeOf(x){return fuzzy(x,["提交时间","timestamp","receivedAt","submittedAt","鎻愪氦鏃堕棿"],["时间","timestamp","submitted"])}
function answerOf(x){return fuzzy(x,["学生作答","answer","瀛︾敓浣滅瓟"],["作答","answer"])}
function resultOf(x){return fuzzy(x,["结果","result","autoResult","缁撴灉"],["结果","result"])}
function statusOf(x){return fuzzy(x,["批改状态","reviewStatus","status","鎵规敼鐘舵€"],["批改","status"])}
function qidOf(x){return fuzzy(x,["题号","questionId","棰樺彿"],["题号","questionId"])}
function scoreOf(x){return Number(fuzzy(x,["得分","score","寰楀垎"],["得分","score"]))||0}
function totalOf(x){return Number(fuzzy(x,["总分","total","鎬诲垎"],["总分","total"]))||0}
function normResult(r){r=String(r||"").toLowerCase();if(r==="correct"||r==="true"||r==="正确")return"correct";if(r==="wrong"||r==="false"||r==="错误")return"wrong";return r||"submitted"}
// 字段位置兜底：GAS 固定写入顺序为
// 0提交时间 1姓名 2课程 3环节 4模块 5题号 6得分 7总分 8积分 13学生作答 14结果 15教师批改 16批改状态
// 由于历史表头有中文/乱码混用，教师端优先按列位置读取，避免误把 0 当作学生作答。
function col(x,i){if(x&&Array.isArray(x.__values)&&x.__values[i]!=null)return x.__values[i];return ""}
function pick(a,b){return a!=null&&a!==""?a:b}
function lessonOf(x){return pick(col(x,2),fuzzy(x,["课程","lesson","璇剧▼"],["课程","lesson"]))}
function stageOf(x){return pick(col(x,3),fuzzy(x,["环节","stage","鐜妭"],["环节","stage"]))}
function moduleRaw(x){return pick(col(x,4),fuzzy(x,["模块","module","妯″潡"],["模块","module"]))}
function studentOf(x){return pick(col(x,1),fuzzy(x,["姓名","studentName","name","濮撳悕"],["姓名","student","name"]))}
function timeOf(x){return pick(col(x,0),fuzzy(x,["提交时间","timestamp","receivedAt","submittedAt","鎻愂氦鏃堕棿"],["时间","timestamp","submitted"]))}
function answerOf(x){return pick(col(x,13),fuzzy(x,["学生作答","answer","瀛︾敓浣滟瓟","瀛︾敓浣滲瓟"],["作答","answer"]))}
function resultOf(x){return pick(col(x,14),fuzzy(x,["结果","result","autoResult","缁撴灉"],["结果","result"]))}
function statusOf(x){return pick(col(x,16),fuzzy(x,["批改状态","reviewStatus","status","鎵规敼鐘舵€"],["批改","status"]))}
function qidOf(x){return pick(col(x,5),fuzzy(x,["题号","questionId","棰樺彿"],["题号","questionId"]))}
function scoreOf(x){return Number(pick(col(x,6),fuzzy(x,["得分","score","寰楀垎"],["得分","score"])))||0}
function totalOf(x){return Number(pick(col(x,7),fuzzy(x,["总分","total","鎬诲垎"],["总分","total"])))||0}
function lessonNo(lesson){var m=String(lesson||"").toUpperCase().match(/HSK1-L0?(\d+)/);return m?Number(m[1]):0}
function lessonInScope(lesson){
  lesson=String(lesson||"").trim();
  if(!lesson)return true;
  if(LESSON_SCOPE==="all")return true;
  if(LESSON_SCOPE==="HSK1-L01-L03"){var n=lessonNo(lesson);return n>=1&&n<=3}
  return lesson===LESSON_SCOPE;
}
function setLessonScope(scope){
  LESSON_SCOPE=scope||LESSON_SCOPE;
  if(/^HSK1-L\d{2}$/.test(LESSON_SCOPE))LESSON=LESSON_SCOPE;
  var q=new URLSearchParams(location.search||"");
  q.set("scope",LESSON_SCOPE);
  if(/^HSK1-L\d{2}$/.test(LESSON_SCOPE))q.set("lesson",LESSON_SCOPE);
  history.replaceState({},'',location.pathname+'?'+q.toString());
  loadData();
}
function populateLessonScope(){
  var el=document.getElementById("lessonScope");if(!el)return;
  var items=(window.HSK1_CURRICULUM||[]).filter(function(x){return x.teacherVisible!==false});
  el.innerHTML='<option value="HSK1-L01-L03">第1-3课 / L01-L03</option><option value="all">全部课程 / All</option>'+items.map(function(x){return'<option value="'+esc(x.id)+'">'+esc(x.id+' · '+x.title)+'</option>'}).join("");
  el.value=LESSON_SCOPE;
}
function parseMaybeJson(s){
  if(s==null)return null;
  var txt=String(s).trim();
  for(var pass=0;pass<3;pass++){
    try{
      var obj=JSON.parse(txt);
      if(typeof obj==="string"){txt=obj.trim();continue}
      return obj;
    }catch(e){}
    var a=txt.indexOf("{"),b=txt.lastIndexOf("}");
    if(a>=0&&b>a){txt=txt.slice(a,b+1);continue}
    break;
  }
  return null;
}
function valuesOf(x){return Object.keys(x||{}).map(function(k){return x[k]})}
function findHandwritingAnswer(x){
  var vals=valuesOf(x);
  for(var i=0;i<vals.length;i++){
    var s=String(vals[i]||"");
    if(s.indexOf("handwriting")>=0&&s.indexOf("cells")>=0){
      var p=parseMaybeJson(s);
      if(p&&p.cells)return s;
    }
  }
  return "";
}
function anyFieldHas(x,needle){
  return valuesOf(x).some(function(v){return String(v||"").indexOf(needle)>=0});
}
function inferredModule(x){
  var m=String(moduleRaw(x)||"").trim();
  var hw=findHandwritingAnswer(x);
  var ans=hw||answerOf(x),parsed=parseMaybeJson(ans),qid=String(qidOf(x)||"");
  if(hw||anyFieldHas(x,"handwriting"))return"handwriting";
  if(parsed&&parsed.type==="handwriting")return"handwriting";
  if(qid.indexOf("_a_011")>=0||qid.indexOf("_b_010")>=0||qid.indexOf("_c_007")>=0||qid.indexOf("_c_008")>=0)return"output";
  if(m)return m;
  if(totalOf(x)===0&&normResult(resultOf(x))==="submitted")return"output";
  return "";
}
function isReviewModule(m){m=String(m||"");return m==="output"||m==="subjective"||m==="handwriting"}
function needsReview(x){
  var m=inferredModule(x),st=String(statusOf(x)||""),nr=String(fuzzy(x,["needsReview","needs_teacher_review","needsTeacherReview","openEnded"],["needsReview","needs_teacher_review","needsTeacherReview","openEnded"])).toLowerCase();
  var feedback=String(fuzzy(x,["教师批改","teacherFeedback","correction"],["批改","feedback","correction"])||"");
  if(st.indexOf("已批改")>=0||st.indexOf("宸叉壒")>=0||st.toLowerCase()==="reviewed"||feedback.trim())return false;
  var sk=stageKey(x),ml=String(m||"");
  if(m==="homework_summary")return false;
  if(sk==="pre"&&(ml.indexOf("造句")>=0||ml.indexOf("开放")>=0||isReviewModule(ml)))return true;
  return isReviewModule(m)||nr==="true"||nr==="yes"||st.indexOf("待")>=0;
}
// 课前主观题统一按 openEnded 标记进入批改队列，避免依赖课程模块名称。
(function(){
  var originalNeedsReview=needsReview;
  needsReview=function(x){
    var stage=stageKey(x);
    var openEnded=String(val(x,["openEnded","open_ended","isOpenEnded"])||"").toLowerCase();
    if(stage==="pre"&&(openEnded==="yes"||openEnded==="true")){
      var status=String(val(x,["reviewStatus","status"])||"").toLowerCase();
      var feedback=String(val(x,["teacherFeedback","correction"])||"").trim();
      if(!feedback&&status!=="reviewed"&&status!=="已批改")return true;
    }
    return originalNeedsReview(x);
  };
})();
function loadData(){
  document.getElementById("status").textContent="正在读取...";
  var local=location.hostname==='localhost'||location.hostname==='127.0.0.1';var dataUrl=local?"/api/reviews?source=local":GAS+"?action=get_all";
  fetch(dataUrl).then(function(r){return r.json()}).then(function(d){
    var rows=[];if(d&&Array.isArray(d.data)){rows=d.data.slice()}else if(d&&d.data){for(var k in d.data){(d.data[k]||[]).forEach(function(x){rows.push(x)})}}
    records=rows.filter(function(x){var lesson=lessonOf(x),key=stageKey(x);return lessonInScope(lesson)&&(key==="pre"||key==="post"||needsReview(x))});
    var preCount=records.filter(function(x){return stageKey(x)==="pre"}).length,postCount=records.filter(function(x){return stageKey(x)==="post"}).length;
    document.getElementById("status").textContent="已读取 "+records.length+" 条记录：课前 "+preCount+"，课后 "+postCount;
    render();
  }).catch(function(err){document.getElementById("status").textContent="读取失败："+(err.message||err)});
}
function grouped(){var g={};records.filter(needsReview).forEach(function(r){var n=studentOf(r)||"未命名";(g[n]=g[n]||[]).push(r)});return g}
function stats(rows){var score=0,total=0,pending=0,hand=0;rows.forEach(function(r){var m=inferredModule(r);if(needsReview(r))pending++;if(m==="handwriting")hand++;var t=totalOf(r);if(t>0){score+=scoreOf(r);total+=t}});return{score:score,total:total,acc:total?Math.round(score/total*100):0,pending:pending,handwriting:hand}}
function render(){populateLessonScope();reviewRowsById={};var g=grouped(),names=Object.keys(g).sort(),pre=records.filter(function(x){return needsReview(x)&&stageKey(x)==="pre"}).length,post=records.filter(function(x){return needsReview(x)&&stageKey(x)==="post"}).length;var note=hiddenReviewRows?'<div class="small" style="margin:-6px 0 12px">已按“最后一次提交”显示，隐藏旧提交 '+hiddenReviewRows+' 条。</div>':'';var summary='<div class="review-summary"><div><b>'+ (pre+post) +'</b><span>待批改总数 / Total</span></div><div><b>'+pre+'</b><span>课前 / Pre-class</span></div><div><b>'+post+'</b><span>课后 / Post-class</span></div></div>'+note;if(!names.length){document.getElementById("app").innerHTML=summary+'<div class="empty">暂无待批改句子或书写题。</div>';return}document.getElementById("app").innerHTML=summary+names.map(function(n){return renderStudent(n,g[n])}).join("");setTimeout(drawAllHandwriting,0)}
function renderStudent(name,rows){
  var pre=rows.filter(function(r){return stageKey(r)==="pre"}),post=rows.filter(function(r){return stageKey(r)==="post"}),hand=rows.filter(function(r){return inferredModule(r)==="handwriting"});
  return '<div class="student"><h2 style="margin:0 0 8px;color:#315b29">'+esc(name)+'</h2>'+
    '<div class="grid"><div class="card"><div class="num">'+rows.length+'</div><div class="label">待批改总数 / Total</div></div><div class="card"><div class="num">'+pre.length+'</div><div class="label">课前 / Pre-class</div></div><div class="card"><div class="num">'+post.length+'</div><div class="label">课后 / Post-class</div></div><div class="card"><div class="num">'+hand.length+'</div><div class="label">汉字书写 / Handwriting</div></div></div>'+renderReview(name,rows)+'</div>';
}
function renderWrong(rows){if(!rows.length)return'<div class="tags"><span class="tag">暂无客观错题</span></div>';return'<div class="review-box"><b>客观错题</b><table><tr><th>题号</th><th>模块</th><th>学生答案</th></tr>'+rows.map(function(r){return'<tr><td>'+esc(qidOf(r))+'</td><td>'+esc(inferredModule(r))+'</td><td>'+esc(answerOf(r))+'</td></tr>'}).join("")+'</table></div>'}
function renderReview(name,rows){
  if(!rows.length)return'<div class="review-box"><b>待批改/查看</b><div class="small">暂无。</div></div>';
  return'<div class="review-box"><b>待批改/查看</b>'+rows.map(function(r,i){var m=inferredModule(r),qid=qidOf(r),ans=answerOf(r),id=reviewId(r,name);return'<div id="review_'+id+'" style="margin-top:12px;border-top:1px dashed #edd6aa;padding-top:10px"><div><span class="tag '+(m==="handwriting"?"waittag":"")+'">'+esc(m||"review")+'</span> <b>'+esc(qid)+'</b> <span class="small">'+esc(timeOf(r))+'</span></div>'+renderAnswerPreview(ans,m,id,r)+'<textarea id="fb_'+id+'" placeholder="写给学生的反馈">'+esc(val(r,["教师批改","teacherFeedback","correction","鏁欏笀鎵规敼"]))+'</textarea><div class="tools"><button onclick="saveReview(\''+esc(name).replace(/'/g,"\\'")+'\',\''+esc(timeOf(r)).replace(/'/g,"\\'")+'\',\''+id+'\')">保存批改</button><span class="small" id="st_'+id+'"></span></div></div>'}).join("")+'</div>';
}
 function renderReview(name,rows){
   if(!rows.length)return'<div class="review-box"><b>待批改句子 / Needs Review</b><div class="small">暂无。</div></div>';
   return'<div class="review-box"><b>待批改句子 / Needs Review</b>'+rows.map(function(r){var m=inferredModule(r),qid=qidOf(r),ans=answerOf(r),id=reviewId(r,name),stage=stageKey(r)==="pre"?'课前 / Pre-class':'课后 / Post-class';return'<div id="review_'+id+'" style="margin-top:12px;border-top:1px dashed #edd6aa;padding-top:10px"><div><span class="tag">'+stage+'</span> <span class="tag '+(m==="handwriting"?"waittag":"")+'">'+esc(m||"review")+'</span> <b>'+esc(qid)+'</b> <span class="small">'+esc(timeOf(r))+'</span></div>'+renderAnswerPreview(ans,m,id,r)+'<textarea id="fb_'+id+'" placeholder="写给学生的反馈 / Teacher feedback">'+esc(val(r,["教师批改","teacherFeedback","correction","鏁欏笀鎵规敼"]))+'</textarea><div class="tools"><button onclick="saveReview(\''+esc(name).replace(/'/g,"\\'")+'\',\''+esc(timeOf(r)).replace(/'/g,"\\'")+'\',\''+id+'\')">保存批改 / Save</button><span class="small" id="st_'+id+'"></span></div></div>'}).join("")+'</div>';
 }
 function safeId(s){return String(s).replace(/[^a-zA-Z0-9_]/g,"_")}
function reviewId(r,name){return safeId((name||studentOf(r)||"")+"_"+qidOf(r)+"_"+timeOf(r))}

  function hasEffectiveAnswer(r){
    var m=inferredModule(r),ans=String(answerOf(r)||"").trim();
    if(!ans||ans==="completed"||ans==="{}"||ans==="[]")return false;
    if(m==="handwriting"){
      var p=parseMaybeJson(findHandwritingAnswer(r)||ans);
      if(!p||!p.cells)return false;
      return (p.cells||[]).some(function(c){return (c.strokes||[]).some(function(st){return st&&st.length})});
    }
    return true;
  }
  function latestRowsByStudentAndQuestion(rows){
    var latest={};
    rows.filter(hasEffectiveAnswer).forEach(function(r){
      var key=[studentOf(r)||"",questionKey(r)].join("|"),old=latest[key];
      if(!old||new Date(qAttemptTimeOf(r)).getTime()>=new Date(qAttemptTimeOf(old)).getTime())latest[key]=r;
    });
    return Object.keys(latest).map(function(k){return latest[k]});
  }
  function groupedByQuestion(){
    var groups={};
    visibleQuestionRows().forEach(function(r){
      var key=questionKey(r),g=groups[key];
      if(!g){g=groups[key]={key:key,lesson:lessonOf(r)||LESSON,stage:stageLabel(r),module:inferredModule(r)||moduleRaw(r)||"review",qid:qidOf(r)||"",question:questionPreviewText(r),rows:[]}}
      g.rows.push(r);
    });
    return groups;
  }
  function visibleQuestionRows(){
    var f=reviewFilter();
    return latestRowsByStudentAndQuestion(records.filter(needsReview)).filter(function(r){
      var m=inferredModule(r);
      if(f==="handwriting")return m==="handwriting";
      if(f==="output")return m==="output"||m==="subjective";
      return true;
    });
  }
  function questionTools(active){
    var f=reviewFilter();
    return '<div class="tools" style="margin:0 0 14px"><button class="'+(active==="question"?"":"secondary")+'" onclick="setReviewLayoutMode(\'question\')">按题批改 / By Question</button><button class="'+(active==="student"?"":"secondary")+'" onclick="setReviewLayoutMode(\'student\')">按学生批改 / By Student</button><button class="'+(f==="all"?"":"secondary")+'" onclick="setReviewFilter(\'all\')">全部</button><button class="'+(f==="handwriting"?"":"secondary")+'" onclick="setReviewFilter(\'handwriting\')">只看汉字书写</button><button class="'+(f==="output"?"":"secondary")+'" onclick="setReviewFilter(\'output\')">只看输出题</button><span class="muted">按题批改适合课后作业：同一道题集中查看，批量保存。</span></div>';
  }
  function renderQuestionLayout(){
    populateLessonScope();reviewRowsById={};questionReviewGroups={};
    var visibleRows=visibleQuestionRows(),groups=groupedByQuestion(),keys=Object.keys(groups).sort(function(a,b){
      var ga=groups[a],gb=groups[b];
      return (ga.lesson+ga.stage+ga.qid).localeCompare(gb.lesson+gb.stage+gb.qid);
    });
    var pre=visibleRows.filter(function(x){return stageKey(x)==="pre"}).length,post=visibleRows.filter(function(x){return stageKey(x)==="post"}).length;
    var note=hiddenReviewRows?'<div class="small" style="margin:-6px 0 12px">已按“最后一次提交”显示，隐藏旧提交 '+hiddenReviewRows+' 条。</div>':'';
    var summary='<div class="review-summary"><div><b>'+ (pre+post) +'</b><span>待批改总数 / Total</span></div><div><b>'+pre+'</b><span>课前 / Pre-class</span></div><div><b>'+post+'</b><span>课后 / Post-class</span></div></div>'+note+questionTools("question");
    if(!keys.length){reviewAppNode().innerHTML=summary+'<div class="empty">暂无待批改句子或书写题。</div>';return}
    reviewAppNode().innerHTML=summary+keys.map(function(k,i){return renderQuestionGroup(groups[k],i)}).join("");
    setTimeout(drawAllHandwriting,0);
  }
  function renderQuestionGroup(g,idx){
    var gid=safeId("qgrp_"+idx+"_"+g.key);questionReviewGroups[gid]=g;
    return '<div class="student"><h2 style="margin:0 0 8px;color:#315b29">'+esc(g.lesson)+' · '+esc(g.stage)+' · '+esc(g.qid||g.module)+'</h2>'+
      '<div class="small"><span class="tag">'+esc(g.module)+'</span> 共 '+g.rows.length+' 份作答</div>'+
      '<div class="answer-box" style="background:#fffaf0"><b>题目说明 / Task</b><br>'+esc(g.question||"题目说明暂缺")+'</div>'+
      '<div class="tools"><button onclick="markQuestionGroup(\''+gid+'\',true)">本题全部正确</button><button class="secondary" onclick="markQuestionGroup(\''+gid+'\',false)">本题全部需修改</button><button onclick="saveQuestionGroup(\''+gid+'\')">保存本题全部批改 / Save Question</button><span class="small" id="qst_'+gid+'">可逐行修改反馈后保存。</span></div>'+
      '<table><tr><th style="width:120px">学生</th><th>作答</th><th style="width:110px">判断</th><th>教师反馈</th><th style="width:90px">状态</th></tr>'+
      g.rows.map(function(r,i){return renderQuestionRow(gid,r,i)}).join("")+'</table></div>';
  }
  function renderQuestionRow(gid,r,i){
    var id=safeId(gid+"_row_"+i),m=inferredModule(r),ans=answerOf(r);reviewRowsById[id]=r;
    var answer=m==="handwriting"?renderAnswerPreview(ans,m,id,r):'<div class="answer-box" style="margin:0">'+esc(ans||"未作答")+'</div>';
    return '<tr id="review_'+id+'"><td><b>'+esc(studentOf(r)||"未命名")+'</b><div class="small">'+esc(timeOf(r))+'</div></td><td>'+questionPreview(r,m)+answer+'</td><td><label class="tag" style="cursor:pointer"><input type="checkbox" id="ok_'+id+'" checked> 正确</label></td><td><textarea id="fb_'+id+'" placeholder="可留空；留空时按正确/需修改自动生成反馈。">'+esc(val(r,["教师批改","teacherFeedback","correction","鏁欏笀鎵规敼"]))+'</textarea></td><td><span class="small" id="st_'+id+'">未保存</span></td></tr>';
  }
  function correctionFor(id){
    var ok=document.getElementById("ok_"+id).checked,custom=(document.getElementById("fb_"+id).value||"").trim();
    if(custom)return (ok?"【正确】":"【需修改】")+custom;
    return ok?"【正确】很好，答案正确。":"【需修改】请再检查答案。";
  }
  window.setReviewLayoutMode=setLayout;
  window.setReviewFilter=setFilter;
  window.markQuestionGroup=function(gid,ok){
    (questionReviewGroups[gid]||{rows:[]}).rows.forEach(function(r,i){var id=safeId(gid+"_row_"+i),el=document.getElementById("ok_"+id);if(el)el.checked=ok});
  };
  window.saveQuestionGroup=function(gid){
    var g=questionReviewGroups[gid]||{rows:[]},status=document.getElementById("qst_"+gid);
    if(!g.rows.length)return;
    status.textContent="正在保存 0 / "+g.rows.length+"...";
    var local=location.hostname==='localhost'||location.hostname==='127.0.0.1',url=local?"/api/mark-reviewed":GAS;
    g.rows.reduce(function(p,r,i){return p.then(function(){
      var id=safeId(gid+"_row_"+i),payload=reviewPayload(r,studentOf(r),correctionFor(id));
      return fetch(url,{method:"POST",mode:local?"same-origin":"no-cors",headers:{"Content-Type":local?"application/json":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}).then(function(){
        var st=document.getElementById("st_"+id);if(st)st.textContent="已保存";
        status.textContent="正在保存 "+(i+1)+" / "+g.rows.length+"...";
      });
    })},Promise.resolve()).then(function(){
      status.textContent="本题全部批改已保存，已从待批改列表移除 / All saved";
      var done={};g.rows.forEach(function(r){done[reviewId(r,studentOf(r))]=1});
      records=records.filter(function(r){return !done[reviewId(r,studentOf(r))]});
      setTimeout(render,350);
      setTimeout(loadData,1800);
    }).catch(function(){status.textContent="部分保存失败，请刷新后重试 / Retry"});
  };
  render=function(){
    if(layoutMode()==="student")return studentRender();
    return renderQuestionLayout();
  };
})();
</script>
</body>
</html>
