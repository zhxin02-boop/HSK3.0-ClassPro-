<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ClassPro+ 三阶段数据面板</title>
<style>
*{box-sizing:border-box}
:root{--green:#6ea72d;--blue:#2563eb;--red:#c0392b;--dark:#203421;--line:#dfeac8}
body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#f7f9ef,#fffaf3);color:var(--dark);padding:22px}
.wrap{max-width:1180px;margin:0 auto}.hero,.panel,.card{background:#fff;border:1px solid var(--line);box-shadow:0 12px 28px rgba(86,115,55,.1)}
.hero{border-radius:22px;padding:22px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.panel{border-radius:20px;padding:18px;margin:14px 0}.card{border-radius:18px;padding:16px}
h1{margin:0 0 6px;color:#3f7f32;font-size:26px}.sub,.muted{color:#74806d;font-size:13px;line-height:1.45}
.tools,.tabs,.tags{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab{border:0;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer}.btn{background:var(--green);color:#fff}.btn.secondary{background:#edf6d9;color:#3f7f32}.btn.blue{background:var(--blue)}
.tabs{margin:18px 0}.tab{border:1px solid var(--line);background:#fff;color:#526248}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}.num{font-size:30px;font-weight:900;color:#3f7f32;line-height:1.1}.label{font-size:12px;color:#74806d;margin-top:5px}
.panel h2{margin:0 0 12px;font-size:19px;color:#315b29}table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:14px;overflow:hidden}th,td{padding:9px;border-bottom:1px solid #edf3dc;text-align:left;vertical-align:top}th{background:#edf6d9;color:#3f7f32;font-weight:900}
.pill,.tag{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}.ok{background:#e8f6ee;color:#2f7d32}.bad{background:#fef2f2;color:#b42318}.wait{background:#fff7ed;color:#b45309}.tag{background:#edf6d9;color:#3f7f32}.empty{padding:22px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:#74806d;background:#fbfdf6}
input[type=file]{max-width:230px}.toolbar-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#f8fbf0;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0}.toolbar-card label{font-size:13px;font-weight:900;color:#526248}.toolbar-card select{border:1px solid #cfe2a5;border-radius:10px;padding:8px 12px;background:#fff;color:var(--dark);min-width:180px}.quick-links{display:flex;gap:8px;flex-wrap:wrap}.quick-links a{color:#3f7f32;text-decoration:none;font-size:12px;font-weight:900;background:#edf6d9;border-radius:999px;padding:8px 11px}.student-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.student-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fbfdf6}.student-card h3{margin:0 0 10px;color:#315b29;font-size:16px}.student-card .line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e7efd8;font-size:13px}.student-card .line:last-child{border-bottom:0}.student-card a{display:inline-block;margin-top:10px;color:#2563eb;font-size:12px;font-weight:900}
.diagnostic-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.diagnostic-head h2{font-size:24px;margin-bottom:5px}.diagnostic-actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:14px;background:#fff7ed;border:1px solid #fed7aa;color:#8a4b13;line-height:1.6}.notice.good{background:#eef8ed;border-color:#c8e5c3;color:#315b29}.quality-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.quality-item{padding:10px 12px;border-radius:12px;background:#f8fbf0;font-size:13px}.issue,.suggestion{border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0;background:#fbfdf6}.issue h3{margin:0 0 7px;font-size:16px}.issue summary{cursor:pointer;color:#2563eb;font-weight:900;margin-top:9px}.evidence-list{margin:9px 0 0;padding-left:20px;font-size:12px;line-height:1.6}.flow{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;line-height:1.55;font-size:13px}.flow b{color:#3f7f32}.decision-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.decision-grid label{font-size:13px;font-weight:900;color:#526248}.decision-grid textarea{display:block;width:100%;min-height:82px;margin-top:6px;border:1px solid #cfe2a5;border-radius:12px;padding:10px;font:inherit;resize:vertical}.decision-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.status-table td:first-child{font-weight:900}.diagnostic-empty{padding:16px;border-radius:12px;background:#f8fbf0;color:#74806d}.diagnostic-source{max-width:720px}.completion-stack{height:26px;display:flex;overflow:hidden;border-radius:999px;background:#edf1e7;margin:10px 0}.completion-stack span{min-width:0;display:block}.completion-stack .complete{background:#3f9a4b}.completion-stack .partial{background:#e59b35}.completion-stack .not-started{background:#b9c2b2}.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.viz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.viz-box{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fbfdf6}.viz-box h3{margin:0 0 10px;font-size:16px;color:#315b29}.metric-large{font-size:34px;font-weight:900;color:#315b29}.word-row{display:grid;grid-template-columns:minmax(82px,130px) 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:13px}.word-label b{display:block;font-size:15px}.bar-track{height:11px;border-radius:999px;background:#e7eadf;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:#4d9f50}.bar-fill.weak{background:#df7b3f}.question-card{border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0;background:#fff}.question-card h3{margin:0 0 7px;font-size:15px}.question-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#687561}.cause{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff7ed;color:#8a4b13;font-size:13px;line-height:1.5}
@media(max-width:700px){.decision-grid,.viz-grid{grid-template-columns:1fr}.diagnostic-head h2{font-size:21px}.word-row{grid-template-columns:90px 1fr auto}}
@media print{@page{size:A4;margin:11mm}body{background:#fff;padding:0;font-size:10pt}.hero,.tabs,.toolbar-card,.no-print{display:none!important}.wrap{max-width:none}.panel,.card{box-shadow:none;break-inside:avoid}.panel{padding:10px;margin:7px 0}.grid{gap:6px;margin:7px 0}.num{font-size:20px}.decision-grid textarea{border:0;min-height:50px;padding:4px}.evidence-list{font-size:9pt}}
</style>
<link rel="stylesheet" href="../shared/classpro-theme.css">
<link rel="stylesheet" href="dashboard.css">
<script src="../data-model/hsk1-curriculum.js"></script>
<script src="../data-model/hsk3-curriculum.js"></script>
<script src="../shared/context.js"></script>
<script src="../shared/records-api.js"></script>
<script src="../shared/students.js"></script>
<script src="../shared/progress-data.js"></script>
<script src="../shared/diagnostic-report.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="dashboard-brand">
      <svg class="cp-brand-mark" viewBox="0 0 96 96" role="img" aria-label="ClassPro 蒲公英"><g fill="none" stroke="#0d5b43" stroke-linecap="round"><path d="M47 45c-2 18-4 31-13 43" stroke-width="3"/><path d="M45 69c10-3 16-8 20-15" stroke-width="2"/><path d="M45 48 24 29M47 46 47 18M50 47 71 27M43 46 18 48M51 50 77 49M45 43 34 21M50 44 62 18" stroke-width="2"/></g><g fill="#0d5b43"><circle cx="47" cy="46" r="5"/><circle cx="19" cy="48" r="3"/><circle cx="24" cy="29" r="3"/><circle cx="34" cy="20" r="3"/><circle cx="47" cy="17" r="3"/><circle cx="62" cy="17" r="3"/><circle cx="72" cy="26" r="3"/><circle cx="78" cy="49" r="3"/></g><g fill="#ef8d45"><circle cx="81" cy="19" r="2.5"/><circle cx="88" cy="27" r="2"/><circle cx="84" cy="38" r="1.8"/></g></svg>
      <div class="dashboard-brand-copy">
        <div class="cp-eyebrow">Teacher analytics</div>
        <h1>ClassPro+ 三阶段数据面板</h1>
        <div class="sub">课前预习 / 课中互动 / 课后巩固统一查看</div>
        <div class="muted" id="status">数据源：本地缓存 + Google Sheets</div>
      </div>
    </div>
    <div class="tools">
      <button class="btn secondary" onclick="location.href='../teacher/index.html'">教师主页 / Teacher Home</button>
      <button class="btn secondary" onclick="loadCloud()">刷新云端数据</button>
      <button class="btn secondary" onclick="loadLocal()">读取本地缓存</button>
      <button class="btn blue" onclick="exportMerged()">导出总表 JSON</button>
      <button class="btn secondary" onclick="location.href='post-review.html'">待批改工作台 / Review Desk</button>
      <input type="file" id="jsonIn" accept="application/json" onchange="importJson(this)">
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('overview',this)">总览</button>
    <button class="tab" onclick="showTab('pre',this)">课前</button>
    <button class="tab" onclick="showTab('inclass',this)">课中</button>
    <button class="tab" onclick="showTab('post',this)">课后</button>
    <button class="tab" onclick="showTab('students',this)">按学生</button>
    <button class="tab" onclick="showTab('diagnostic',this)">学情诊断</button>
  </div>
  <div class="toolbar-card">
    <label>当前课程
      <select id="lessonFilter" onchange="state.pendingLesson=this.value"></select>
    </label>
    <button class="btn secondary" onclick="applyLessonFilter()">确认课程 / Apply Lesson</button>
    <label>当前查看范围
      <select id="studentFilter" onchange="state.pendingStudent=this.value"><option value="">全班</option></select>
      <button class="btn secondary" onclick="applyStudentFilter()">确认查看 / Apply</button>
    </label>
    <div class="quick-links"><a href="post-review.html">待批改工作台 / Review Desk</a></div>
  </div>
  <div id="app"></div>
</div>
<script>
var GAS='https://script.google.com/macros/s/AKfycbxrCd6f6cQ3wocXYQZyLKY0JutolEmOWWzTGOABnnHHJOm697OfyBlkLw-SQ-u-9ZAO/exec';
var _ctx=window.ClassProContext.read(),LESSON=_ctx.lesson,ROOM=_ctx.room,tab='overview';
var state={cloudRows:[],localData:null,importedData:null,lastCloud:'',dataSource:'',diagnosticAnonymous:false,diagnosticVersion:'',diagnosticGeneratedAt:'',diagnosticLessonData:null,diagnosticLessonDataKey:'',diagnosticLessonDataLoading:false,decisionLesson:'',decision:null};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function val(o,keys){for(var i=0;i<keys.length;i++){if(o&&o[keys[i]]!=null&&o[keys[i]]!=='')return o[keys[i]]}return''}
function normResult(r){r=String(r||'').toLowerCase();if(r==='correct'||r==='true'||r==='对'||r==='正确')return'correct';if(r==='wrong'||r==='false'||r==='错'||r==='错误')return'wrong';return r}
function showTab(t,btn){tab=t;document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});if(btn)btn.classList.add('active');if(t==='diagnostic')ensureDiagnosticLessonData();render()}
function scoped(rows){var n=state.student||new URLSearchParams(location.search).get('student')||'';return n?rows.filter(function(x){return String(val(x,['姓名','studentName','name','濮撳悕']))===n}):rows}
function splitRows(rows){var pre=[],mid=[],post=[],summary=[];rows.forEach(function(x){var lesson=val(x,['课程','lesson','璇剧▼']);if(lesson&&lesson!==LESSON)return;var stage=val(x,['环节','stage','鐜妭']);var mod=val(x,['模块','module','妯″潡']);if(stage==='预习'||stage==='课前'||stage==='pre_class')pre.push(x);else if(stage==='课后'||stage==='post_class')post.push(x);else if(mod==='session_summary')summary.push(x);else if(stage==='课中'||stage==='in_class'||mod)mid.push(x)});return{pre:pre,mid:mid,post:post,summary:summary}}
function loadCloud(){document.getElementById('app').innerHTML='<div class="empty">正在读取 '+esc(LESSON)+' 的 Google Sheets 数据...</div>';window.ClassProRecordsApi.fetchJson(GAS+'?action=get_data&lesson='+encodeURIComponent(LESSON),18000).then(function(d){var rows=window.ClassProRecordsApi.rowsFromPayload(d);state.cloudRows=rows;state.lastCloud=new Date().toLocaleString();state.dataSource='Google Sheets 学习记录';document.getElementById('status').textContent='云端已刷新：'+state.lastCloud+'；'+LESSON+' 共 '+rows.length+' 条';render()}).catch(function(){state.dataSource='';document.getElementById('status').textContent='云端读取失败，可先查看本地缓存。';render()})}
function loadLocal(){try{var raw=localStorage.getItem('ClassProData_'+ROOM);state.localData=raw?JSON.parse(raw):null}catch(e){state.localData=null}render()}
function importJson(input){var f=input.files&&input.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{state.importedData=JSON.parse(rd.result);render()}catch(e){alert('JSON 文件无法读取')}};rd.readAsText(f,'utf-8')}
function cloud(){var c=splitRows(state.cloudRows),n=state.student||new URLSearchParams(location.search).get('student')||'';if(!n)return c;function f(a){return a.filter(function(x){return String(val(x,['姓名','studentName','name','濮撳悕']))===n})}return{pre:f(c.pre),mid:f(c.mid),post:f(c.post),summary:f(c.summary)}}
function preStats(){var rows=cloud().pre,stu={},pending=0,score=0,total=0,weak={};rows.forEach(function(x){var n=val(x,['姓名','studentName','name','濮撳悕']);if(n)stu[n]=1;var st=val(x,['批改状态','status','鎵规敼鐘舵€?']);if(String(st).indexOf('待')>=0)pending++;var sc=Number(val(x,['得分','score','寰楀垎'])),tt=Number(val(x,['总分','total','鎬诲垎']));if(!isNaN(sc)&&!isNaN(tt)&&tt>0){score+=sc;total+=tt}var w=val(x,['薄弱点','weakPoints','weakPoint','钖勫急鐐?']);if(w)weak[w]=(weak[w]||0)+1});return{students:Object.keys(stu).length,records:rows.length,pending:pending,acc:total?Math.round(score/total*100):0,weak:weak}}
function localRecords(){var d=state.importedData||state.localData||{};return d.records||[]}
function localScoreboard(){var d=state.importedData||state.localData||{};return d.scoreboard||[]}
function cloudMidRecords(){return cloud().mid.map(function(x){return{studentName:val(x,['姓名','studentName','name','濮撳悕']),mode:val(x,['模块','module','妯″潡']),questionId:val(x,['题号','questionId']),answer:val(x,['学生作答','answer','瀛︾敓浣滅瓟']),result:normResult(val(x,['结果','result','autoResult'])),points:Number(val(x,['积分','points','pointsAwarded']))||0,basePoint:Number(val(x,['基础分','basePoint']))||0,speedRank:val(x,['速度名次','speedRank']),speedBonus:Number(val(x,['速度奖励','speedBonus']))||0,receivedAt:val(x,['提交时间','receivedAt','submittedAt','鎻愴氦鏃堕棿'])}})}
function inRows(){var cloudRows=cloudMidRecords();return cloudRows.length?cloudRows:localRecords()}
function inStats(){var rec=inRows(),correct=rec.filter(function(r){return normResult(r.result)==='correct'}).length,wrong=rec.filter(function(r){return normResult(r.result)==='wrong'}).length,stu={};rec.forEach(function(r){if(r.studentName)stu[r.studentName]=1});var board=scoreboardFromRecords(rec);return{students:Object.keys(stu).length||((state.localData&&state.localData.roster)||[]).length,participants:Object.keys(stu).length,records:rec.length,correct:correct,wrong:wrong,acc:rec.length?Math.round(correct/rec.length*100):0,top:board.slice(0,5)}}
function postRows(){return scoped(cloud().post)}
function postVal(x,keys){return val(x,keys)}
function isReviewModule(m){m=String(m||'');return m==='output'||m==='subjective'||m==='handwriting'}
function isReviewedRow(x){var s=String(dataVal(x,['status','批改状态','reviewStatus'],16)||'').toLowerCase(),fb=String(dataVal(x,['teacherFeedback','教师批改','correction'],15)||'').trim();return !!fb||s==='reviewed'||s.indexOf('\u5df2')>=0}
function isReviewRow(x){var m=String(dataVal(x,['module','模块'],4)||''),s=String(dataVal(x,['status','批改状态','reviewStatus'],16)||''),need=String(dataVal(x,['needsReview','needs_teacher_review','needsTeacherReview'],null)||'').toLowerCase(),open=String(dataVal(x,['openEnded','open_ended','isOpenEnded'],null)||'').toLowerCase();if(m==='homework_summary'||isReviewedRow(x))return false;return isReviewModule(m)||need==='true'||need==='yes'||open==='true'||open==='yes'||s.indexOf('\u5f85')>=0}
function isSummaryModule(m){return String(m||'')==='homework_summary'}
function postStats(){var rows=postRows(),stu={},summary={},objScore=0,objTotal=0,pending=0,hand=0;rows.forEach(function(x){var n=postVal(x,['姓名','studentName','name','濮撳悕']);var m=postVal(x,['模块','module','妯″潡']);if(n)stu[n]=1;if(isSummaryModule(m))summary[n]=x;if(m==='handwriting')hand++;if(isReviewRow(x))pending++;var sc=Number(postVal(x,['得分','score','寰楀垎'])),tt=Number(postVal(x,['总分','total','鎬诲垎']));if(!isNaN(sc)&&!isNaN(tt)&&tt>0){objScore+=sc;objTotal+=tt}});return{students:Object.keys(stu).length,submitted:Object.keys(summary).length,records:rows.length,acc:objTotal?Math.round(objScore/objTotal*100):0,pending:pending,handwriting:hand}}
function scoreboardFromRecords(rec){var s={};rec.forEach(function(r){var n=r.studentName;if(!n||n==='__CLASS__')return;s[n]=(s[n]||0)+(Number(r.pointsAwarded||r.points)||0)});var arr=Object.keys(s).map(function(n){return{name:n,points:s[n]}});if(!arr.length){return localScoreboard().map(function(r){return{name:r.n||r.name,points:r.t||r.points||0}})}return arr.sort(function(a,b){return b.points-a.points})}
function cards(items){return'<div class="grid">'+items.map(function(x){return'<div class="card"><div class="num">'+esc(x.n)+'</div><div class="label">'+esc(x.l)+'</div></div>'}).join('')+'</div>'}
function renderOverview(){var p=preStats(),i=inStats(),po=postStats();return cards([{n:p.students,l:'课前完成人数'},{n:p.acc+'%',l:'课前客观正确率'},{n:i.participants+'/'+i.students,l:'课中参与'},{n:i.acc+'%',l:'课中正确率'},{n:po.submitted,l:'课后提交人数'},{n:po.pending+p.pending,l:'待批改/查看'}])+renderSuggestions()}
function renderPre(){var p=preStats(),weak=Object.keys(p.weak).sort(function(a,b){return p.weak[b]-p.weak[a]});return cards([{n:p.students,l:'完成人数'},{n:p.records,l:'提交记录'},{n:p.acc+'%',l:'客观题正确率'},{n:p.pending,l:'待批改'}])+'<div class="panel"><h2>高频薄弱点</h2><div class="tags">'+(weak.length?weak.slice(0,8).map(function(k){return'<span class="tag">'+esc(k)+' × '+p.weak[k]+'</span>'}).join(''):'<span class="muted">暂无薄弱点记录</span>')+'</div></div>'+tablePre()}
function tablePre(){var rows=cloud().pre.slice(-80).reverse();if(!rows.length)return'<div class="empty">暂无课前数据。可点击“刷新云端数据”。</div>';return'<div class="panel"><h2>课前提交记录</h2><table><tr><th>时间</th><th>姓名</th><th>模块</th><th>得分</th><th>作答</th><th>状态</th></tr>'+rows.map(function(x){return'<tr><td>'+esc(val(x,['提交时间','timestamp','鎻愴氦鏃堕棿']))+'</td><td>'+esc(val(x,['姓名','studentName','濮撳悕']))+'</td><td>'+esc(val(x,['模块','module','妯″潡']))+'</td><td>'+esc(val(x,['得分','score','寰楀垎']))+'/'+esc(val(x,['总分','total','鎬诲垎']))+'</td><td>'+esc(val(x,['学生作答','answer','瀛︾敓浣滅瓟']))+'</td><td>'+esc(val(x,['批改状态','status','鎵规敼鐘舵€?']))+'</td></tr>'}).join('')+'</table></div>'}
function renderInClass(){var s=inStats();if(!s.records)return'<div class="empty">暂无课中数据。请先完成一次课堂互动，或导入教师端 JSON。</div>';return cards([{n:s.participants+'/'+s.students,l:'参与人数'},{n:s.records,l:'答题记录'},{n:s.acc+'%',l:'正确率'},{n:s.correct,l:'正确次数'},{n:s.wrong,l:'错误次数'}])+'<div class="panel"><h2>排行榜 Top 5</h2><div class="tags">'+(s.top.length?s.top.map(function(r,idx){return'<span class="tag">#'+(idx+1)+' '+esc(r.name)+' · '+esc(r.points||0)+' pts</span>'}).join(''):'<span class="muted">暂无积分</span>')+'</div></div>'+tableRecords()}

ty-item">排除记录：<b>'+quality.excludedRecords+'</b></div><div class="quality-item">重复提交折叠：<b>'+quality.duplicatesCollapsed+'</b></div><div class="quality-item">待批改：<b>'+quality.pendingReview+'</b></div><div class="quality-item">已排除账号：<b>'+quality.excludedAccounts+'</b></div></div><details style="margin-top:10px"><summary>查看排除原因汇总（不显示敏感明细）</summary><p class="muted">'+reasons+'</p></details></div><div class="panel"><h2>课堂行动建议</h2>'+diagnosticSuggestionsHtml(report)+'<p class="muted">建议由确定性规则生成，教师拥有最终决定权。</p></div><div class="panel"><h2>学生完成状态</h2>'+diagnosticStudentsHtml(report)+'</div><div class="panel"><h2>教师决策记录</h2><div class="decision-grid"><label>本课准备保留的内容<textarea id="decisionKeep">'+esc(d.keep||'')+'</textarea></label><label>准备加强或补充的内容<textarea id="decisionStrengthen">'+esc(d.strengthen||'')+'</textarea></label><label>准备减少或跳过的内容<textarea id="decisionReduce">'+esc(d.reduce||'')+'</textarea></label><label>课堂中用于再次确认的活动<textarea id="decisionConfirm">'+esc(d.confirm||'')+'</textarea></label></div><div class="decision-meta"><span class="muted">'+(d.savedAt?'上次保存：'+esc(new Date(d.savedAt).toLocaleString()):'尚未保存；仅保存在本浏览器，不写回学习记录。')+'</span><button class="btn no-print" onclick="saveDiagnosticDecision()">保存教师决策</button></div></div><div class="panel"><h2>原始证据追溯</h2><p class="muted">测试题中的“查看题目证据”可展开到学生、提交时间、得分和作答摘要。匿名开关同步作用于页面、打印和诊断 JSON 导出。</p></div>'}

function exportMerged(){var data={lesson:LESSON,room:ROOM,exportedAt:new Date().toISOString(),cloudRows:state.cloudRows,localData:state.localData,importedData:state.importedData};var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}));a.download='ClassPro_'+LESSON+'_merged_data.json';a.click()}
function analysisRows(){

}
function analysisStage(x){
  var s=stageOfRow(x);
  return s==='pre'||s==='mid'||s==='post'?s:'';
}
function analysisModule(x){return String(dataVal(x,['module','模块'],4)||'');}
function analysisStudent(x){return String(dataVal(x,['studentName','姓名','name'],1)||'').trim();}
function analysisScore(x){return numberVal(x,['score','得分'],[6,5]);}
function analysisTotal(x){return numberVal(x,['total','总分'],[7,6]);}
function analysisPending(x){return isReviewRow(x);}
function aggregateStudents(rows){
  var by={};
  rows.forEach(function(x){var n=analysisStudent(x);if(!n||n==='__CLASS__')return;var a=by[n]||(by[n]={name:n,score:0,total:0,attempts:0,correct:0,pre:0,mid:0,post:0,pending:0,weak:{}}),st=analysisStage(x),sc=analysisScore(x),tt=analysisTotal(x),res=resultText(x);if(st==='pre')a.pre++;if(st==='mid')a.mid++;if(st==='post')a.post++;if(tt>0){a.score+=sc;a.total+=tt;a.attempts++;if(res==='\u6b63\u786e'||res==='correct'||sc===tt)a.correct++;}if(analysisPending(x))a.pending++;var weak=dataVal(x,['weakPoints','薄弱点'],15);if(weak)a.weak[weak]=(a.weak[weak]||0)+1;});
  return Object.keys(by).sort().map(function(n){var a=by[n];a.accuracy=a.total?Math.round(a.score/a.total*100):0;a.correctRate=a.attempts?Math.round(a.correct/a.attempts*100):0;return a;});
}
function studentAnalysisTable(){

  return'<div class="panel"><h2>按学生分析</h2><table><tr><th>学生</th><th>总得分</th><th>准确率</th><th>课前 / 课中 / 课后</th><th>待批改</th><th>学习情况分析</th></tr>'+list.map(function(a){var weak=Object.keys(a.weak).slice(0,2).join('、');var note=a.pending?'有 '+a.pending+' 条记录待教师批改':(a.accuracy>=85?'掌握情况较好，建议继续拓展':'建议重点复习错题和薄弱点');if(weak)note+='；薄弱点：'+weak;return'<tr><td>'+esc(a.name)+'</td><td>'+esc(a.score)+' / '+esc(a.total)+'</td><td>'+esc(a.accuracy)+'%</td><td>'+esc(a.pre)+' / '+esc(a.mid)+' / '+esc(a.post)+'</td><td>'+esc(a.pending)+'</td><td>'+esc(note)+'</td></tr>'}).join('')+'</table></div>';
}
function currentPerformance(){var list=aggregateStudents(analysisRows()),score=list.reduce(function(s,a){return s+a.score},0),total=list.reduce(function(s,a){return s+a.total},0),active=list.filter(function(a){return a.pre+a.mid+a.post>0}).length;return'<div class="panel"><h2>当前课表现 · '+esc(LESSON)+'</h2><div class="grid"><div class="card"><div class="num">'+active+'</div><div class="label">有学习记录学生</div></div><div class="card"><div class="num">'+score+'/'+total+'</div><div class="label">全班总得分</div></div><div class="card"><div class="num">'+(total?Math.round(score/total*100):0)+'%</div><div class="label">全班准确率</div></div></div></div>'}
function historyReports(){var blocks=window.HSK1_REPORT_BLOCKS||[{from:1,to:5,label:'第一阶段（第1—5课）'},{from:6,to:10,label:'第二阶段（第6—10课）'},{from:11,to:15,label:'第三阶段（第11—15课）'}],rows=state.cloudRows||[],by={};rows.forEach(function(x){var id=String(val(x,['lesson','课程'])||'').toUpperCase(),m=id.match(/HSK1-L(\\d+)/);if(!m)return;var no=Number(m[1]),a=by[no]||(by[no]={score:0,total:0,records:0});a.score+=analysisScore(x);a.total+=analysisTotal(x);a.records++;});var trend=Object.keys(by).sort(function(a,b){return Number(a)-Number(b)}).map(function(no){var a=by[no];return'第'+Number(no)+'课：'+(a.total?Math.round(a.score/a.total*100):0)+'%（'+a.records+'条记录）'}).join(' · ');return'<div class="panel"><h2>历史趋势与五课阶段报告</h2><p class="muted">'+(trend||'当前尚无跨课程数据；完成更多课程后将在这里显示每课趋势。')+'</p>'+blocks.map(function(b){var n=0,s=0,t=0;for(var i=b.from;i<=b.to;i++){if(by[i]){n++;s+=by[i].score;t+=by[i].total}}return'<div class="card" style="margin-top:8px"><b>'+esc(b.label)+'</b><div class="muted">已记录 '+n+' / '+(b.to-b.from+1)+' 课 · 阶段准确率 '+(t?Math.round(s/t*100):0)+'%</div></div>'}).join('')+'</div>'}
function renderOverview(){var p=preStats(),i=inStats(),po=postStats();return cards([{n:p.students,l:'课前完成人数'},{n:p.acc+'%',l:'课前客观正确率'},{n:i.participants+'/'+i.students,l:'课中参与'},{n:i.acc+'%',l:'课中正确率'},{n:po.submitted,l:'课后提交人数'},{n:po.pending+p.pending,l:'待批改/查看'}])+currentPerformance()+studentAnalysisTable()+historyReports()+renderSuggestions()}
loadLocal();render();
</script>
<script>
// 统一 GAS 行读取：兼容字段名缺失但 __values 完整的历史/新记录。
(function(){
  var oldVal=val,idx={
    timestamp:0,提交时间:0,receivedAt:0,submittedAt:0,
    studentName:1,姓名:1,student:1,
    lesson:2,课程:2,lessonKey:2,
    stage:3,环节:3,模块:4,module:4,
    questionId:5,题号:5,score:6,得分:6,total:7,总分:7,
    points:8,积分:8,answer:13,学生作答:13,result:14,结果:14,
    teacherFeedback:15,教师批改:15,status:16,批改状态:16
  };
  val=function(o,keys){
    var v=oldVal(o,keys);if(v!==''&&v!=null)return v;
    if(o&&Array.isArray(o.__values))for(var i=0;i<keys.length;i++){var n=idx[keys[i]];if(n!=null&&o.__values[n]!==''&&o.__values[n]!=null)return o.__values[n]}
    return '';
  };
  function reviewUrl(){
    var q=window.ClassProContext&&ClassProContext.query?ClassProContext.query({lesson:LESSON,room:ROOM,student:state.student||''}):('lesson='+encodeURIComponent(LESSON)+'&room='+encodeURIComponent(ROOM));
    q+=(q?'&':'')+'scope='+encodeURIComponent(LESSON);
    return 'post-review.html?'+q;
  }
  window.openReview=function(){location.href=reviewUrl()};
  var oldLoadCloud=loadCloud;
  loadCloud=function(){
    var localHost=location.hostname==='localhost'||location.hostname==='127.0.0.1';
    if(!localHost){oldLoadCloud();return}
    document.getElementById('app').innerHTML='<div class="empty">正在读取 '+esc(LESSON)+' 的云端与本地课程记录...</div>';
    fetch('/api/reviews?lesson='+encodeURIComponent(LESSON)).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){
      var rows=[];
      if(d&&Array.isArray(d.data))rows=d.data.slice();
      else if(d&&d.data)for(var k in d.data)(d.data[k]||[]).forEach(function(x){rows.push(x)});
      state.cloudRows=rows;state.lastCloud=new Date().toLocaleString();
      var merged=d&&d.source==='google_sheets_and_local';
      state.dataSource=merged?'Google Sheets + 本地记录合并':'本地记录（云端读取失败）';
      document.getElementById('status').textContent=(merged?'云端与本地记录已刷新':'云端读取失败，当前使用本地记录')+'：'+LESSON+' 共 '+rows.length+' 条'+(merged?'（云端 '+(d.remoteRecords||0)+'，本地 '+(d.localRecords||0)+'）':'');render();
    }).catch(function(){state.dataSource='';document.getElementById('status').textContent='云端和本地记录均读取失败';render()});
  };
  function postStudent(x){return String(dataVal(x,['studentName','name'],1)||'').trim()}
  function postLesson(x){return String(dataVal(x,['lesson','lessonKey'],2)||'').trim()}
  function postRoom(x){return String(dataVal(x,['room'],9)||'').trim()}
  function postModule(x){return String(dataVal(x,['module','mode'],4)||'').trim()}
  function postTime(x){return String(dataVal(x,['submittedAt','timestamp','receivedAt'],0)||'').trim()}
  function moduleCn(m){var map={choice:'选择题',fill_blank:'选词填空',ordering:'连词成句',output:'输出题',subjective:'主观题',handwriting:'汉字书写',homework_summary:'作业总结',image_guess:'图片猜词',sentence_match:'词句匹配',v1:'图片猜词',v4:'句子转换',v5:'选词填空',v7:'词句匹配',v8:'词了个词',w1:'汉字区辨',ttq:'课文问答',g1:'连词成句',pinyin:'拼音练习'};return map[String(m||'')]||m||'其他题型'}
  function resultCn(r){r=String(r||'').toLowerCase();if(r==='correct')return'正确';if(r==='wrong')return'错误';if(r==='submitted')return'已提交';if(r==='reviewed')return'已批改';if(r==='archived')return'已归档';return r||'未记录'}
  function statusCn(s){s=String(s||'');if(s==='reviewed')return'已批改';if(s==='archived')return'已归档';return s}
  function latestPostAttempts(rows){
    var latest={};
    rows.forEach(function(x){
      if(postModule(x)!=='homework_summary')return;
      var key=[postStudent(x),postLesson(x),postRoom(x)].join('|'),old=latest[key];
      if(!old||Date.parse(postTime(x))>=Date.parse(postTime(old)))latest[key]=x;
    });
    return rows.filter(function(x){
      var latestRow=latest[[postStudent(x),postLesson(x),postRoom(x)].join('|')];
      return !latestRow||postTime(x)===postTime(latestRow);
    });
  }
  postRows=function(){return latestPostAttempts(scoped(cloud().post))};
  allRows=function(){var c=splitRows(state.cloudRows);return c.pre.concat(c.mid).concat(latestPostAttempts(c.post))};
  tablePostRows2=function(rows,title){
    if(!rows.length)return'<div class="empty">\u6682\u65e0'+title+'\u3002</div>';
    return'<div class="panel"><h2>'+title+'</h2><table><tr><th>\u65f6\u95f4</th><th>\u59d3\u540d</th><th>\u6a21\u5757</th><th>\u9898\u53f7</th><th>\u5f97\u5206</th><th>\u7ed3\u679c</th><th>\u4f5c\u7b54</th><th>\u64cd\u4f5c</th></tr>'+rows.slice(-160).reverse().map(function(x){var m=postModule(x),res=normResult(dataVal(x,['result','autoResult'],14)),op=isReviewRow(x)?'<button class="btn secondary" onclick="openReview()">\u6253\u5f00\u8bfe\u540e\u6279\u6539</button>':'';return'<tr><td>'+esc(postTime(x))+'</td><td>'+esc(postStudent(x))+'</td><td>'+esc(moduleCn(m))+'</td><td>'+esc(dataVal(x,['questionId'],5))+'</td><td>'+esc(dataVal(x,['score'],6))+'/'+esc(dataVal(x,['total'],7))+'</td><td><span class="pill '+(res==='correct'?'ok':res==='wrong'?'bad':'wait')+'">'+esc(resultCn(res||'submitted')+(statusCn(dataVal(x,['status','批改状态'],16))?' · '+statusCn(dataVal(x,['status','批改状态'],16)):''))+'</span></td><td>'+esc(previewAnswer(dataVal(x,['answer'],13),m))+'</td><td>'+op+'</td></tr>'}).join('')+'</table></div>';
  };
  tableRecords=function(){var rec=inRows().slice(0,120);if(!rec.length)return'<div class="empty">暂无课中答题记录。</div>';return'<div class="panel"><h2>课中答题记录</h2><table><tr><th>时间</th><th>姓名</th><th>题型</th><th>题号</th><th>答案</th><th>结果</th><th>积分</th><th>速度奖励</th></tr>'+rec.map(function(r){var res=normResult(r.result);return'<tr><td>'+esc(r.receivedAt||r.submittedAt)+'</td><td>'+esc(r.studentName)+'</td><td>'+esc(moduleCn(r.mode))+'</td><td>'+esc(r.questionId)+'</td><td>'+esc(r.answer)+'</td><td><span class="pill '+(res==='correct'?'ok':res==='wrong'?'bad':'wait')+'">'+esc(resultCn(res))+'</span></td><td>'+esc(r.pointsAwarded||r.points||0)+'</td><td>'+esc(r.speedRank?('#'+r.speedRank+' +'+(r.speedBonus||0)):'')+'</td></tr>'}).join('')+'</table></div>'}
  function patchReviewLinks(){
    document.querySelectorAll('a[href*="post-review.html"]').forEach(function(a){a.href=reviewUrl()});
    document.querySelectorAll('button[onclick*="post-review.html"]').forEach(function(b){b.onclick=function(){openReview()}});
  }

  if(window.MutationObserver)new MutationObserver(patchReviewLinks).observe(document.body,{childList:true,subtree:true});
  render();
  loadCloud();
})();
</script>
<script>
/* Stage report v1: readable 5-lesson summaries for the teacher dashboard. */
(function(){
  function lessonIdOfRow(x){
    var raw=String(dataVal(x,['lesson','lessonKey','课程','课程编号'],2)||'').toUpperCase();
    var m=raw.match(/HSK1-L(\d+)/);
    return m?'HSK1-L'+m[1].padStart(2,'0'):raw;
  }
  function lessonNoOf(id){var m=String(id||'').match(/L(\d+)/);return m?Number(m[1]):0}
  function studentOfRow(x){return String(dataVal(x,['studentName','name','姓名','学生姓名'],1)||'').trim()}
  function stageAdvice(done,rate,pending){
    if(!done)return'阶段数据不足：先完成该阶段课程的课前、课中和课后记录。';
    if(pending)return'有待批改记录：先完成主观题和汉字书写反馈，再判断阶段表现。';
    if(rate>=85)return'阶段整体稳定：可增加跨课表达输出和复现练习。';
    if(rate>=60)return'阶段基础已建立：建议围绕低分课程和错题题型做复习。';
    return'阶段风险较高：建议回到核心生词、句型和汉字认读重新巩固。';
  }
  historyReports=function(){
    var blocks=window.HSK1_REPORT_BLOCKS||[{from:1,to:5},{from:6,to:10},{from:11,to:15}],rows=analysisRows(),by={};
    rows.forEach(function(x){
      var id=lessonIdOfRow(x),no=lessonNoOf(id);if(!no)return;
      var a=by[no]||(by[no]={score:0,total:0,records:0,students:{},pending:0});
      a.score+=analysisScore(x);a.total+=analysisTotal(x);a.records++;
      var stu=studentOfRow(x);if(stu)a.students[stu]=1;
      if(analysisPending(x))a.pending++;
    });
    var lessonTrend=Object.keys(by).sort(function(a,b){return Number(a)-Number(b)}).map(function(no){
      var a=by[no],rate=a.total?Math.round(a.score/a.total*100):0;
      return'第'+Number(no)+'课：'+rate+'%（'+a.records+'条）';
    }).join(' · ');
    var h='<div class="panel"><h2>历史趋势与阶段报告</h2><p class="muted">'+(lessonTrend||'当前尚无跨课程数据；完成更多课程后将在这里显示每课趋势。')+'</p>';
    h+=blocks.map(function(b){
      var ids=[],s=0,t=0,records=0,students={},pending=0;
      for(var i=b.from;i<=b.to;i++){ids.push(i);if(by[i]){s+=by[i].score;t+=by[i].total;records+=by[i].records;pending+=by[i].pending;Object.keys(by[i].students).forEach(function(n){students[n]=1})}}
      var done=ids.filter(function(i){return by[i]}).length,rate=t?Math.round(s/t*100):0,label='第'+b.from+'-'+b.to+'课阶段小结';
      return'<div class="card" style="margin-top:10px"><b>'+esc(label)+'</b><div class="grid" style="margin:10px 0"><div class="card"><div class="num">'+done+'/'+ids.length+'</div><div class="label">已有记录课程</div></div><div class="card"><div class="num">'+Object.keys(students).length+'</div><div class="label">参与学生</div></div><div class="card"><div class="num">'+rate+'%</div><div class="label">阶段准确率</div></div><div class="card"><div class="num">'+pending+'</div><div class="label">待批改/查看</div></div></div><div class="muted">阶段得分 '+s+'/'+t+' · 共 '+records+' 条记录。'+esc(stageAdvice(done,rate,pending))+'</div></div>';
    }).join('');
    return h+'</div>';
  };
  if(typeof render==='function')render();
})();
</script>
