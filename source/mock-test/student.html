<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK Mock Test / 测</title>
<script src="../shared/students.js"></script>
<script src="../shared/context.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f7f8f3;color:#203421;padding:18px}
.wrap{max-width:980px;margin:auto}
.hero,.panel,.item,.result{background:#fff;border:1px solid #dfeac8;border-radius:18px;box-shadow:0 14px 32px rgba(86,115,55,.10)}
.hero{padding:24px;margin-bottom:16px;background:linear-gradient(135deg,#fff,#edf6d9)}
.brand{font-size:13px;font-weight:900;color:#3f7f32;letter-spacing:.4px}
h1{margin:8px 0 6px;font-size:30px;color:#203421}
.muted{color:#74806d;font-size:14px;line-height:1.6}
.panel{padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,.btn{border-radius:999px;padding:10px 14px;font-weight:900;font-size:14px}
select{min-width:260px;border:1px solid #cfe2a5;background:#fff;color:#203421}
.btn{border:0;background:#4f8f2d;color:#fff;cursor:pointer}
.btn.secondary{background:#edf6d9;color:#3f7f32;border:1px solid #cfe2a5}
.section-title{margin:22px 0 10px;font-size:22px;color:#3f7f32}
.item{padding:18px;margin:12px 0}
.item-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.item-no{font-weight:1000;color:#3f7f32}
.tag{padding:5px 10px;border-radius:999px;background:#edf6d9;color:#3f7f32;font-size:12px;font-weight:900}
.prompt{font-weight:900;margin-bottom:8px}
.question{font-family:KaiTi,STKaiti,"Kaiti SC","Microsoft YaHei",serif;font-size:25px;line-height:1.5;font-weight:900;margin:10px 0;color:#203421}
.passage{padding:12px 14px;border-radius:14px;background:#f8faf3;border:1px solid #dfeac8;font-size:22px;line-height:1.7;margin:10px 0;font-family:KaiTi,STKaiti,"Kaiti SC","Microsoft YaHei",serif}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.option{border:2px solid #dfeac8;border-radius:16px;background:#fff;padding:12px;cursor:pointer;text-align:left;min-height:74px;font-weight:900;color:#203421}
.option.selected{border-color:#4f8f2d;background:#edf6d9}
.option img{width:100%;height:120px;object-fit:contain;border-radius:12px;background:#f8faf3;margin-bottom:8px}
.audio-text{display:none}
.result{padding:24px;text-align:center;margin-top:16px}
.score{font-size:48px;font-weight:1000;color:#3f7f32}
.hidden{display:none!important}
@media(max-width:760px){body{padding:10px}.options{grid-template-columns:1fr}.hero{padding:20px}h1{font-size:25px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div class="brand">ClassPro+ 测 / HSK Mock Test</div>
    <h1 id="title">HSK1 模拟测试</h1>
    <div class="muted">最小可测版本：先跑通听力、阅读、计分和独立记录。正式版会由教师控制播放音频。</div>
  </section>

  <section id="startPanel" class="panel">
    <div class="row">
      <label style="font-weight:900" for="studentName">姓名 / Name</label>
      <select id="studentName"></select>
      <button class="btn" onclick="startTest()">开始测试 / Start</button>
      <a class="btn secondary" href="../student/index.html">返回学生主页</a>
    </div>
    <p class="muted">测试过程中不会即时显示正确答案；提交后生成本次成绩。</p>
  </section>

  <section id="testPanel" class="hidden"></section>
  <section id="resultPanel" class="hidden result"></section>
</main>

<script>
var TEST=null,answers={},studentName="",storageKey="";
var GAS="https://script.google.com/macros/s/AKfycbxrCd6f6cQ3wocXYQZyLKY0JutolEmOWWzTGOABnnHHJOm697OfyBlkLw-SQ-u-9ZAO/exec";
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function qs(){return new URLSearchParams(location.search)}
function testId(){return qs().get("test")||"HSK1-mock-01"}
function allItems(){var out=[];(TEST.sections||[]).forEach(function(s){(s.items||[]).forEach(function(x){out.push(x)})});return out}
function renderNames(){var names=window.CLASS_STUDENTS||[];document.getElementById("studentName").innerHTML='<option value="">请选择姓名 / Select name</option>'+names.map(function(n){return'<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join("")}
function loadTest(){fetch("../data-model/mock-tests/"+testId()+".json").then(function(r){return r.json()}).then(function(d){TEST=d;document.getElementById("title").textContent=d.titleCn+" / "+d.title;renderNames()}).catch(function(){document.getElementById("startPanel").innerHTML='<div class="muted">测试数据读取失败。</div>'})}
function startTest(){studentName=document.getElementById("studentName").value;if(!studentName){alert("请先选择姓名");return}storageKey="ClassProMock_"+TEST.testId+"_"+studentName;try{answers=JSON.parse(localStorage.getItem(storageKey)||"{}")}catch(e){answers={}}document.getElementById("startPanel").classList.add("hidden");document.getElementById("testPanel").classList.remove("hidden");renderTest()}
function choose(id,opt){answers[id]=opt;try{localStorage.setItem(storageKey,JSON.stringify(answers))}catch(e){}renderTest()}
function speak(id){var item=allItems().filter(function(x){return x.id===id})[0];if(!item||!item.audioText)return;if(window.speechSynthesis){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(item.audioText);u.lang="zh-CN";u.rate=.82;speechSynthesis.speak(u)}}
function renderOption(item,opt){var selected=answers[item.id]===opt.id;var img=opt.image?'<img src="'+esc(opt.image)+'" alt="">':'';return'<button type="button" class="option '+(selected?'selected':'')+'" onclick="choose(\''+esc(item.id)+'\',\''+esc(opt.id)+'\')">'+img+'<div>'+esc(opt.id)+'. '+esc(opt.text||"")+'</div></button>'}
function renderItem(item){var h='<article class="item"><div class="item-head"><div class="item-no">第 '+item.number+' 题</div><div class="tag">'+esc(item.skill==="listening"?"听力":"阅读")+'</div></div><div class="prompt">'+esc(item.prompt)+'</div>';if(item.skill==="listening")h+='<button class="btn secondary" type="button" onclick="speak(\''+esc(item.id)+'\')">播放听力 / Play</button><div class="audio-text">'+esc(item.audioText||"")+'</div>';if(item.passage)h+='<div class="passage">'+esc(item.passage)+'</div>';if(item.question)h+='<div class="question">'+esc(item.question)+'</div>';h+='<div class="options">'+(item.options||[]).map(function(o){return renderOption(item,o)}).join("")+'</div></article>';return h}
function renderTest(){var h="",sections=TEST.sections||[];sections.forEach(function(s){h+='<h2 class="section-title">'+esc(s.title)+' / '+esc(s.titleEn)+'</h2>';h+=(s.items||[]).map(renderItem).join("")});var done=Object.keys(answers).length,total=allItems().length;h+='<div class="panel"><div class="row"><b>已答 '+done+' / '+total+'</b><button class="btn" onclick="submitTest()" '+(done<total?'disabled style="opacity:.45"':'')+'>提交测试 / Submit</button></div></div>';document.getElementById("testPanel").innerHTML=h}
function score(){var sc=0,total=0,wrong=[];allItems().forEach(function(x){total+=x.points||1;if(answers[x.id]===x.answer)sc+=x.points||1;else wrong.push(x.number)});return{score:sc,total:total,wrong:wrong}}
function postRecord(record){var local=location.hostname==="localhost"||location.hostname==="127.0.0.1";var url=local?"/api/pre-class-record":GAS;return fetch(url,{method:"POST",mode:local?"cors":"no-cors",headers:{"Content-Type":local?"application/json":"text/plain;charset=utf-8"},body:JSON.stringify(record)})}
function submitTest(){if(!confirm("确认提交本次测试吗？提交后会生成成绩。"))return;var s=score(),now=new Date().toISOString();var record={action:"mock_test_submit",recordType:"mock_test",lesson:TEST.recordLesson||TEST.testId,testId:TEST.testId,studentName:studentName,name:studentName,stage:"mock_test",module:"mock_test",questionId:TEST.testId,score:s.score,total:s.total,points:s.score,answer:JSON.stringify(answers),result:"submitted",autoResult:"submitted",weakPoints:s.wrong.length?("错题："+s.wrong.join("、")):"",submittedAt:now,questionText:TEST.titleCn};postRecord(record).then(function(){showResult(s,true)}).catch(function(){showResult(s,false)})}
function showResult(s,saved){document.getElementById("testPanel").classList.add("hidden");var p=document.getElementById("resultPanel");p.classList.remove("hidden");p.innerHTML='<div class="score">'+s.score+' / '+s.total+'</div><p>'+(saved?'记录已提交。':'本地显示成绩，但记录提交失败，请告知老师。')+'</p><p class="muted">'+(s.wrong.length?'错题：'+s.wrong.join("、"):'全部正确。')+'</p><a class="btn secondary" href="../student/index.html">返回学生主页</a>';try{localStorage.removeItem(storageKey)}catch(e){}}
loadTest();
</script>
</body>
</html>
