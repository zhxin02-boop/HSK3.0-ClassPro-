<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK三级专项练习记录 · ClassPro</title>
<link rel="stylesheet" href="special.css?v=5">
<script defer src="../../shared/class-config.js"></script>
<script defer src="../../shared/context.js"></script>
<script defer src="../../shared/api.js"></script>
<script defer src="common.js?v=2"></script>
<script defer src="reports.js?v=3"></script>
<script defer src="records.js?v=1"></script>
<script defer src="learning.js?v=1"></script>
<script defer src="teacher-feedback.js?v=1"></script>
<script defer src="results.js?v=6"></script>
</head>
<body>
<header class="site-header"><div class="shell"><a id="home-link" href="../../teacher/index.html">Chinese ClassPro</a><span>教师端</span></div></header>
<main class="shell">
  <section class="intro">
    <h1>第一周专项练习记录</h1>
    <p>按班级和课次查看提交、分项成绩和看图造句批改进度。</p>
  </section>
  <nav class="actions teacher-tabs" aria-label="专项练习教师端">
    <a id="preview-link" class="button secondary" href="preview.html">预览试题</a>
    <a class="button" aria-current="page" href="results.html">作答记录</a>
  </nav>
  <section class="panel teacher-controls" aria-label="筛选">
    <div class="identity">
      <label>班级<select id="class"></select></label>
      <label>练习<select id="set"></select></label>
    </div>
    <div class="actions">
      <button id="refresh" type="button" disabled>刷新记录</button>
      <button id="share" class="secondary" type="button" disabled>复制学生作答链接</button>
      <button id="export" class="secondary" type="button" disabled>导出CSV</button>
      <button id="clear-run" class="secondary" type="button" hidden>查看本套全部场次</button>
    </div>
  </section>
  <p id="notice" class="notice" role="status" hidden></p>
  <section id="class-report" class="panel" hidden aria-label="班级统计"></section>
  <section id="results" hidden aria-label="学生提交记录"></section>
</main>
</body>
</html>
