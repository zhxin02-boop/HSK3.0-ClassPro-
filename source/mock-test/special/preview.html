<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK三级专项练习 · 教师预览 · ClassPro</title>
<link rel="stylesheet" href="special.css?v=5">
<script defer src="../../shared/class-config.js"></script>
<script defer src="../../shared/context.js"></script>
<script defer src="../../shared/api.js"></script>
<script defer src="../../shared/classroom-channel.js?v=special-1"></script>
<script defer src="common.js?v=2"></script>
<script defer src="room.js?v=4"></script>
<script defer src="questions.js?v=3"></script>
<script defer src="records.js?v=1"></script>
<script defer src="learning.js?v=1"></script>
<script defer src="teacher-feedback.js?v=1"></script>
<script defer src="reports.js?v=3"></script>
<script defer src="preview.js?v=3"></script>
<script defer src="teacher-room.js?v=5"></script>
</head>
<body>
<header class="site-header"><div class="shell"><a id="home-link" href="../../teacher/index.html">Chinese ClassPro</a><span>教师端</span></div></header>
<main class="shell">
  <section class="intro">
    <h1>HSK三级专项练习 · 第一周</h1>
    <p>第1–6课。选择一套预览听力、阅读和书写试题。</p>
  </section>
  <nav class="actions teacher-tabs" aria-label="专项练习教师端">
    <a class="button" aria-current="page" href="preview.html">预览试题</a>
    <a id="records-link" class="button secondary" href="results.html">作答记录</a>
  </nav>
  <section class="panel teacher-controls" aria-label="教师预览选项">
    <div class="identity"><label>选课次<select id="set" disabled></select></label></div>
    <div class="preview-options actions">
      <label><input id="show-answers" type="checkbox">显示答案和参考句</label>
      <label><input id="show-transcripts" type="checkbox">显示听力原文</label>
      <a id="student-link" class="button secondary" target="_blank" rel="noopener" href="index.html" hidden>预览学生版</a>
    </div>
  </section>
  <section class="panel room-controls" aria-label="课堂答题控制">
    <div class="practice-heading"><div><h2>课堂答题控制</h2><p id="room-label"></p></div><b id="room-status" role="status"></b></div>
    <div class="actions">
      <button id="open-room" type="button" disabled>开放听力</button>
      <button id="end-section" class="secondary" type="button" disabled>结束当前部分</button>
      <button id="release-review" class="secondary" type="button" disabled>开放讲评</button>
      <button id="close-room" class="secondary" type="button" disabled>结束本场</button>
      <button id="copy-room-link" class="secondary" type="button" disabled>复制本场学生链接</button>
      <a id="open-room-student" class="button secondary" target="_blank" rel="noopener" href="index.html" hidden>打开本场学生端</a>
    </div>
    <p id="room-message" class="help" role="status">逐段开放听力、阅读和书写，可以在两部分之间讲题。课堂听力由教师播放。</p>
    <details><summary id="room-summary">班级进度</summary><div id="room-progress-list"></div></details>
  </section>
  <p id="notice" class="notice" role="status" hidden></p>
  <section id="preview-content" hidden aria-labelledby="preview-title">
    <div class="intro"><h2 id="preview-title"></h2></div>
    <nav id="skills" class="skills" aria-label="切换题型">
      <button type="button" data-skill="listening" aria-pressed="true">听力 30题</button>
      <button type="button" data-skill="reading" aria-pressed="false">阅读 30题</button>
      <button type="button" data-skill="writing" aria-pressed="false">书写 10题</button>
    </nav>
    <div id="teaching-cues" class="teaching-cues" hidden></div>
    <div id="sections"></div>
  </section>
</main>
</body>
</html>
