<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学生历史趋势与阶段报告</title>
<script src="../shared/students.js"></script>
<script src="../data-model/hsk1-curriculum.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f8f7fb;color:#29233a;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:960px;margin:auto}.hero,.panel,.lesson,.block{background:#fff;border:1px solid #e5def7;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 25px rgba(75,54,120,.08)}h1{margin:0 0 6px;color:#5847bc;font-size:25px}h2{margin:0 0 12px;color:#44368f}.muted{color:#817894;font-size:13px;line-height:1.55}.namebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}select,button{padding:10px 13px;border-radius:999px;border:1px solid #d8cff5;background:#fff;font-size:14px;font-weight:800}select{min-width:250px}button{background:#6c5ce7;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:#f7f5ff;border-radius:14px;padding:12px;text-align:center}.kpi b{display:block;font-size:23px;color:#5847bc}.kpi span{font-size:11px;color:#817894}.lesson{display:flex;justify-content:space-between;gap:14px;align-items:center}.lesson h3,.block h3{margin:0 0 4px;color:#44368f}.lesson .score{font-size:22px;font-weight:900;color:#5847bc;white-space:nowrap}.block{border-left:6px solid #6c5ce7}.block.good{border-left-color:#3f9f5f}.block.warn{border-left-color:#d97706}.block.empty-block{border-left-color:#cbd5e1}.tips{margin-top:10px;padding:10px 12px;border-radius:14px;background:#fbfaff;color:#5b5370;font-size:13px;line-height:1.55}.empty{text-align:center;padding:28px;color:#817894;border:1px dashed #d8cff5;border-radius:16px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.lesson{display:block}.lesson .score{margin-top:8px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
  <h1>历史趋势与阶段报告</h1>
  <div class="muted">History & 5-Lesson Reports · 选择姓名后查看自己的课程记录、阶段表现和复习建议。</div>
  <div class="namebar">
    <select id="studentName"><option value="">Select your name / 选择姓名</option></select>
    <button onclick="loadHistory()">查看报告 / View Report</button>
    <a href="index.html" style="color:#5847bc;font-weight:900;text-decoration:none">返回学生界面</a>
  </div>
</section>
<div id="app"><div class="empty">请选择姓名后查看。</div></div>
</main>
<script>
var GAS="https://script.google.com/macros/s/AKfycbxrCd6f6cQ3wocXYQZyLKY0JutolEmOWWzTGOABnnHHJOm697OfyBlkLw-SQ-u-9ZAO/exec";
var IDX={time:0,student:1,lesson:2,stage:3,module:4,qid:5,score:6,total:7,answer:13,result:14,status:16};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function val(x,keys,idx){for(var i=0;i<keys.length;i++){if(x&&x[keys[i]]!=null&&x[keys[i]]!=="")return x[keys[i]]}if(x&&Array.isArray(x.__values)&&idx!=null&&x.__values[idx]!=null)return x.__values[idx];return""}
function num(x,keys,idx){var n=Number(val(x,keys,idx));return isNaN(n)?0:n}
function lessonId(x){var raw=String(val(x,["lesson","lessonKey","课程","课程编号"],IDX.lesson)||"").toUpperCase();var m=raw.match(/HSK1-L(\d+)/);return m?"HSK1-L"+m[1].padStart(2,"0"):raw}
function lessonNo(id){var m=String(id||"").match(/L(\d+)/);return m?Number(m[1]):0}
function stageOf(x){var s=String(val(x,["stage","环节","阶段"],IDX.stage)||"").toLowerCase();if(["pre_class","pre","课前","预习"].indexOf(s)>=0)return"pre";if(["in_class","inclass","mid","课中"].indexOf(s)>=0)return"mid";if(["post_class","postclass","post","课后"].indexOf(s)>=0)return"post";return"other"}
function isCorrect(x){var r=String(val(x,["result","autoResult","结果"],IDX.result)||"").toLowerCase(),sc=num(x,["score","得分"],IDX.score),tt=num(x,["total","总分"],IDX.total);return r==="correct"||r==="正确"||(tt>0&&sc===tt)}
function init(){var el=document.getElementById("studentName"),students=window.CLASS_STUDENTS||[];el.innerHTML='<option value="">Select your name / 选择姓名</option>'+students.map(function(n){return'<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join("")}
function sourceUrl(){return (location.hostname==="localhost"||location.hostname==="127.0.0.1")?"/api/reviews":GAS+"?action=get_all"}
function flatten(data){var rows=[];if(data&&Array.isArray(data.data))rows=data.data.slice();else if(data&&data.data)for(var k in data.data)(data.data[k]||[]).forEach(function(x){rows.push(x)});return rows}
function loadHistory(){var name=document.getElementById("studentName").value;if(!name){alert("请先选择姓名");return}document.getElementById("app").innerHTML='<div class="empty">正在读取学习记录...</div>';fetch(sourceUrl()).then(function(r){return r.json()}).then(function(d){var rows=flatten(d).filter(function(x){return String(val(x,["studentName","name","姓名","学生姓名"],IDX.student))===name});renderHistory(rows,name)}).catch(function(){document.getElementById("app").innerHTML='<div class="empty">暂时无法读取报告，请稍后重试。</div>'})}
function buildByLesson(rows){var by={};rows.forEach(function(x){var id=lessonId(x);if(!id)return;var a=by[id]||(by[id]={rows:[],score:0,total:0,correct:0,pre:0,mid:0,post:0});var st=stageOf(x),sc=num(x,["score","得分"],IDX.score),tt=num(x,["total","总分"],IDX.total);a.rows.push(x);a.score+=sc;a.total+=tt;if(st==="pre")a.pre++;if(st==="mid"){a.mid++;if(isCorrect(x))a.correct++}if(st==="post")a.post++}) ;return by}
function stageAdvice(done,rate,pending){if(!done)return"本阶段还没有足够数据，先完成预习、课堂互动和课后任务。";if(pending)return"本阶段还有主观题或书写任务等待教师反馈，收到反馈后优先订正。";if(rate>=85)return"本阶段整体表现稳定，可以继续做表达输出和跨课复现练习。";if(rate>=60)return"本阶段基础已经建立，建议复习错题和低分课程。";return"本阶段需要重新巩固核心生词、句型和汉字认读，再进入下一轮练习。"}
function renderHistory(rows,name){var courses=window.HSK1_CURRICULUM||[],blocks=window.HSK1_REPORT_BLOCKS||[],by=buildByLesson(rows),ids=Object.keys(by).sort(function(a,b){return lessonNo(a)-lessonNo(b)}),score=ids.reduce(function(s,id){return s+by[id].score},0),total=ids.reduce(function(s,id){return s+by[id].total},0),mid=ids.reduce(function(s,id){return s+by[id].mid},0),correct=ids.reduce(function(s,id){return s+by[id].correct},0);var h='<section class="panel"><h2>'+esc(name)+' 的学习概览</h2><div class="grid"><div class="kpi"><b>'+ids.length+'</b><span>已有记录课程</span></div><div class="kpi"><b>'+score+'/'+total+'</b><span>累计得分</span></div><div class="kpi"><b>'+(total?Math.round(score/total*100):0)+'%</b><span>累计准确率</span></div><div class="kpi"><b>'+(mid?Math.round(correct/mid*100):0)+'%</b><span>课中正确率</span></div></div></section>';
  h+='<section class="panel"><h2>课程历史趋势</h2>'+(ids.length?ids.map(function(id){var a=by[id],info=courses.filter(function(c){return c.id===id})[0]||{title:id,en:""};return'<div class="lesson"><div><h3>'+esc(id+' · '+(info.title||""))+'</h3><div class="muted">课前 '+a.pre+' 条 · 课中 '+a.mid+' 条 · 课后 '+a.post+' 条</div></div><div class="score">'+a.score+'/'+a.total+' · '+(a.total?Math.round(a.score/a.total*100):0)+'%</div></div>'}).join(""):'<div class="empty">暂无历史课程数据。</div>')+'</section>';
  h+='<section class="panel"><h2>阶段报告</h2>'+blocks.map(function(b){var lessonIds=courses.filter(function(c){return c.no>=b.from&&c.no<=b.to}).map(function(c){return c.id}),arr=lessonIds.filter(function(id){return by[id]}),s=arr.reduce(function(v,id){return v+by[id].score},0),t=arr.reduce(function(v,id){return v+by[id].total},0),pre=arr.reduce(function(v,id){return v+by[id].pre},0),m=arr.reduce(function(v,id){return v+by[id].mid},0),post=arr.reduce(function(v,id){return v+by[id].post},0),rate=t?Math.round(s/t*100):0,cls=arr.length?rate>=80?"good":"warn":"empty-block";return'<div class="block '+cls+'"><h3>'+esc(b.label)+'</h3><div class="muted">已记录 '+arr.length+' / '+lessonIds.length+' 课 · 阶段得分 '+s+'/'+t+' · 阶段准确率 '+rate+'%</div><div class="muted">课前 '+pre+' 条 · 课中 '+m+' 条 · 课后 '+post+' 条</div><div class="tips">'+esc(stageAdvice(arr.length,rate,false))+'</div></div>'}).join("")+'</section>';
  document.getElementById("app").innerHTML=h}
init();
</script>
</body>
</html>
