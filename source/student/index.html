<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClassPro+ HSK学习探索之旅</title>
  <link rel="stylesheet" href="../shared/classpro-theme.css">
  <link rel="stylesheet" href="./home.css">
  <script src="../data-model/hsk1-curriculum.js"></script>
  <script src="../data-model/hsk3-curriculum.js"></script>
  <script src="../shared/course-catalog.js"></script>
  <script src="../shared/context.js"></script>
  <script src="../shared/progress-rules.js"></script>
  <script src="../shared/progress-data.js"></script>
</head>
<body>
  <main class="student-shell">
    <header class="student-topbar">
      <div class="cp-brand">
        <svg class="cp-brand-mark" viewBox="0 0 96 96" role="img" aria-label="ClassPro 蒲公英"><g fill="none" stroke="#0d5b43" stroke-linecap="round"><path d="M47 45c-2 18-4 31-13 43" stroke-width="3"/><path d="M45 69c10-3 16-8 20-15" stroke-width="2"/><path d="M45 48 24 29M47 46 47 18M50 47 71 27M43 46 18 48M51 50 77 49M45 43 34 21M50 44 62 18" stroke-width="2"/></g><g fill="#0d5b43"><circle cx="47" cy="46" r="5"/><circle cx="19" cy="48" r="3"/><circle cx="24" cy="29" r="3"/><circle cx="34" cy="20" r="3"/><circle cx="47" cy="17" r="3"/><circle cx="62" cy="17" r="3"/><circle cx="72" cy="26" r="3"/><circle cx="78" cy="49" r="3"/></g><g fill="#ef8d45"><circle cx="81" cy="19" r="2.5"/><circle cx="88" cy="27" r="2"/><circle cx="84" cy="38" r="1.8"/></g></svg>
        <div><div class="cp-brand-name">CHINESE CLASSPRO+</div><div class="cp-brand-note">我的中文旅程 / My Journey</div></div>
      </div>
      <span class="cp-pill" id="studentBadge">Student</span>
    </header>

    <section class="journey-hero">
      <div class="cp-eyebrow">Light adventure</div>
      <h1>HSK学习探索之旅</h1>
      <p>完成每一站的学习任务，让蒲公英种子落地发芽。</p>
      <div class="hero-meta"><span id="currentLessonBadge">当前课程</span><span id="roomBadge">房间 8888</span></div>
    </section>

    <section class="journey-toolbar cp-panel">
      <div class="level-tabs" id="levelTabs" aria-label="选择课程级别"></div>
      <div class="progress-summary">
        <div class="progress-copy"><strong id="progressCount">0 / 0 已完成</strong><span id="progressStatus">三项分别达到 70%，这一课才会发芽</span></div>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
      </div>
    </section>

    <section class="map-head">
      <div><div class="cp-eyebrow">Course trail</div><h2 id="mapTitle">课程探险路径</h2></div>
      <div class="map-key"><span class="sprouted">已发芽</span><span class="lit">已点亮</span><span class="preparing">准备中</span></div>
    </section>

    <section class="adventure-map" id="adventureMap" aria-label="课程探险路径">
      <svg class="trail-svg" id="trailSvg" preserveAspectRatio="none" aria-hidden="true"><path id="trailShadow"></path><path id="trailLine"></path><path id="trailMarks"></path></svg>
      <div id="lessonNodes"></div>
    </section>

    <nav class="student-shortcuts cp-panel" aria-label="学习记录">
      <a id="currentReportLink" href="../post-class/student-report.html">本课学习报告</a>
      <a id="historyReportLink" href="history.html">历史趋势与阶段报告</a>
    </nav>
  </main>

  <dialog class="lesson-dialog" id="lessonDialog">
    <button class="dialog-close" type="button" aria-label="关闭" onclick="closeLessonDialog()">×</button>
    <header class="dialog-head"><div class="cp-eyebrow" id="dialogLessonId"></div><h2 id="dialogLessonTitle"></h2><p id="dialogLessonEnglish"></p></header>
    <div class="completion-rule"><b>完成规则</b><span>预习、课中、课后作业三项都达到 70% 以上。</span></div>
    <div class="stage-list" id="stageList"></div>
    <p class="dialog-note" id="dialogNote"></p>
  </dialog>

  <script>
    var context = window.ClassProContext.read();
    var currentLesson = window.ClassProCourseCatalog.get(context.lesson) || window.ClassProCourseCatalog.all()[0];
    var selectedLevel = currentLesson ? window.ClassProCourseCatalog.levelOf(currentLesson.id) : 'HSK1';
    var syncedProgress = {};
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbxrCd6f6cQ3wocXYQZyLKY0JutolEmOWWzTGOABnnHHJOm697OfyBlkLw-SQ-u-9ZAO/exec';

    function esc(value) { return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function lessonUrl(path, lessonId, session) { return path + '?' + window.ClassProContext.buildQuery({ lesson: lessonId, session: session || '' }); }
    function readLocal(key) { try { return localStorage.getItem(key) || ''; } catch (error) { return ''; } }
    function studentName() { return context.student || readLocal('classpro_student') || readLocal('ClassProStudentName') || 'Student'; }
    function availableLevels() { return window.ClassProCourseCatalog.levels().filter(function (level) { return level.lessons.length; }); }

    function progressCacheKey() { return 'ClassProProgressCache:' + studentName(); }
    function readProgressCache() {
      try { syncedProgress = JSON.parse(localStorage.getItem(progressCacheKey()) || '{}') || {}; } catch (error) { syncedProgress = {}; }
    }
    function saveProgressCache() { try { localStorage.setItem(progressCacheKey(), JSON.stringify(syncedProgress)); } catch (error) {} }

    function stageRates(lessonId) {
      var synced = syncedProgress[lessonId];
      if (synced) return synced.rates || synced;
      var name = studentName();
      var keys = ['ClassProLessonProgress:' + name + ':' + lessonId, 'ClassProLessonProgress:' + lessonId];
      var data = {};
      for (var i = 0; i < keys.length; i++) {
        try { data = JSON.parse(localStorage.getItem(keys[i]) || '{}'); } catch (error) { data = {}; }
        if (data && Object.keys(data).length) break;
      }
      return {
        pre_class: data.pre_class != null ? data.pre_class : data.pre,
        in_class: data.in_class != null ? data.in_class : data.in,
        post_class: data.post_class != null ? data.post_class : data.post
      };
    }

    function lessonEvaluation(lessonId) { return window.ClassProProgressRules.evaluate(stageRates(lessonId)); }
    function rateText(rate) { return Math.round(rate * 100) + '%'; }

    function selectLevel(levelId) {
      selectedLevel = levelId;
      var lessons = window.ClassProCourseCatalog.lessons(levelId);
      if (!lessons.some(function (lesson) { return currentLesson && lesson.id === currentLesson.id; })) currentLesson = lessons.filter(function (lesson) { return lesson.openForUse; })[0] || lessons[0] || null;
      if (currentLesson) context = window.ClassProContext.save({ lesson: currentLesson.id, session: '' });
      render();
      syncProgress();
    }

    function selectLesson(lesson) {
      if (!lesson) return;
      currentLesson = lesson;
      context = window.ClassProContext.save({ lesson: lesson.id, session: '' });
      history.replaceState({}, '', '?' + window.ClassProContext.buildQuery(context));
      render();
      openLessonDialog(lesson);
    }

    function nodeState(lesson) {
      if (lessonEvaluation(lesson.id).complete) return 'done';
      if (!lesson.openForUse) return 'future';
      if (currentLesson && lesson.id === currentLesson.id) return 'current';
      return 'ready';
    }

    function renderLevels() {
      document.getElementById('levelTabs').innerHTML = availableLevels().map(function (level) {
        return '<button type="button" class="level-tab' + (level.id === selectedLevel ? ' active' : '') + '" onclick="selectLevel(\'' + level.id + '\')">' + esc(level.name) + '<small>' + level.lessons.length + '课</small></button>';
      }).join('');
    }

    function mapPositions(count) {
      var compact = !window.matchMedia('(max-width: 620px)').matches;
      var positions = [], columns = compact ? [9, 25.4, 41.8, 58.2, 74.6, 91] : [18, 50, 82];
      var perRow = columns.length, rowGap = compact ? 142 : 132;
      for (var i = 0; i < count; i++) {
        var row = Math.floor(i / perRow), offset = i % perRow;
        positions.push([row % 2 ? columns[perRow - 1 - offset] : columns[offset], 82 + row * rowGap]);
      }
      return positions;
    }

    function lessonMarker(index, state, number) {
      var icons = ['✈','💡','🏡','🏨','📷','🥡','💍','🏔','🤝','📦','🧩','🌦','🗽','📖','🎤','🧭','🎁','🏆'];
      return '<span class="node-icon">' + (state === 'done' ? '🌱' : icons[index % icons.length]) + '</span><b>' + number + '</b>';
    }

    function renderMap() {
      var lessons = window.ClassProCourseCatalog.lessons(selectedLevel), positions = mapPositions(lessons.length);
      var perRow = window.matchMedia('(max-width: 620px)').matches ? 3 : 6;
      var rows = Math.ceil(lessons.length / perRow), height = Math.max(300, 76 + rows * (perRow === 6 ? 142 : 132));
      var map = document.getElementById('adventureMap'), svg = document.getElementById('trailSvg');
      map.style.height = height + 'px';
      svg.setAttribute('viewBox', '0 0 1000 ' + height);
      var path = positions.map(function (point, index) { return (index ? 'L ' : 'M ') + (point[0] * 10) + ' ' + point[1]; }).join(' ');
      document.getElementById('trailShadow').setAttribute('d', path);
      document.getElementById('trailLine').setAttribute('d', path);
      document.getElementById('trailMarks').setAttribute('d', path);
      document.getElementById('lessonNodes').innerHTML = lessons.map(function (lesson, index) {
        var state = nodeState(lesson), hue = (index * 47 + 32) % 360;
        return '<button type="button" class="lesson-node ' + state + ' tile-shape-' + (index % 4) + '" style="left:' + positions[index][0] + '%;top:' + positions[index][1] + 'px;--tile-bg:hsl(' + hue + ' 78% 76%);--tile-ink:hsl(' + hue + ' 58% 25%)" onclick="selectLesson(window.ClassProCourseCatalog.get(\'' + lesson.id + '\'))" aria-label="第' + lesson.no + '课 ' + esc(lesson.title) + '"><span class="node-orb">' + lessonMarker(index,state,lesson.no) + '</span><span class="node-label">' + esc(lesson.title) + '</span></button>';
      }).join('');
      var completed = lessons.filter(function (lesson) { return lessonEvaluation(lesson.id).complete; }).length;
      document.getElementById('progressCount').textContent = completed + ' / ' + lessons.length + ' 已完成';
      document.getElementById('progressBar').style.width = (lessons.length ? completed / lessons.length * 100 : 0) + '%';
      document.getElementById('mapTitle').textContent = selectedLevel + ' 探险路径';
    }

    function stageLinks(lesson, stage) {
      var paths = { pre_class: '../pre-class/index.html', in_class: '../in-class/student.html', post_class: '../post-class/student-report.html', review: '../post-class/review-resources.html' };
      if (!lesson.openForUse) return '<span class="stage-unavailable">内容准备中</span>';
      if (stage === 'in_class' || window.ClassProCourseCatalog.levelOf(lesson.id) !== 'HSK3') return '<a class="stage-action" href="' + lessonUrl(paths[stage], lesson.id, '') + '">进入</a>';
      return ['A', 'B', 'C'].map(function (session) { return '<a class="session-action" href="' + lessonUrl(paths[stage], lesson.id, session) + '">' + session + '</a>'; }).join('');
    }

    function openLessonDialog(lesson) {
      if (!lesson) return;
      var evaluation = lessonEvaluation(lesson.id);
      document.getElementById('dialogLessonId').textContent = lesson.id + (evaluation.complete ? ' · 种子已发芽' : lesson.openForUse ? ' · 课程已点亮' : ' · 内容准备中');
      document.getElementById('dialogLessonTitle').textContent = lesson.title;
      document.getElementById('dialogLessonEnglish').textContent = lesson.en || '';
      var stages = [['pre_class', '🌱', '课前预习', 'Pre-class'], ['in_class', '🎯', '课中学习', 'In-class'], ['post_class', '✺', '课后作业', 'Post-class']];
      document.getElementById('stageList').innerHTML = stages.map(function (stage) {
        var rate = evaluation.rates[stage[0]];
        return '<div class="stage-item"><span class="stage-icon">' + stage[1] + '</span><div class="stage-copy"><b>' + stage[2] + '</b><small>' + stage[3] + ' · ' + rateText(rate) + '</small><i><span style="width:' + (rate * 100) + '%"></span></i></div><div class="stage-links">' + stageLinks(lesson, stage[0]) + '</div></div>';
      }).join('') + '<div class="review-row"><span>复习资源不计入完成率，可随时进入。</span><div class="stage-links">' + stageLinks(lesson, 'review') + '</div></div>';
      document.getElementById('dialogNote').textContent = evaluation.complete ? '三项均已达到 70%，本课种子已经发芽。' : '尚未达到完成标准；继续完成三阶段任务即可。';
      var dialog = document.getElementById('lessonDialog');
      if (dialog.showModal) dialog.showModal(); else dialog.setAttribute('open', '');
    }

    function closeLessonDialog() { var dialog = document.getElementById('lessonDialog'); if (dialog.close) dialog.close(); else dialog.removeAttribute('open'); }

    function render() {
      if (!currentLesson) return;
      document.getElementById('studentBadge').textContent = studentName();
      document.getElementById('currentLessonBadge').textContent = currentLesson.id + ' · ' + currentLesson.title;
      document.getElementById('roomBadge').textContent = '房间 ' + context.room;
      document.getElementById('currentReportLink').href = lessonUrl('../post-class/student-report.html', currentLesson.id, '');
      document.getElementById('historyReportLink').href = lessonUrl('history.html', currentLesson.id, '');
      renderLevels();
      renderMap();
    }

    function fetchJson(url, timeout) {
      var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = controller ? setTimeout(function () { controller.abort(); }, timeout || 12000) : null;
      return fetch(url, controller ? { signal: controller.signal } : {}).then(function (response) {
        if (!response.ok) throw new Error('Progress API ' + response.status);
        return response.json();
      }).then(function (data) { if (timer) clearTimeout(timer); return data; }, function (error) { if (timer) clearTimeout(timer); throw error; });
    }

    function fetchLegacyLessonProgress(lessons) {
      var queue = lessons.slice(), workers = [];
      function next() {
        var lesson = queue.shift();
        if (!lesson) return Promise.resolve();
        return fetchJson(GAS_URL + '?action=get_data&lesson=' + encodeURIComponent(lesson.id), 15000).then(function (data) {
          syncedProgress[lesson.id] = window.ClassProProgressData.fromRows((data && data.data) || [], { student: studentName(), lesson: lesson.id });
        }).catch(function () {}).then(next);
      }
      for (var i = 0; i < Math.min(3, lessons.length); i++) workers.push(next());
      return Promise.all(workers);
    }

    function syncProgress() {
      var lessons = window.ClassProCourseCatalog.lessons(selectedLevel);
      if (!lessons.length) return;
      document.getElementById('progressStatus').textContent = '正在同步 Google Sheets 学习记录…';
      var ids = lessons.map(function (lesson) { return lesson.id; });
      var url = GAS_URL + '?action=get_progress&student=' + encodeURIComponent(studentName()) + '&lessons=' + encodeURIComponent(ids.join(','));
      fetchJson(url, 18000).then(function (data) {
        if (!data || data.status !== 'ok' || !data.lessons) throw new Error('compact progress unavailable');
        Object.keys(data.lessons).forEach(function (lessonId) { syncedProgress[lessonId] = data.lessons[lessonId]; });
      }).catch(function () {
        return selectedLevel === 'HSK3' ? fetchLegacyLessonProgress(lessons) : Promise.reject(new Error('legacy sync skipped'));
      }).then(function () {
        saveProgressCache();
        renderMap();
        document.getElementById('progressStatus').textContent = '已同步学习记录 · 三项分别达到 70% 才会发芽';
      }).catch(function () {
        document.getElementById('progressStatus').textContent = '暂时无法同步，当前显示上次缓存记录';
      });
    }

    readProgressCache();
    render();
    syncProgress();
    var mapResizeTimer = 0;
    window.addEventListener('resize', function () { clearTimeout(mapResizeTimer); mapResizeTimer = setTimeout(renderMap, 120); });
  </script>
</body>
</html>
