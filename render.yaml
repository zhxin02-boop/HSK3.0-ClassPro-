services:
  - type: web
    name: classpro-teacher-pilot
    runtime: node
    region: singapore
    plan: free
    buildCommand: echo "No build step required"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: CLASSPRO_TEACHER_ACCOUNTS_FILE
        value: /etc/secrets/teacher-accounts.json
      - key: CLASSPRO_SESSION_SECRET
        generateValue: true
