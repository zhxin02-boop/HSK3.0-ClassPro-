services:
  - type: web
    name: classpro-teacher-pilot
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: CLASSPRO_TEACHER_ACCOUNTS_FILE
        value: /etc/secrets/teacher-accounts.json
      - key: CLASSPRO_CLASS_ROSTERS_FILE
        value: /etc/secrets/class-rosters.json
      - key: CLASSPRO_SESSION_SECRET
        generateValue: true
